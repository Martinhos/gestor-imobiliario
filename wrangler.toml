# Configuração do worker. Os ids de D1/KV são preenchidos a partir dos
# outputs do Terraform (terraform/) — ver .github/workflows/deploy.yml.

name = "gestor-imobiliario"
main = "worker/src/index.js"
compatibility_date = "2026-08-01"

# Os domínios. A zona rendorium.com vive nesta conta Cloudflare, por isso o
# deploy cria os registos DNS sozinho. O endereço workers.dev continua a
# servir: as instalações antigas (PWA e APK) apontam para lá e não podem
# partir. A app canónica é app.; a raiz e o www servem a landing.
# Definir routes desliga o workers.dev por omissão — e as instalações
# antigas vivem lá. Fica ligado à mão, explicitamente.
workers_dev = true
routes = [
  { pattern = "app.rendorium.com", custom_domain = true },
  { pattern = "rendorium.com", custom_domain = true },
  { pattern = "www.rendorium.com", custom_domain = true },
]

[assets]
directory = "web"
binding = "ASSETS"
# Os assets respondem ANTES do worker por omissao — e "/" batia no
# index.html da app em qualquer hostname, tapando a landing do apex/www.
# So a raiz passa pelo worker (que decide landing ou app); o resto dos
# ficheiros continua a servir-se direto. O manifesto tambem passa: fora de
# producao o worker reescreve-o com o nome e os icones de dev
# (worker/src/lib/identidade.js); em producao sai tal e qual.
run_worker_first = ["/", "/manifest.webmanifest"]

[[d1_databases]]
binding = "DB"
database_name = "gestor-imobiliario"
database_id = "PLACEHOLDER_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "PLACEHOLDER_KV_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "gestor-imobiliario"

# O que o worker mede sobre si próprio (lib/medidas.js): um ponto por pedido
# e um por relato, sem dados de pessoas. Três meses de retenção, consulta por
# SQL, e no plano gratuito: 100.000 pontos por dia — o projeto não chega a um
# décimo disso.
#
# À ESPERA DO PAINEL. O Analytics Engine tem de ser ligado uma vez na conta
# (Workers & Pages → Analytics Engine → Enable); com a ligação declarada antes
# disso o deploy é recusado com o código 10089, e foi o que aconteceu ao dev. O
# código (lib/medidas.js) é inerte sem env.MEDIDAS. Depois de ligar, é tirar o
# cardinal a estas três linhas e às três do dev.
# [[analytics_engine_datasets]]
# binding = "MEDIDAS"
# dataset = "rendorium"

# Duas rotinas: a cópia da base e o resumo do consumo às 09:00, e uma vigia
# dos limites de hora a hora — um pico às 10:00 só aparecia no resumo da
# manhã seguinte, quando já não havia nada a fazer.
[triggers]
crons = ["0 9 * * *", "0 * * * *"]

# Entrada com Google (id público; vazio = botão escondido).
# Cria um OAuth Client ID (Web) em console.cloud.google.com e autoriza
# as origens https://app.rendorium.com e (a antiga)
# https://gestor-imobiliario.martinhos.workers.dev.
# Não é preciso client secret: o fluxo usa o ID token, verificado no worker.
[vars]
GOOGLE_CLIENT_ID = "34372660209-our5uhdtk77vnfo34nf64u1m9o2c3erl.apps.googleusercontent.com"
# Tecto de contas enquanto o serviço vive do plano gratuito da Cloudflare.
# O limite real é a D1: 5M linhas lidas e 100k escritas por dia. Com o
# consumo medido por utilizador ativo, ~2200 contas esgotam-no; ficamos a 90%.
MAX_USERS = "2000"

# Os avisos para o Discord e o token de análise são segredos, definidos com
# `wrangler secret put` ou pelo CI:
#   DISCORD_DEV_WEBHOOK      · canal de quem programa: erros e falhas de deploy
#   DISCORD_SUPORTE_WEBHOOK  · canal de suporte: pedidos contados por pessoas
#   DISCORD_SUPORTE_CHANNEL  · o mesmo canal, para o bot poder pôr botões
#   DISCORD_ADMIN_WEBHOOK    · canal de quem opera: consumo diário
#
# Papéis do bot. Cada um aceita ids de pessoa ou ids de cargo do Discord,
# separados por vírgulas ou espaços — com cargos, entra e sai gente sem tocar
# nos segredos. Sem nenhum definido, quem tiver acesso ao servidor é master:
# numa instalação nova, o único que lá chega é quem instalou o bot.
#   DISCORD_MASTER   · dono: pode tudo, hoje e o que vier a existir
#   DISCORD_ADMINS   · opera: consumo, cópias, e tudo o que os outros veem
#   DISCORD_DEVS     · constrói: erros da app e do servidor, infra, segurança
#   DISCORD_SUPORTE  · fala com quem usa: só os pedidos contados por pessoas
#   CF_ANALYTICS_TOKEN     · token com Account Analytics · Read
#   CF_ACCOUNT_ID          · id da conta Cloudflare

# ---------------------------------------------------------------------------
# Ambiente de desenvolvimento: mesmo código, base e sessões separadas.
# Publica-se com `wrangler deploy --env dev`, ou por push no ramo dev.
# Um ambiente não herda os blocos do outro — daí a repetição.
# ---------------------------------------------------------------------------
[env.dev]
name = "gestor-imobiliario-dev"
workers_dev = true
routes = [
  { pattern = "dev.rendorium.com", custom_domain = true },
]

[env.dev.assets]
directory = "web"
binding = "ASSETS"
# No dev passam TODOS os ficheiros pelo worker, e não só o «/» e o manifesto:
# é a porta do dev (worker/src/teste.js) que decide quem os vê — só quem
# traz a sessão de uma conta de teste, a da ligação do /test. Um ficheiro que
# não passasse por aqui era servido a qualquer pessoa. Um "/*" (ou o true)
# fazia o mesmo, mas o "/" e o manifesto ficam ditos como na produção
# (testes/app-dev-web.test.js) e o wrangler recusa um "/*" ao lado deles
# (torna-os redundantes). Daí os padrões: "/*/*" apanha tudo o que está
# numa pasta, as extensões apanham o que está na raiz de web/, e o "/index"
# é a forma sem extensão que os assets também servem. Um ficheiro novo na raiz com outra extensão tem de
# entrar aqui — o testes/porta-dev.test.js confere a lista contra a pasta e
# contra o que o deploy lá escreve (o APK, /gestor-imobiliario.apk).
# O custo: cada ficheiro pedido no dev é uma invocação do worker.
run_worker_first = ["/", "/manifest.webmanifest", "/index", "/*/*", "/*.html", "/*.js", "/*.css", "/*.png", "/*.json", "/*.webp", "/*.svg", "/*.ico", "/*.txt", "/*.xml", "/*.woff2", "/*.apk"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "gestor-imobiliario-dev"
database_id = "PLACEHOLDER_D1_DEV_ID"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "PLACEHOLDER_KV_DEV_ID"

[[env.dev.r2_buckets]]
binding = "FILES"
bucket_name = "gestor-imobiliario-dev"

# as medidas do dev vão para um conjunto à parte, para não se somarem às de produção
# [[env.dev.analytics_engine_datasets]]
# binding = "MEDIDAS"
# dataset = "rendorium_dev"

[env.dev.vars]
# O mesmo cliente OAuth da produção: a consola da Google aceita várias origens
# autorizadas por cliente. Para isto funcionar, o endereço de dev tem de estar
# em "Origens JavaScript autorizadas" — sem isso o botão aparece e a Google
# recusa-o com origin_mismatch.
GOOGLE_CLIENT_ID = "34372660209-our5uhdtk77vnfo34nf64u1m9o2c3erl.apps.googleusercontent.com"
MAX_USERS = "50"
ENV_NAME = "dev"
# A porta do dev (worker/src/teste.js): com ENV_NAME "dev" e isto, só as
# sessões das contas de teste (as ligações do /test) veem o ambiente; o resto
# é um 404 seco. Fora daqui não existe: a produção não tem ENV_NAME e o
# percurso corre com ENV_NAME "percurso", sem esta variável.
PORTA_DEV = "fechada"
