name: Interface

# Corre a app a sério num browser e verifica o interface em todos os estados.
# Separado dos testes unitários porque é lento (descarrega um browser) e
# porque falha por razões diferentes: ali é a lógica, aqui é o que se vê.
on:
  pull_request:
    # o package.json entra para um bump do playwright ser exercitado antes de
    # se fundir — o Dependabot abre esses PRs e sem isto passavam sem percurso.
    # O worker, as migrações e o wrangler.toml entram porque o percurso corre
    # contra um wrangler dev a sério e entra pela API — cria a conta, semeia,
    # lê o estado: uma alteração ao registo, ao /api/state ou uma migração que
    # partisse o arranque passavam sem ele. As duas listas são a mesma.
    paths: ['web/**', 'worker/**', 'migrations/**', 'wrangler.toml', 'testes/ui/**', '.github/workflows/interface.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main, dev]
    paths: ['web/**', 'worker/**', 'migrations/**', 'wrangler.toml', 'testes/ui/**', '.github/workflows/interface.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
    inputs:
      avaliar:
        description: Pedir também um parecer do modelo sobre a qualidade
        type: boolean
        default: false

# Três pushes seguidos ao mesmo ramo pagavam três corridas inteiras. Cancela-se
# a anterior — mas só em pull request: um push a main ou a dev é uma promoção
# ou uma publicação, e essas têm de acabar, senão fica um check «cancelled»
# precisamente onde o guarda da chegada corre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  percurso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - run: npm ci --no-audit --no-fund

      # O browser são ~150 MB por corrida, e não muda entre corridas. A cache
      # das Actions é uma verba à parte (10 GB por repositório) que não conta
      # para os 500 MB dos artefactos. O --with-deps instala também pacotes
      # apt que não vivem nesta pasta, por isso com a cache a acertar só se
      # repõem esses.
      - name: Cache do browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Os dois passos fazem apt-get update, que puxa TODOS os repositórios do
      # runner — incluindo um da Microsoft que não usamos e que às vezes responde
      # 403. Com ~230 corridas por mês, um apt que espirra custava uma reexecução
      # de cada vez. Três tentativas com quinze segundos entre elas.
      - name: Instalar o browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: |
          for tentativa in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "o apt falhou (tentativa $tentativa) — a repetir"; sleep 15
          done
          exit 1

      - name: Repor as dependências do sistema
        if: steps.browser.outputs.cache-hit == 'true'
        run: |
          for tentativa in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "o apt falhou (tentativa $tentativa) — a repetir"; sleep 15
          done
          exit 1

      # Base local: o percurso cria a conta e semeia os dados, e não toca em
      # nada que esteja publicado.
      - name: Preparar a base local
        run: npx wrangler@4 d1 migrations apply gestor-imobiliario --local

      # ENV_NAME faz a app comportar-se como fora de produção — é o que
      # permite semear os dados de exemplo. Em produção o seed é recusado de
      # propósito, e sem isto o percurso corria sobre uma app vazia.
      - name: Levantar a app
        run: |
          npx wrangler@4 dev --port 8788 --var ENV_NAME:percurso > /tmp/app.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/; then echo "a app respondeu"; exit 0; fi
            sleep 2
          done
          echo "a app não arrancou"; tail -40 /tmp/app.log; exit 1

      # É isto que trava o processo: regras duras sobre o que se vê, e também
      # uma cena que não se monta, um erro na página e um erro na consola fora
      # do ruído conhecido do Google Sign-In (testes/ui/percorrer.js:veredicto).
      - name: Percorrer e verificar
        run: node testes/ui/percorrer.js

      # O parecer do modelo é opinião, não regra: nunca trava o processo.
      # Sem a chave definida, o próprio script não faz nada e devolve 0.
      - name: Parecer sobre a qualidade
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.avaliar }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node testes/ui/avaliar.js

      # Falhando, as capturas dizem mais do que qualquer mensagem de erro. E
      # só aí: guardavam-se em TODAS as corridas, catorze dias, 11 MB cada —
      # 1,9 GB contra os 500 MB do plano. Numa corrida verde ninguém as abre.
      # A exceção é a avaliação pedida à mão, que acaba verde e cujo parecer
      # (relatorio/avaliacao.md) é o que se quer ler.
      - name: Guardar as capturas
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.avaliar)
        uses: actions/upload-artifact@v4
        with:
          name: interface-${{ github.run_id }}
          path: testes/ui/relatorio/
          retention-days: 3
          if-no-files-found: warn
