name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Onde publicar
        type: choice
        options: [producao, dev]
        default: producao
      aceitar_destruicao:
        description: "Só para um plano do terraform que destrói ou substitui recursos: os endereços aceites, separados por espaços (ex. cloudflare_r2_bucket.files_dev). Vazio num deploy normal."
        type: string
        default: ""
      terraform_sem_estado:
        description: "Continuar mesmo que o estado do terraform não esteja no R2. Só na primeira corrida depois de o estado ser posto lá, ou para o recriar de propósito — sem ele, o plano propõe criar de novo a base e os baldes."
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # para mover a etiqueta «publicado»
  actions: read # para ver se o «Testes» deste commit passou

jobs:
  deploy:
    runs-on: ubuntu-latest
    # O deploy faz commit do estado do terraform de volta ao repo, e esse push
    # dispararia outro deploy. Cortar o ciclo pelo autor, e não por um marcador
    # na mensagem: um "[skip ci]" fica gravado no histórico e viaja para dentro
    # de qualquer squash que atravesse esse commit, saltando deploys que nada
    # tinham a ver com ele.
    if: github.actor != 'github-actions[bot]'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # o balde onde vive o estado do terraform (nunca no repositório)
      TF_BALDE: gestor-imobiliario-infra
    steps:
      # histórico todo, e as etiquetas: o guarda da chegada compara esta
      # árvore com a da publicação anterior (a etiqueta «publicado»)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # a documentação sai do código no momento do deploy — nunca fica atrás
      - name: Gerar a documentação
        run: node scripts/gerar-docs.js

      # Produção sai do ramo main; tudo o resto vai para o ambiente de dev.
      - name: Escolher ambiente
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ inputs.ambiente }}" != "dev" ]; then
            echo "ENV_FLAG=" >> $GITHUB_ENV
            echo "DB_NAME=gestor-imobiliario" >> $GITHUB_ENV
            echo "ENV_LABEL=produção" >> $GITHUB_ENV
            echo "IS_PROD=1" >> $GITHUB_ENV
            echo "APP_URL=https://app.rendorium.com" >> $GITHUB_ENV
          else
            echo "ENV_FLAG=--env dev" >> $GITHUB_ENV
            echo "DB_NAME=gestor-imobiliario-dev" >> $GITHUB_ENV
            echo "ENV_LABEL=dev" >> $GITHUB_ENV
            echo "IS_PROD=" >> $GITHUB_ENV
            echo "APP_URL=https://dev.rendorium.com" >> $GITHUB_ENV
          fi

      - name: Onde vai isto
        run: echo "A publicar para **$ENV_LABEL**" >> $GITHUB_STEP_SUMMARY

      # O último guarda antes de produção, e o que conta: o do pull request
      # avisa cedo, mas nem toda a promoção passa por um.
      #
      # Compara com a PUBLICAÇÃO ANTERIOR, que é a etiqueta «publicado»: o
      # deploy move-a no fim, só depois de confirmar que o worker novo
      # responde (passo «Marcar o que está em produção»). Não se tira do
      # histórico: o HEAD^1 só é a publicação anterior quando a promoção é um
      # merge — e era-o por acidente, porque o commit do estado do terraform
      # fazia o main divergir do dev a cada deploy. Num avanço rápido, o
      # HEAD^1 é o penúltimo commit do dev, e uma alteração à web sem versão
      # nova seguida de outra só no worker passava (testes/chegada.test.js).
      # O HEAD^1 fica atrás da etiqueta só para a primeira vez, antes de ela
      # existir — e aí o main ainda diverge, a promoção é um merge.
      #
      # Corre também no workflow_dispatch: a saída de emergência para voltar a
      # publicar o mesmo conteúdo compara-se com a etiqueta e não encontra
      # nada mudado; um conteúdo que o guarda recusou num push não sai por ela.
      #
      # Em dev não se aplica: lá não há cache a proteger, e a versão sobe uma
      # vez por promoção e não a cada publicação.
      - name: Confirmar que esta publicação chega a quem tem a app
        if: env.IS_PROD
        run: node scripts/chegada.js refs/tags/publicado HEAD^1

      # O APK compila-se nos dois ambientes, cada um o seu flavor
      # (android/app/build.gradle): o de produção leva app.rendorium.com lá
      # dentro; o de dev leva dev.rendorium.com, chama-se «Rendorium DEV» e
      # instala-se ao lado do de produção. Fica aqui, antes de «Esperar pelos
      # testes», de propósito: é só do runner, e compila enquanto eles correm.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A chave de assinatura vive aqui, e não no repositório: a anterior esteve
      # versionada com a palavra-passe em claro e, com o repositório público,
      # conta-se como comprometida (android/README.md). Escreve-se no disco do
      # runner, que morre com o trabalho, e nunca no diretório do projeto.
      #
      # Em dev prefere-se a chave de dev (segredos ANDROID_KEYSTORE_DEV_B64 e
      # ANDROID_KEYSTORE_DEV_PASS), e a de produção nem se escreve no disco;
      # sem esses segredos cai-se na de produção, e o resumo di-lo. O Gradle
      # escolhe pelo flavor: lê ANDROID_KEYSTORE_DEV_FILE para o dev e
      # ANDROID_KEYSTORE_FILE para o resto (e para o dev quando não há a dele).
      - name: Escrever a chave de assinatura
        env:
          CHAVE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CHAVE_DEV_B64: ${{ secrets.ANDROID_KEYSTORE_DEV_B64 }}
          CHAVE_DEV_PASS: ${{ secrets.ANDROID_KEYSTORE_DEV_PASS }}
        run: |
          set -e
          if [ -z "$IS_PROD" ] && [ -n "$CHAVE_DEV_B64" ] && [ -n "$CHAVE_DEV_PASS" ]; then
            printf '%s' "$CHAVE_DEV_B64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
            echo "ANDROID_KEYSTORE_DEV_FILE=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"
            echo "O APK de dev vai assinado com a chave de dev."
            exit 0
          fi
          if [ -z "$CHAVE_B64" ]; then
            echo "Falta o segredo ANDROID_KEYSTORE_B64 — sem ele o APK sairia com outra chave e ninguém o instalava por cima." >&2
            exit 1
          fi
          printf '%s' "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          if [ -z "$IS_PROD" ]; then
            echo "O APK de dev vai assinado com a chave de produção: faltam os segredos ANDROID_KEYSTORE_DEV_B64 e ANDROID_KEYSTORE_DEV_PASS (android/README.md, «Chave de dev»)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # A tarefa é a do flavor do ambiente; o ficheiro vai sempre para o mesmo
      # sítio, porque as Definições da app apontam para /gestor-imobiliario.apk
      # — em dev.rendorium.com é o APK de dev que lá está.
      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_DEV_PASS: ${{ secrets.ANDROID_KEYSTORE_DEV_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$IS_PROD" ]; then
            ./gradlew --no-daemon assembleProducaoRelease
            cp app/build/outputs/apk/producao/release/app-producao-release.apk ../web/gestor-imobiliario.apk
          else
            ./gradlew --no-daemon assembleDevRelease
            cp app/build/outputs/apk/dev/release/app-dev-release.apk ../web/gestor-imobiliario.apk
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Só se publica com os testes verdes. O «Testes» (testes.yml) corre no
      # mesmo push, em paralelo e sem dependência nenhuma deste — e sem
      # proteção de ramo no plano gratuito, nada o fazia travar a publicação.
      # Este passo espera pela corrida DESTE commit (basta uma verde: num
      # avanço rápido do dev para o main o mesmo commit tem duas) e fica antes
      # do primeiro passo que mexe em alguma coisa lá fora, o terraform. O que
      # vem antes é só do runner: o APK compila enquanto os testes correm.
      #
      # O workflow_dispatch passa pela mesma porta — republica um commit que
      # já teve os testes verdes. Um commit sem corrida (o do estado do
      # terraform, que não dispara workflows) pede o «Testes» à mão primeiro;
      # a mensagem diz como.
      - name: Esperar pelos testes deste commit
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/entrega.js testes

      # A infraestrutura dos dois ambientes é criada a partir do main, que é
      # quem manda no estado. O ramo dev só lê os ids que já lá estão.
      #
      # Em produção, nunca às cegas: o plano sai para um ficheiro, o
      # entrega.js lê-o e recusa-o se destruir ou substituir alguma coisa (uma
      # D1 substituída é a base de produção a nascer vazia), e só depois se
      # aplica ESSE plano — o que se leu é o que corre. As bases e os baldes
      # têm ainda prevent_destroy no main.tf. Para destruir de propósito: tirar
      # o prevent_destroy num commit e correr este workflow à mão com os
      # endereços em «aceitar_destruicao».
      #
      # Um plano sem mudanças não se aplica: o apply só refrescava o file_size
      # da D1 (que cresce com os dados) e deixava um commit do estado por
      # deploy. TF_MUDOU diz ao passo seguinte que há estado novo a guardar.
      # O estado do terraform vive no R2, e não no repositório: o repositório é
      # público, e um estado é por natureza um ficheiro que acaba por apanhar
      # atributos sensíveis. Vai para um balde só dele, com o mesmo token que
      # publica o worker, e o bloqueio é o concurrency deste workflow — só corre
      # um deploy de cada vez, por ramo.
      #
      # Se o estado não estiver lá, PARA-SE. Sem ele o plano proporia criar de
      # novo a base, os baldes e as sessões, e o que protege os dados é
      # precisamente o estado saber que eles já existem.
      - name: Trazer o estado do terraform
        env:
          SEM_ESTADO: ${{ inputs.terraform_sem_estado }}
        run: |
          set -e
          # para um ficheiro à parte, e só se copia por cima com conteúdo: o
          # wrangler cria o destino vazio quando o objeto não existe, e a
          # primeira versão disto apagava assim o estado que vinha no checkout
          if npx wrangler@4 r2 object get "$TF_BALDE/terraform.tfstate" \
               --file "$RUNNER_TEMP/tfstate" --remote >/dev/null 2>&1 && [ -s "$RUNNER_TEMP/tfstate" ]; then
            cp "$RUNNER_TEMP/tfstate" terraform/terraform.tfstate
            echo "estado trazido do R2: $(wc -c < terraform/terraform.tfstate) bytes"
          elif [ -s terraform/terraform.tfstate ]; then
            # a mudança do repositório para o R2 faz-se sem parar nada: enquanto o
            # estado ainda estiver versionado, é esse que vale. No primeiro apply
            # depois disto, o passo do fim guarda-o no R2 e passa a ser de lá que vem.
            echo "::warning::O estado do terraform ainda vem do repositório. Põe-o no R2 (README, «Deploy (uma vez)») e tira-o do git."
          elif [ "$SEM_ESTADO" = "true" ]; then
            echo "Sem estado no R2, e foi pedido de propósito: o terraform vai tratar o que existe como novo."
          else
            {
              echo "O estado do terraform não está em r2://$TF_BALDE/terraform.tfstate."
              echo "Põe-o lá uma vez (a partir de uma cópia local do terraform/terraform.tfstate):"
              echo "  npx wrangler@4 r2 bucket create $TF_BALDE --remote"
              echo "  npx wrangler@4 r2 object put $TF_BALDE/terraform.tfstate --file terraform/terraform.tfstate --remote"
              echo "Ou volta a correr este workflow com «terraform_sem_estado» ligado, sabendo que o plano"
              echo "vai propor criar de novo a base, os baldes e as sessões."
            } >&2
            exit 1
          fi

      - name: Terraform
        working-directory: terraform
        env:
          ACEITAR_DESTRUICAO: ${{ inputs.aceitar_destruicao }}
        run: |
          terraform init -input=false
          if [ -n "$IS_PROD" ]; then
            terraform plan -input=false -out="$RUNNER_TEMP/plano.tfplan"
            terraform show -json "$RUNNER_TEMP/plano.tfplan" > "$RUNNER_TEMP/plano.json"
            veredicto=$(node ../scripts/entrega.js plano "$RUNNER_TEMP/plano.json")
            if [ "$veredicto" = muda ]; then
              terraform apply -input=false "$RUNNER_TEMP/plano.tfplan"
              echo "TF_MUDOU=1" >> "$GITHUB_ENV"
            else
              echo "O plano não muda nada: não se aplica, e o estado no repositório fica como está."
            fi
          else
            terraform output -raw d1_dev_id > /dev/null || {
              echo "Os recursos de dev ainda não existem. Publica o main uma vez primeiro." >&2
              exit 1
            }
          fi

      # Só quando o apply mudou alguma coisa: aí o estado tem ids ou atributos
      # novos que o próximo deploy tem de ler. Vai para o R2, não para o
      # repositório — e guarda-se uma cópia datada, para se poder voltar atrás
      # se um apply deixar o estado a dizer o que não é.
      - name: Guardar o estado do terraform no R2
        if: env.IS_PROD && env.TF_MUDOU
        run: |
          set -e
          npx wrangler@4 r2 object put "$TF_BALDE/historico/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}.tfstate" \
            --file terraform/terraform.tfstate --remote
          npx wrangler@4 r2 object put "$TF_BALDE/terraform.tfstate" \
            --file terraform/terraform.tfstate --remote
          echo "estado guardado em r2://$TF_BALDE/terraform.tfstate"

      - name: Configurar wrangler.toml
        run: |
          sed -i "s/PLACEHOLDER_D1_ID/$(terraform -chdir=terraform output -raw d1_database_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_KV_ID/$(terraform -chdir=terraform output -raw kv_sessions_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_D1_DEV_ID/$(terraform -chdir=terraform output -raw d1_dev_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_KV_DEV_ID/$(terraform -chdir=terraform output -raw kv_dev_id)/" wrangler.toml

      # sem --env, o wrangler não vê a base declarada dentro do ambiente
      - name: Aplicar migrações D1
        run: npx wrangler@4 d1 migrations apply "$DB_NAME" --remote $ENV_FLAG

      # A versao que a app vai buscar sai das notas de publicacao, e nao de um
      # numero escrito a mao noutro sitio.
      - name: Gerar a versao
        run: node scripts/versao.js

      # Os avisos de cada ambiente têm de ir para o servidor de Discord desse
      # ambiente. Os nomes enganam: DISCORD_DEV_* é o canal de quem programa,
      # e o sufixo _DEV é o ambiente de dev — um webhook ou canal trocado punha
      # os erros de produção no Discord de dev sem ninguém dar por isso. Antes
      # de deixar sair o worker, cada webhook e cada canal é resolvido no
      # Discord e comparado com o servidor esperado (DISCORD_GUILD_ID; em dev,
      # DISCORD_GUILD_ID_DEV e só esse); um cruzamento recusa o deploy.
      - name: Conferir o destino dos avisos
        env:
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_GUILD_ID_DEV: ${{ secrets.DISCORD_GUILD_ID_DEV }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_TOKEN_DEV: ${{ secrets.DISCORD_BOT_TOKEN_DEV }}
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_DEV_WEBHOOK_DEV: ${{ secrets.DISCORD_DEV_WEBHOOK_DEV }}
          DISCORD_SUPORTE_WEBHOOK: ${{ secrets.DISCORD_SUPORTE_WEBHOOK }}
          DISCORD_SUPORTE_WEBHOOK_DEV: ${{ secrets.DISCORD_SUPORTE_WEBHOOK_DEV }}
          DISCORD_ADMIN_WEBHOOK: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
          DISCORD_DEV_CHANNEL: ${{ secrets.DISCORD_DEV_CHANNEL }}
          DISCORD_DEV_CHANNEL_DEV: ${{ secrets.DISCORD_DEV_CHANNEL_DEV }}
          DISCORD_SUPORTE_CHANNEL: ${{ secrets.DISCORD_SUPORTE_CHANNEL }}
          DISCORD_SUPORTE_CHANNEL_DEV: ${{ secrets.DISCORD_SUPORTE_CHANNEL_DEV }}
          DISCORD_ADMIN_CHANNEL: ${{ secrets.DISCORD_ADMIN_CHANNEL }}
        run: |
          set -e
          # o mesmo critério de «Juntar os segredos»: em dev, o _DEV do mesmo nome
          # manda; sem ele vale o partilhado. ESC_USADO diz qual dos dois se leu —
          # é esse que a mensagem de erro nomeia.
          escolhe () {
            nome="$1"; ESC_VALOR="$2"; ESC_USADO="$nome"
            if [ -z "$IS_PROD" ]; then
              eval "alt=\"\${${nome}_DEV:-}\""
              if [ -n "$alt" ]; then ESC_VALOR="$alt"; ESC_USADO="${nome}_DEV"; fi
            fi
          }
          # o servidor de referência e o bot são os do ambiente, sem cair no de
          # produção: em dev, sem DISCORD_GUILD_ID_DEV não há com que comparar
          if [ -n "$IS_PROD" ]; then GUILD="$DISCORD_GUILD_ID"; TOKEN="$DISCORD_BOT_TOKEN"; SUFIXO=""
          else GUILD="$DISCORD_GUILD_ID_DEV"; TOKEN="$DISCORD_BOT_TOKEN_DEV"; SUFIXO="_DEV"; fi
          if [ -z "$GUILD" ]; then echo "::warning::sem DISCORD_GUILD_ID$SUFIXO — não dá para conferir o destino dos avisos de $ENV_LABEL"; exit 0; fi
          falhas=0
          # lê um campo de uma resposta JSON do Discord (guild_id, name)
          campo () { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const o=JSON.parse(s);console.log(String(o['$1']||''))}catch(e){console.log('')}})"; }
          confere () {
            rotulo="$1"; guild="$2"; nome="$3"
            if [ -z "$guild" ]; then echo "$rotulo: o Discord não respondeu (URL ou id inválidos, ou o bot não está nesse servidor?)"; return; fi
            if [ "$guild" = "$GUILD" ]; then echo "$rotulo → servidor $GUILD · #$nome ✓"; return; fi
            if [ -z "$IS_PROD" ] && [ "$rotulo" = "${rotulo%_DEV}" ]; then
              echo "::error::em dev, $rotulo não tem variante _DEV e aponta para outro servidor ($guild, #$nome): define ${rotulo}_DEV com o webhook ou canal do servidor de dev"
            else
              echo "::error::$rotulo aponta para o servidor $guild (#$nome), mas este deploy é de $ENV_LABEL (servidor $GUILD)"
            fi
            falhas=$((falhas+1))
          }
          webhook () {
            escolhe "$1" "$2"; url="$ESC_VALOR"; rot="$ESC_USADO"
            [ -n "$url" ] || { echo "$1: sem valor"; return; }
            resp=$(curl -s --max-time 15 "$url" || true)
            confere "$rot" "$(printf '%s' "$resp" | campo guild_id)" "$(printf '%s' "$resp" | campo name)"
          }
          canal () {
            escolhe "$1" "$2"; id="$ESC_VALOR"; rot="$ESC_USADO"
            [ -n "$id" ] || { echo "$1: sem valor"; return; }
            [ -n "$TOKEN" ] || { echo "$rot: sem DISCORD_BOT_TOKEN$SUFIXO para conferir o canal"; return; }
            resp=$(curl -s --max-time 15 -H "Authorization: Bot $TOKEN" "https://discord.com/api/v10/channels/$id" || true)
            confere "$rot" "$(printf '%s' "$resp" | campo guild_id)" "$(printf '%s' "$resp" | campo name)"
          }
          webhook DISCORD_DEV_WEBHOOK "$DISCORD_DEV_WEBHOOK"
          webhook DISCORD_SUPORTE_WEBHOOK "$DISCORD_SUPORTE_WEBHOOK"
          canal DISCORD_DEV_CHANNEL "$DISCORD_DEV_CHANNEL"
          canal DISCORD_SUPORTE_CHANNEL "$DISCORD_SUPORTE_CHANNEL"
          if [ -n "$IS_PROD" ]; then
            webhook DISCORD_ADMIN_WEBHOOK "$DISCORD_ADMIN_WEBHOOK"
            canal DISCORD_ADMIN_CHANNEL "$DISCORD_ADMIN_CHANNEL"
          fi
          if [ "$falhas" -gt 0 ]; then
            echo "::error::$falhas destino(s) de avisos no servidor errado — o worker não saiu. Lembra-te: DISCORD_DEV_* é o canal de quem programa; o sufixo _DEV é o ambiente de dev."
            exit 1
          fi

      # Os segredos juntam-se num ficheiro que sai com o worker, no passo
      # seguinte. Só entra o que existir — quem não tiver Discord configurado
      # fica sem avisos, e a app funciona à mesma; um segredo sem valor não se
      # apaga no worker, fica lá o que já estava.
      - name: Juntar os segredos
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_ADMIN_WEBHOOK: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_DEV_CHANNEL: ${{ secrets.DISCORD_DEV_CHANNEL }}
          DISCORD_ADMIN_CHANNEL: ${{ secrets.DISCORD_ADMIN_CHANNEL }}
          DISCORD_MASTER: ${{ secrets.DISCORD_MASTERS || secrets.DISCORD_MASTER }}
          DISCORD_ADMINS: ${{ secrets.DISCORD_ADMINS }}
          DISCORD_DEVS: ${{ secrets.DISCORD_DEVS }}
          DISCORD_SUPORTE: ${{ secrets.DISCORD_SUPORTE }}
          DISCORD_SUPORTE_CHANNEL: ${{ secrets.DISCORD_SUPORTE_CHANNEL }}
          DISCORD_SUPORTE_WEBHOOK: ${{ secrets.DISCORD_SUPORTE_WEBHOOK }}
          # O servidor de Discord de dev tem a sua própria aplicação (o
          # endereço das interações é da aplicação, não do servidor). No
          # ambiente de dev, um segredo _DEV manda; sem ele, vale o
          # partilhado — menos os webhooks e canais do Discord, que o passo
          # «Conferir o destino dos avisos» obriga a estar no servidor de dev.
          DISCORD_BOT_TOKEN_DEV: ${{ secrets.DISCORD_BOT_TOKEN_DEV }}
          DISCORD_PUBLIC_KEY_DEV: ${{ secrets.DISCORD_PUBLIC_KEY_DEV }}
          DISCORD_DEV_WEBHOOK_DEV: ${{ secrets.DISCORD_DEV_WEBHOOK_DEV }}
          DISCORD_DEV_CHANNEL_DEV: ${{ secrets.DISCORD_DEV_CHANNEL_DEV }}
          DISCORD_MASTER_DEV: ${{ secrets.DISCORD_MASTERS_DEV || secrets.DISCORD_MASTER_DEV }}
          DISCORD_ADMINS_DEV: ${{ secrets.DISCORD_ADMINS_DEV }}
          DISCORD_DEVS_DEV: ${{ secrets.DISCORD_DEVS_DEV }}
          DISCORD_SUPORTE_DEV: ${{ secrets.DISCORD_SUPORTE_DEV }}
          DISCORD_SUPORTE_CHANNEL_DEV: ${{ secrets.DISCORD_SUPORTE_CHANNEL_DEV }}
          DISCORD_SUPORTE_WEBHOOK_DEV: ${{ secrets.DISCORD_SUPORTE_WEBHOOK_DEV }}
          # partilhada pelos dois ambientes: é ela que deixa o /test de um
          # servidor assinar ligações que o outro worker aceita
          TESTE_CHAVE: ${{ secrets.TESTE_CHAVE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
          DESTINO_CORREIO_TESTE: ${{ secrets.DESTINO_CORREIO_TESTE }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          # os batimentos para fora (lib/medidas.js): só produção os bate
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_COPIA_URL: ${{ secrets.HEARTBEAT_COPIA_URL }}
          # o pepper das palavras-passe (worker/src/auth.js): cada ambiente o seu
          PASS_PEPPER: ${{ secrets.PASS_PEPPER }}
          PASS_PEPPER_DEV: ${{ secrets.PASS_PEPPER_DEV }}
        run: |
          set -e
          # só o runner lê o ficheiro, e o passo seguinte apaga-o
          umask 077
          SEGREDOS="$RUNNER_TEMP/segredos.json"
          echo '{}' > "$SEGREDOS"
          echo "SEGREDOS=$SEGREDOS" >> "$GITHUB_ENV"
          put () {
            nome="$1"; valor="$2"
            # no dev, o segredo _DEV do mesmo nome tem precedência
            if [ -z "$IS_PROD" ]; then
              eval "alt=\"\${${nome}_DEV:-}\""
              if [ -n "$alt" ]; then valor="$alt"; echo "(a usar ${nome}_DEV)"; fi
            fi
            if [ -n "$valor" ]; then
              # pelo ambiente e não pela linha de comandos: o valor passa tal e
              # qual (aspas, barras, cifrões) e não fica na lista de processos
              SEGREDOS="$SEGREDOS" NOME="$nome" VALOR="$valor" node -e '
                const fs = require("fs"), f = process.env.SEGREDOS;
                const o = JSON.parse(fs.readFileSync(f, "utf8"));
                o[process.env.NOME] = process.env.VALOR;
                fs.writeFileSync(f, JSON.stringify(o));
              '
              echo "a publicar: $nome"
            else
              echo "sem valor: $nome (ignorado — no worker fica o que lá estava)"
            fi
          }
          put DISCORD_DEV_WEBHOOK "$DISCORD_DEV_WEBHOOK"
          put DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
          put DISCORD_PUBLIC_KEY "$DISCORD_PUBLIC_KEY"
          put DISCORD_DEV_CHANNEL "$DISCORD_DEV_CHANNEL"
          put DISCORD_MASTER "$DISCORD_MASTER"
          put DISCORD_ADMINS "$DISCORD_ADMINS"
          put DISCORD_DEVS "$DISCORD_DEVS"
          put DISCORD_SUPORTE "$DISCORD_SUPORTE"
          put DISCORD_SUPORTE_CHANNEL "$DISCORD_SUPORTE_CHANNEL"
          put DISCORD_SUPORTE_WEBHOOK "$DISCORD_SUPORTE_WEBHOOK"
          put RESEND_API_KEY "$RESEND_API_KEY"
          put TESTE_CHAVE "$TESTE_CHAVE"
          # o resumo de consumo e os comandos de administração são só da produção
          if [ -n "$IS_PROD" ]; then
            put DISCORD_ADMIN_WEBHOOK "$DISCORD_ADMIN_WEBHOOK"
            put DISCORD_ADMIN_CHANNEL "$DISCORD_ADMIN_CHANNEL"
            # sem fallback para o token de deploy: um token com poder sobre a
            # conta inteira nunca entra no runtime de um worker
            put CF_ANALYTICS_TOKEN "$CF_ANALYTICS_TOKEN"
            # escreve no Email Routing do dominio REAL: nunca no worker de dev,
            # que corre codigo ainda nao promovido
            put CF_EMAIL_TOKEN "$CF_EMAIL_TOKEN"
            put DESTINO_CORREIO_TESTE "$DESTINO_CORREIO_TESTE"
            put CF_ACCOUNT_ID "$TF_VAR_cloudflare_account_id"
            # nunca no dev: a função put dá-lhe o mesmo valor quando não há _DEV, e
            # um dev a bater no heartbeat de produção era um cron de produção
            # morto com o alarme a dizer que está tudo bem
            put HEARTBEAT_URL "$HEARTBEAT_URL"
            put HEARTBEAT_COPIA_URL "$HEARTBEAT_COPIA_URL"
          fi
          # O pepper das palavras-passe, cada ambiente o seu: no dev, sem
          # PASS_PEPPER_DEV não há pepper — a função put dar-lhe-ia o de
          # produção, e o worker de dev corre código ainda não promovido.
          # Um pepper, uma vez publicado, nunca se muda nem se apaga: as
          # palavras-passe guardadas com ele deixavam de entrar (e sem valor o
          # put não apaga nada — fica o que o worker já tem).
          if [ -n "$IS_PROD" ]; then
            put PASS_PEPPER "$PASS_PEPPER"
          else
            put PASS_PEPPER ""
          fi

      # Uma versão só, com o código e os segredos juntos: o worker novo nunca
      # corre sem um segredo que já lê, e a lista de versões fica com uma por
      # deploy — antes eram até 21, um `secret put` por segredo e cada um uma
      # versão, e o recuo lê essa lista. O --secrets-file junta-os aos que o
      # worker já tem; não apaga os que ficaram de fora.
      - name: Publicar o worker e os segredos
        run: |
          trap 'rm -f "$SEGREDOS"' EXIT
          npx wrangler@4 deploy $ENV_FLAG --secrets-file "$SEGREDOS"

      # O que se acabou de publicar tem de estar a responder: o /versao.json
      # do ambiente igual ao que o versao.js gerou neste deploy, e a raiz (que
      # passa pelo worker, run_worker_first) com 200. Doze tentativas, dez
      # segundos entre elas. O veredicto vai para o passo seguinte.
      - name: Confirmar que a publicação responde
        id: confirmar
        run: node scripts/entrega.js publicacao "$APP_URL"

      # O caminho de recuo, escrito aqui e no README («Se uma publicação
      # correu mal»). Automático só quando o worker novo responde com erro
      # (5xx) do princípio ao fim: volta a versão anterior, que tem o código
      # de antes e os segredos de agora. Uma resposta com a versão antiga, ou
      # nenhuma resposta, não prova avaria — o deploy falha, o aviso vai para
      # o Discord, e decide uma pessoa. As migrações da D1 não recuam: o
      # código anterior vive com o esquema novo (as migrações só acrescentam).
      - name: Recuar para a versão anterior
        if: failure() && steps.confirmar.outputs.veredicto == 'avaria'
        run: |
          npx wrangler@4 rollback --yes --message "recuo automático: ${GITHUB_SHA::7} respondia com erro" $ENV_FLAG
          {
            echo "### Recuou-se para a versão anterior do worker"
            echo ""
            echo "O worker de ${GITHUB_SHA::7} respondia com erro em $APP_URL. Voltou a versão anterior — o código de antes, com os segredos de agora. As migrações da D1 não recuam."
          } >> "$GITHUB_STEP_SUMMARY"

      # A etiqueta «publicado» é o que o guarda da chegada compara no próximo
      # deploy de produção. Move-se só aqui, depois de a publicação responder.
      - name: Marcar o que está em produção
        if: env.IS_PROD
        run: |
          git tag -f publicado "$GITHUB_SHA"
          git push -f origin refs/tags/publicado

      # Comandos do bot: só a produção os regista, para os dois ambientes não
      # andarem a sobrepor-se no mesmo servidor de Discord.
      - name: Registar comandos do Discord
        if: env.IS_PROD
        continue-on-error: true
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if [ -n "$DISCORD_APP_ID" ] && [ -n "$DISCORD_BOT_TOKEN" ]; then
            node scripts/discord-register.js
          else
            echo "Bot do Discord não configurado — comandos não registados."
          fi

      # Um deploy que falha não pode ficar só no separador do GitHub. Vai para
      # o canal de quem programa, que é onde os erros do serviço já aparecem.
      - name: Avisar quem programa se isto falhou
        if: failure()
        continue-on-error: true
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          COMMIT: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEV_WEBHOOK" ] || { echo "sem webhook de dev"; exit 0; }
          node -e '
            const corpo = {
              embeds: [{
                title: "🔴 Deploy falhou · " + process.env.ENV_LABEL,
                description: "`" + process.env.GITHUB_REF_NAME + "` — " +
                  (process.env.COMMIT || "").split("\n")[0].slice(0, 160),
                color: 0xb94a48,
                fields: [{ name: "Ver o erro", value: process.env.RUN_URL }],
                timestamp: new Date().toISOString(),
              }],
            };
            fetch(process.env.DISCORD_DEV_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(corpo),
            }).then((r) => console.log("aviso enviado: " + r.status));
          '
