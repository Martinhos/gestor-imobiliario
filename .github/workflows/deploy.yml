name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Onde publicar
        type: choice
        options: [producao, dev]
        default: producao

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # para commitar o terraform.tfstate atualizado

jobs:
  deploy:
    runs-on: ubuntu-latest
    # O deploy faz commit do estado do terraform de volta ao repo, e esse push
    # dispararia outro deploy. Cortar o ciclo pelo autor, e não por um marcador
    # na mensagem: um "[skip ci]" fica gravado no histórico e viaja para dentro
    # de qualquer squash que atravesse esse commit, saltando deploys que nada
    # tinham a ver com ele.
    if: github.actor != 'github-actions[bot]'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # a documentação sai do código no momento do deploy — nunca fica atrás
      - name: Gerar a documentação
        run: node scripts/gerar-docs.js

      # Produção sai do ramo main; tudo o resto vai para o ambiente de dev.
      - name: Escolher ambiente
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ inputs.ambiente }}" != "dev" ]; then
            echo "ENV_FLAG=" >> $GITHUB_ENV
            echo "DB_NAME=gestor-imobiliario" >> $GITHUB_ENV
            echo "ENV_LABEL=produção" >> $GITHUB_ENV
            echo "IS_PROD=1" >> $GITHUB_ENV
          else
            echo "ENV_FLAG=--env dev" >> $GITHUB_ENV
            echo "DB_NAME=gestor-imobiliario-dev" >> $GITHUB_ENV
            echo "ENV_LABEL=dev" >> $GITHUB_ENV
            echo "IS_PROD=" >> $GITHUB_ENV
          fi

      - name: Onde vai isto
        run: echo "A publicar para **$ENV_LABEL**" >> $GITHUB_STEP_SUMMARY

      # APK só na produção: leva o endereço da app lá dentro.
      - uses: actions/setup-java@v4
        if: github.ref_name == 'main'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: github.ref_name == 'main'

      - name: Compilar APK
        if: github.ref_name == 'main'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../web/gestor-imobiliario.apk

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # A infraestrutura dos dois ambientes é criada a partir do main, que é
      # quem manda no estado. O ramo dev só lê os ids que já lá estão.
      - name: Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          if [ -n "$IS_PROD" ]; then
            terraform apply -auto-approve -input=false
          else
            terraform output -raw d1_dev_id > /dev/null || {
              echo "Os recursos de dev ainda não existem. Publica o main uma vez primeiro." >&2
              exit 1
            }
          fi

      - name: Commit terraform state (se mudou)
        if: env.IS_PROD
        run: |
          if [ -n "$(git status --porcelain terraform/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add terraform/terraform.tfstate terraform/.terraform.lock.hcl
            git commit -m "ci: atualizar estado do terraform" || true
            git push
          fi

      - name: Configurar wrangler.toml
        run: |
          sed -i "s/PLACEHOLDER_D1_ID/$(terraform -chdir=terraform output -raw d1_database_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_KV_ID/$(terraform -chdir=terraform output -raw kv_sessions_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_D1_DEV_ID/$(terraform -chdir=terraform output -raw d1_dev_id)/" wrangler.toml
          sed -i "s/PLACEHOLDER_KV_DEV_ID/$(terraform -chdir=terraform output -raw kv_dev_id)/" wrangler.toml

      # sem --env, o wrangler não vê a base declarada dentro do ambiente
      - name: Aplicar migrações D1
        run: npx wrangler@4 d1 migrations apply "$DB_NAME" --remote $ENV_FLAG

      # A versao que a app vai buscar sai das notas de publicacao, e nao de um
      # numero escrito a mao noutro sitio.
      - name: Gerar a versao
        run: node scripts/versao.js

      - name: Deploy do worker
        run: npx wrangler@4 deploy $ENV_FLAG

      # Os avisos de cada ambiente têm de ir para o servidor de Discord desse
      # ambiente. Os nomes enganam: DISCORD_DEV_* é o canal de quem programa,
      # e o sufixo _DEV é o ambiente de dev — um webhook ou canal trocado punha
      # os erros de produção no Discord de dev sem ninguém dar por isso. Antes
      # de publicar os segredos, cada webhook e cada canal é resolvido no
      # Discord e comparado com o servidor esperado (DISCORD_GUILD_ID, ou
      # DISCORD_GUILD_ID_DEV em dev); um cruzamento recusa o deploy.
      - name: Conferir o destino dos avisos
        env:
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_GUILD_ID_DEV: ${{ secrets.DISCORD_GUILD_ID_DEV }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_TOKEN_DEV: ${{ secrets.DISCORD_BOT_TOKEN_DEV }}
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_DEV_WEBHOOK_DEV: ${{ secrets.DISCORD_DEV_WEBHOOK_DEV }}
          DISCORD_SUPORTE_WEBHOOK: ${{ secrets.DISCORD_SUPORTE_WEBHOOK }}
          DISCORD_SUPORTE_WEBHOOK_DEV: ${{ secrets.DISCORD_SUPORTE_WEBHOOK_DEV }}
          DISCORD_ADMIN_WEBHOOK: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
          DISCORD_DEV_CHANNEL: ${{ secrets.DISCORD_DEV_CHANNEL }}
          DISCORD_DEV_CHANNEL_DEV: ${{ secrets.DISCORD_DEV_CHANNEL_DEV }}
          DISCORD_SUPORTE_CHANNEL: ${{ secrets.DISCORD_SUPORTE_CHANNEL }}
          DISCORD_SUPORTE_CHANNEL_DEV: ${{ secrets.DISCORD_SUPORTE_CHANNEL_DEV }}
          DISCORD_ADMIN_CHANNEL: ${{ secrets.DISCORD_ADMIN_CHANNEL }}
        run: |
          set -e
          # o mesmo critério do passo seguinte: em dev, o _DEV do mesmo nome manda
          escolhe () {
            nome="$1"; valor="$2"
            if [ -z "$IS_PROD" ]; then
              eval "alt=\"\${${nome}_DEV:-}\""
              if [ -n "$alt" ]; then valor="$alt"; fi
            fi
            printf '%s' "$valor"
          }
          GUILD=$(escolhe DISCORD_GUILD_ID "$DISCORD_GUILD_ID")
          TOKEN=$(escolhe DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN")
          if [ -z "$GUILD" ]; then echo "sem DISCORD_GUILD_ID para $ENV_LABEL: não dá para conferir o destino dos avisos"; exit 0; fi
          falhas=0
          # lê guild_id, channel_id e name de uma resposta JSON do Discord
          campo () { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const o=JSON.parse(s);console.log(String(o['$1']||''))}catch(e){console.log('')}})"; }
          confere () {
            rotulo="$1"; guild="$2"; nome="$3"
            if [ -z "$guild" ]; then echo "$rotulo: o Discord não respondeu (URL ou id inválidos?)"; return; fi
            if [ "$guild" = "$GUILD" ]; then echo "$rotulo → servidor $GUILD · #$nome ✓"
            else echo "::error::$rotulo aponta para o servidor $guild (#$nome), mas este deploy é de $ENV_LABEL (servidor $GUILD)"; falhas=$((falhas+1)); fi
          }
          webhook () {
            url=$(escolhe "$1" "$2"); [ -n "$url" ] || { echo "$1: sem valor"; return; }
            resp=$(curl -s --max-time 15 "$url" || true)
            confere "$1" "$(printf '%s' "$resp" | campo guild_id)" "$(printf '%s' "$resp" | campo name)"
          }
          canal () {
            id=$(escolhe "$1" "$2"); [ -n "$id" ] || { echo "$1: sem valor"; return; }
            [ -n "$TOKEN" ] || { echo "$1: sem token do bot para conferir"; return; }
            resp=$(curl -s --max-time 15 -H "Authorization: Bot $TOKEN" "https://discord.com/api/v10/channels/$id" || true)
            confere "$1" "$(printf '%s' "$resp" | campo guild_id)" "$(printf '%s' "$resp" | campo name)"
          }
          webhook DISCORD_DEV_WEBHOOK "$DISCORD_DEV_WEBHOOK"
          webhook DISCORD_SUPORTE_WEBHOOK "$DISCORD_SUPORTE_WEBHOOK"
          canal DISCORD_DEV_CHANNEL "$DISCORD_DEV_CHANNEL"
          canal DISCORD_SUPORTE_CHANNEL "$DISCORD_SUPORTE_CHANNEL"
          if [ -n "$IS_PROD" ]; then
            webhook DISCORD_ADMIN_WEBHOOK "$DISCORD_ADMIN_WEBHOOK"
            canal DISCORD_ADMIN_CHANNEL "$DISCORD_ADMIN_CHANNEL"
          fi
          if [ "$falhas" -gt 0 ]; then
            echo "::error::$falhas destino(s) de avisos apontam para o servidor errado — corrige os segredos (lembra-te: DISCORD_DEV_* é o canal de quem programa; o sufixo _DEV é o ambiente de dev)"
            exit 1
          fi

      # Segredos dos avisos. Só se define o que existir — quem não tiver
      # Discord configurado fica sem avisos, e a app funciona à mesma.
      - name: Publicar segredos
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_ADMIN_WEBHOOK: ${{ secrets.DISCORD_ADMIN_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_DEV_CHANNEL: ${{ secrets.DISCORD_DEV_CHANNEL }}
          DISCORD_ADMIN_CHANNEL: ${{ secrets.DISCORD_ADMIN_CHANNEL }}
          DISCORD_MASTER: ${{ secrets.DISCORD_MASTERS || secrets.DISCORD_MASTER }}
          DISCORD_ADMINS: ${{ secrets.DISCORD_ADMINS }}
          DISCORD_DEVS: ${{ secrets.DISCORD_DEVS }}
          DISCORD_SUPORTE: ${{ secrets.DISCORD_SUPORTE }}
          DISCORD_SUPORTE_CHANNEL: ${{ secrets.DISCORD_SUPORTE_CHANNEL }}
          DISCORD_SUPORTE_WEBHOOK: ${{ secrets.DISCORD_SUPORTE_WEBHOOK }}
          # O servidor de Discord de dev tem a sua própria aplicação (o
          # endereço das interações é da aplicação, não do servidor). No
          # ambiente de dev, um segredo _DEV manda; sem ele, vale o
          # partilhado — configurar o servidor novo é opcional peça a peça.
          DISCORD_BOT_TOKEN_DEV: ${{ secrets.DISCORD_BOT_TOKEN_DEV }}
          DISCORD_PUBLIC_KEY_DEV: ${{ secrets.DISCORD_PUBLIC_KEY_DEV }}
          DISCORD_DEV_WEBHOOK_DEV: ${{ secrets.DISCORD_DEV_WEBHOOK_DEV }}
          DISCORD_DEV_CHANNEL_DEV: ${{ secrets.DISCORD_DEV_CHANNEL_DEV }}
          DISCORD_MASTER_DEV: ${{ secrets.DISCORD_MASTERS_DEV || secrets.DISCORD_MASTER_DEV }}
          DISCORD_ADMINS_DEV: ${{ secrets.DISCORD_ADMINS_DEV }}
          DISCORD_DEVS_DEV: ${{ secrets.DISCORD_DEVS_DEV }}
          DISCORD_SUPORTE_DEV: ${{ secrets.DISCORD_SUPORTE_DEV }}
          DISCORD_SUPORTE_CHANNEL_DEV: ${{ secrets.DISCORD_SUPORTE_CHANNEL_DEV }}
          DISCORD_SUPORTE_WEBHOOK_DEV: ${{ secrets.DISCORD_SUPORTE_WEBHOOK_DEV }}
          # partilhada pelos dois ambientes: é ela que deixa o /test de um
          # servidor assinar ligações que o outro worker aceita
          TESTE_CHAVE: ${{ secrets.TESTE_CHAVE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
          DESTINO_CORREIO_TESTE: ${{ secrets.DESTINO_CORREIO_TESTE }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          set -e
          put () {
            nome="$1"; valor="$2"
            # no dev, o segredo _DEV do mesmo nome tem precedência
            if [ -z "$IS_PROD" ]; then
              eval "alt=\"\${${nome}_DEV:-}\""
              if [ -n "$alt" ]; then valor="$alt"; echo "(a usar ${nome}_DEV)"; fi
            fi
            if [ -n "$valor" ]; then
              printf '%s' "$valor" | npx wrangler@4 secret put "$nome" $ENV_FLAG
              echo "definido: $nome"
            else
              echo "sem valor: $nome (ignorado)"
            fi
          }
          put DISCORD_DEV_WEBHOOK "$DISCORD_DEV_WEBHOOK"
          put DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
          put DISCORD_PUBLIC_KEY "$DISCORD_PUBLIC_KEY"
          put DISCORD_DEV_CHANNEL "$DISCORD_DEV_CHANNEL"
          put DISCORD_MASTER "$DISCORD_MASTER"
          put DISCORD_ADMINS "$DISCORD_ADMINS"
          put DISCORD_DEVS "$DISCORD_DEVS"
          put DISCORD_SUPORTE "$DISCORD_SUPORTE"
          put DISCORD_SUPORTE_CHANNEL "$DISCORD_SUPORTE_CHANNEL"
          put DISCORD_SUPORTE_WEBHOOK "$DISCORD_SUPORTE_WEBHOOK"
          put RESEND_API_KEY "$RESEND_API_KEY"
          put TESTE_CHAVE "$TESTE_CHAVE"
          # o resumo de consumo e os comandos de administração são só da produção
          if [ -n "$IS_PROD" ]; then
            put DISCORD_ADMIN_WEBHOOK "$DISCORD_ADMIN_WEBHOOK"
            put DISCORD_ADMIN_CHANNEL "$DISCORD_ADMIN_CHANNEL"
            # sem fallback para o token de deploy: um token com poder sobre a
            # conta inteira nunca entra no runtime de um worker
            put CF_ANALYTICS_TOKEN "$CF_ANALYTICS_TOKEN"
            # escreve no Email Routing do dominio REAL: nunca no worker de dev,
            # que corre codigo ainda nao promovido
            put CF_EMAIL_TOKEN "$CF_EMAIL_TOKEN"
            put DESTINO_CORREIO_TESTE "$DESTINO_CORREIO_TESTE"
            put CF_ACCOUNT_ID "$TF_VAR_cloudflare_account_id"
          fi

      # Comandos do bot: só a produção os regista, para os dois ambientes não
      # andarem a sobrepor-se no mesmo servidor de Discord.
      - name: Registar comandos do Discord
        if: env.IS_PROD
        continue-on-error: true
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if [ -n "$DISCORD_APP_ID" ] && [ -n "$DISCORD_BOT_TOKEN" ]; then
            node scripts/discord-register.js
          else
            echo "Bot do Discord não configurado — comandos não registados."
          fi

      # Um deploy que falha não pode ficar só no separador do GitHub. Vai para
      # o canal de quem programa, que é onde os erros do serviço já aparecem.
      - name: Avisar quem programa se isto falhou
        if: failure()
        continue-on-error: true
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          COMMIT: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEV_WEBHOOK" ] || { echo "sem webhook de dev"; exit 0; }
          node -e '
            const corpo = {
              embeds: [{
                title: "🔴 Deploy falhou · " + process.env.ENV_LABEL,
                description: "`" + process.env.GITHUB_REF_NAME + "` — " +
                  (process.env.COMMIT || "").split("\n")[0].slice(0, 160),
                color: 0xb94a48,
                fields: [{ name: "Ver o erro", value: process.env.RUN_URL }],
                timestamp: new Date().toISOString(),
              }],
            };
            fetch(process.env.DISCORD_DEV_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(corpo),
            }).then((r) => console.log("aviso enviado: " + r.status));
          '
