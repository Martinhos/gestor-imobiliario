<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1a3a2c" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imobiliário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Gestor Imobiliário</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f8fa; --card:#fff; --field:#fff; --chip:#f2f4f3; --tint:#f6faf8;
  --ink:#17221d; --muted:#5a635e; --line:#e7ebe8; --line2:#cfd8d3;
  --accent:#244c3b; --accent-ink:#fff; --accent-soft:#dfece6; --accent-press:#1c3d2f;
  --danger:#b94a48; --danger-soft:#f7e8e7; --warn:#9a6400; --warn-soft:#f6eeda;
  --side:#1a3a2c; --side-ink:#dfece6; --side-muted:#9dbdae; --side-hover:rgba(255,255,255,.07); --side-on:rgba(255,255,255,.13);
  --track:#dfe3e1; --blur:rgba(247,248,250,.94); --shadow:0 24px 60px rgba(0,0,0,.28);
  --rail:264px; --rail-min:76px;
  --safe:env(safe-area-inset-top,0px);
  --inset-top:var(--safe); --inset-bottom:env(safe-area-inset-bottom,0px);
  --inset-left:env(safe-area-inset-left,0px); --inset-right:env(safe-area-inset-right,0px);
}
:root.dark{
  color-scheme:dark;
  --bg:#12141b; --card:#1b1e28; --field:#20242f; --chip:#272b38; --tint:#1f2330;
  --ink:#eef0f6; --muted:#9aa3b8; --line:#2b3040; --line2:#3a4054;
  --accent:#5ee0a8; --accent-ink:#0b1410; --accent-soft:#1c3a33; --accent-press:#7ceabb;
  --danger:#ff8a80; --danger-soft:#3a2326; --warn:#ffc35c; --warn-soft:#3a2f14;
  --side:#161a3a; --side-ink:#e3e6ff; --side-muted:#9aa0d6; --side-hover:rgba(255,255,255,.07); --side-on:rgba(94,224,168,.18);
  --track:#3a4054; --blur:rgba(18,20,27,.92); --shadow:0 24px 60px rgba(0,0,0,.6);
}
:root.dark .kpi .value.pos{color:#5ee0a8}:root.dark .kpi .value.neg{color:#ff8a80}:root.dark .kpi .value.amber{color:#ffc35c}
:root.dark .pos{color:#5ee0a8}:root.dark .neg{color:#ff8a80}:root.dark .amber{color:#ffc35c}
:root.dark nav a.on{color:#5ee0a8}
:root.dark .brand .mark{background:linear-gradient(135deg,#5ee0a8,#7aa9ff)}
:root.dark .fold-head .ic,:root.dark .sect-head .ic{background:#24314a;color:#8fb8ff}
:root.dark .kpi:nth-child(4n+1){background:linear-gradient(160deg,#1b1e28,#1d2a2a)}
:root.dark .kpi:nth-child(4n+2){background:linear-gradient(160deg,#1b1e28,#2a2226)}
:root.dark .kpi:nth-child(4n+3){background:linear-gradient(160deg,#1b1e28,#2a2720)}
:root.dark .kpi:nth-child(4n){background:linear-gradient(160deg,#1b1e28,#202538)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.value,.table td,.table th,.stat b{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100%}
aside{width:var(--rail);flex:0 0 var(--rail);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;transition:width .18s,flex-basis .18s,transform .22s;z-index:62}
body.rail aside{width:var(--rail-min);flex-basis:var(--rail-min)}
.brand{display:flex;align-items:center;gap:11px;padding:calc(18px + var(--inset-top)) 18px 14px;min-height:60px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 34px}
.brand b{font-size:15px;letter-spacing:-.01em;display:block;white-space:nowrap}
.brand small{color:var(--side-muted);font-size:11px;white-space:nowrap}
body.rail .brand .txt{display:none}
nav{display:grid;gap:2px;padding:8px 10px;flex:1;align-content:start;overflow:auto}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--side-muted);cursor:pointer;white-space:nowrap;position:relative}
nav a svg{flex:0 0 20px}
nav a:hover{background:var(--side-hover);color:#fff}
nav a.on{background:var(--side-on);color:#fff;font-weight:600}
nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--side-ink)}
body.rail nav a .txt{display:none}
body.rail nav a{justify-content:center;padding:11px 0}
.railfoot{padding:10px 10px calc(10px + var(--inset-bottom));border-top:1px solid rgba(255,255,255,.09)}
.railbtn{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:var(--side-muted);padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left}
.railbtn:hover{background:var(--side-hover);color:#fff}
body.rail .railbtn{justify-content:center;padding:10px 0}
body.rail .railbtn .txt{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(6,12,9,.55);z-index:61}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--blur);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(13px + var(--inset-top)) calc(22px + var(--inset-right)) 13px calc(22px + var(--inset-left));
  display:flex;align-items:center;gap:12px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.02em}
header.top .sub{color:var(--muted);font-size:12px;margin-top:2px}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px;cursor:pointer}
.spacer{flex:1}
.wrap{padding:18px calc(22px + var(--inset-right)) calc(44px + var(--inset-bottom)) calc(22px + var(--inset-left));max-width:1180px;width:100%}
@media(max-width:900px){
  aside{position:fixed;left:0;top:0;transform:translateX(-100%);width:var(--rail);flex-basis:var(--rail)}
  body.open aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.rail aside{width:var(--rail);flex-basis:var(--rail)}
  body.rail .brand .txt,body.rail nav a .txt,body.rail .railbtn .txt{display:block}
  body.rail nav a,body.rail .railbtn{justify-content:flex-start;padding:11px 12px}
  body.open .scrim{display:block}
  .burger{display:block}
  .wrap{padding:14px calc(15px + var(--inset-right)) calc(44px + var(--inset-bottom)) calc(15px + var(--inset-left))}
  header.top{padding:calc(11px + var(--inset-top)) calc(15px + var(--inset-right)) 11px calc(15px + var(--inset-left))}
}
@media(max-width:520px){.hideS{display:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;max-width:100%}
.cols>*{min-width:0}
/* clicavel: risco de acento a esquerda + reacao ao toque; informativo fica liso */
.card.tap{cursor:pointer;position:relative;overflow:hidden;transition:border-color .12s,transform .06s,background .12s}
.card.tap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.5}
.card.tap:hover{border-color:var(--line2);background:var(--tint)}
.card.tap:active{transform:scale(.99);background:var(--chip)}
.card.tap.pend::before,.card.kpi::before{display:none}
[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{-webkit-tap-highlight-color:transparent}
button,.tap,.selbtn,.selopt,.fold-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px}
.kpi .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-size:22px;font-weight:750;margin-top:6px;letter-spacing:-.025em}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.why{cursor:pointer}
.kpi .expl{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.kpi.open .expl{display:block}
.kpi.why::after{content:"?";position:absolute;top:12px;right:13px;width:16px;height:16px;border-radius:50%;
  background:var(--chip);color:var(--muted);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.kpi.open::after{content:"×"}
.card.kpi{position:relative}

/* dica dos gráficos */
.tip{position:fixed;z-index:95;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:9px;
  font-size:12.5px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .12s;max-width:calc(100vw - 16px);text-align:center;line-height:1.35}
.tip.on{opacity:1}
.pos{color:var(--accent)}.neg{color:var(--danger)}.amber{color:var(--warn)}
.section-title{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:550}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.list{display:grid;gap:11px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
.badge.grey{background:var(--chip);color:var(--muted)}
.badge.amber{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.title{font-weight:700;letter-spacing:-.01em}
.small{font-size:12px;color:var(--muted)}
.empty{padding:38px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:var(--card)}
.empty b{display:block;color:var(--ink);margin-bottom:5px}
.row-between{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;min-width:0}
.row-between>*{min-width:0}
.txrow .title,.txrow .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txrow{overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.rich{white-space:normal;line-height:1.55}
.rich div,.rich p,.rich-content div,.rich-content p{margin:0}
.rich pre,.rich-content pre{white-space:pre-wrap;background:var(--chip);padding:6px 8px;border-radius:7px;font:12px ui-monospace,Menlo,monospace;margin:4px 0}
.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich code{background:var(--chip);padding:1px 5px;border-radius:5px;font:12px ui-monospace,Menlo,monospace}
.rich b{font-weight:700}.rich s{opacity:.7}
.divider{height:1px;background:var(--line);margin:14px 0}
.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.stat:last-child{border-bottom:0}
.avatar{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:750;font-size:13px;flex:0 0 36px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip);cursor:pointer}
.thumb img{width:100%;height:76px;object-fit:cover;display:block}
.thumb .nm{font-size:11px;padding:6px 7px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb input.nm{color:var(--ink);font-weight:500;background:var(--field)}
.prow{display:flex;align-items:center;gap:8px;min-width:0}
.prow .pth{width:64px;height:52px;border-radius:10px;background:var(--chip);overflow:hidden;flex:0 0 64px;cursor:pointer;position:relative}
.prow .capa{position:absolute;left:4px;bottom:4px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;letter-spacing:.03em}
.prow .pnm{flex:1;min-width:0}
.pgrab{width:34px;height:40px;border:1px solid var(--line);background:var(--field);border-radius:9px;display:grid;place-items:center;color:var(--muted);cursor:grab;flex:0 0 34px;touch-action:none}
.prow.drag{position:relative;z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.25);background:var(--card);border-radius:12px}
.prow{transition:transform .12s}
.prow.drag{transition:none}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.thumb input.nm:focus{outline:2px solid var(--accent-soft);outline-offset:-2px}
.ownrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.ownrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--ink)}
.ownrow input{width:66px;padding:7px 8px;text-align:right;flex:0 0 66px}
.ownrow .pc{color:var(--muted);font-size:12px}

.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
html.noscroll{overflow:hidden}
html.noscroll body{overflow:hidden;position:fixed;left:0;right:0;width:100%}
.navh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 4px;opacity:.85;white-space:nowrap}
nav a .cnt{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.kpi.evo{cursor:pointer}
.kpi .kic{position:absolute;top:11px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center}
/* secções que abrem e fecham */
.sect.fold{padding:0;gap:0}
.fold-head{display:flex;align-items:center;gap:9px;width:100%;max-width:100%;min-width:0;overflow:hidden;padding:12px 14px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);border-radius:14px}
.fold-head:hover{background:var(--tint)}
.fold-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 30px}
.fold-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.form>*{min-width:0}.sect{min-width:0}
.fold-head .fsum{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.fold-head .chev{flex:0 0 auto;color:var(--muted);transition:transform .15s}
.fold.open>.fold-head .chev{transform:rotate(180deg)}
.fold-body{display:none;padding:2px 14px 14px;gap:13px}
.fold.open>.fold-body{display:grid}
.pend{border-left:3px solid var(--warn)}
.pend.late{border-left-color:var(--danger)}
.legend{display:grid;gap:7px;margin-top:12px;grid-template-columns:minmax(0,1fr)}
.legend>*{min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.legend .li.tap{cursor:pointer;border-radius:8px;margin:0 -4px;padding:2px 4px}
.legend .li.tap:hover{background:var(--chip)}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-width:0}
.donut .pie{flex:0 0 132px;max-width:132px}
.donut .leg{flex:1 1 160px;min-width:0}
.legend .vl{font-weight:650;font-variant-numeric:tabular-nums}
.xlab{display:flex;gap:4px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;overflow:hidden}

.form{display:grid;gap:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:520px){.row,.row3{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);display:grid;gap:6px;font-weight:600}
.flabel{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--field);font-weight:500}
input,textarea,.selbtn{font-size:14px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:disabled{opacity:.6}
.statin{width:120px;flex:0 0 auto;text-align:right;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-weight:700;font-size:13.5px}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
/* editores de texto ricos */
.rich-editor{border:1px solid var(--line);border-radius:11px;background:var(--field);overflow:hidden}
.rich-tools{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line);background:var(--tint)}
.rich-tools button{min-width:32px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer;font-weight:650}
.rich-content{min-height:90px;padding:11px 12px;outline:none;line-height:1.45;font-size:14px;color:var(--ink);font-weight:500}
.rich-content:empty::before{content:attr(data-ph);color:var(--muted)}
.rich-tools button{color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.rich-tools button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rich-content b,.rich-content strong,.rich b,.rich strong{font-weight:700}
.rich-content i,.rich-content em,.rich i,.rich em{font-style:italic}
.rich-content s,.rich-content strike,.rich-content del,.rich s,.rich strike,.rich del{text-decoration:line-through}
.rich-content u,.rich u{text-decoration:underline}
.rich-content:focus{outline:2px solid var(--accent-soft);outline-offset:-2px}
.rich-content ol,.rich-content ul{padding-left:25px;margin:6px 0}
.check{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink);font-size:14px;cursor:pointer}
.check input{width:auto;margin:0;flex:0 0 auto}

/* menu de escolha próprio, em vez do <select> do sistema */
.sel{position:relative;width:100%;max-width:100%;min-width:0}.form>label,.row>label,.row3>label{min-width:0}.selbtn{box-sizing:border-box;max-width:100%}
.selbtn{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--field);cursor:pointer;text-align:left;font-weight:500}
.selbtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn:hover{border-color:var(--line2)}
.selbtn svg{color:var(--muted);flex:0 0 auto}
.selpop{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:15;background:var(--card);
  border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:5px;max-height:230px;overflow:auto}
.selpop.on{display:block}
.selopt{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;border:0;background:transparent;
  border-radius:9px;cursor:pointer;text-align:left;font-size:14px}
.selopt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selopt:hover{background:var(--chip)}
.selopt.on{color:var(--accent);font-weight:650}
.sdiv{height:1px;background:var(--line);margin:5px 6px}

/* menu de ações (⋯) */
.menuwrap{position:relative}

.toolbar.stick{position:sticky;top:calc(57px + var(--inset-top));z-index:25;background:var(--bg);padding:9px 0;margin:-9px 0 4px;box-shadow:0 8px 10px -10px rgba(0,0,0,.25)}

.txq{flex:1 1 150px;min-width:130px;width:auto;padding:10px 12px}
.filtbtn{position:relative}

.fabmenu .btn{box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fwrap{position:relative}
.fpanel{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:45;margin:0}
.fpanel.on{display:block}
.fpanel>.card{box-shadow:0 16px 38px rgba(0,0,0,.30);max-height:min(72vh,560px);overflow:auto;overscroll-behavior:contain}
.fabpad{height:84px}
.totop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--inset-bottom));z-index:57;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:none;align-items:center;justify-content:center;

.totop.on{display:flex}

.qwrap .txq{width:100%;padding-right:36px}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;
  background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1}

/* etiquetas removíveis */
.tagbox{display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--field);min-height:46px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:650}
.tag.grey{background:var(--chip);color:var(--ink)}
.tag button{border:0;background:transparent;padding:2px;border-radius:50%;cursor:pointer;color:inherit;opacity:.65;display:grid;place-items:center}
.tag button:hover{opacity:1;background:rgba(0,0,0,.08)}
.tagadd{border:1px dashed var(--line2);background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
.tagadd:hover{border-color:var(--accent);color:var(--accent)}

.addbox{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px;border:1.5px dashed var(--line2);
  border-radius:14px;background:transparent;cursor:pointer;color:var(--ink)}
.addbox:hover{border-color:var(--accent);background:var(--tint)}
.addbox .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--chip);color:var(--muted);flex:0 0 38px}
.addbox:hover .ic{background:var(--accent-soft);color:var(--accent)}
.addbox b{display:block;font-size:14px}

.sect{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:13px;background:var(--card)}
.sect-head{display:flex;align-items:center;gap:9px;font-size:14px}
.sect-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 30px}
.seg{display:grid;gap:8px}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c2{grid-template-columns:repeat(2,1fr)}.seg.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:520px){.seg.c4{grid-template-columns:repeat(2,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:12px 9px;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center;transition:.12s}
.opt .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.opt b{font-size:12.5px;font-weight:650}
.opt small{font-size:10.5px;color:var(--muted);line-height:1.3}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--accent);background:var(--tint)}
.opt.on .ic{background:var(--accent-soft);color:var(--accent)}
.roomrow{display:flex;gap:8px;align-items:center}
.roomrow input{flex:1}
.invrow{display:grid;grid-template-columns:auto 1fr 62px 104px auto;gap:7px;align-items:center}
.invrow input{padding:9px 10px}
@media(max-width:520px){.invrow{grid-template-columns:auto 1fr auto;grid-template-areas:"c n x" "c q s"}
  .invrow .i-n{grid-area:n}.invrow .i-q{grid-area:q}.invrow .i-s{grid-area:s}}

.modal{position:fixed;inset:0;z-index:60;display:none}
.modal.open{display:block}
.modal.under .sheet{pointer-events:none}
.modal.under .bg{background:rgba(6,12,9,.35)}
.modal .bg{position:absolute;inset:0;touch-action:none;background:rgba(6,12,9,.6)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 28px));max-height:min(88vh,880px);background:var(--card);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.sheet .head{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .head h2{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet .body{overscroll-behavior:contain;padding:16px 18px;overflow:auto;scroll-padding-bottom:180px}
.sheet.kb .body{padding-bottom:300px}
.sheet .foot{padding:13px 18px calc(13px + var(--inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px}
.sheet .foot .btn{flex:1;justify-content:center}
.iconbtn{border:0;background:transparent;padding:7px;border-radius:9px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
@media(max-width:520px){.sheet{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:93vh;border-radius:20px 20px 0 0}}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--inset-bottom));transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:90;font-size:13.5px;font-weight:550;opacity:0;transition:.22s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>

<div class="app">
  <div class="scrim" onclick="closeDrawer()"></div>
  <aside>
    <div class="brand">
      <div class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-5h5v5"/></svg></div>
      <div class="txt"><b>Gestor Imobiliário</b><small>Portefólio &amp; rentabilidade</small></div>
    </div>

  <main>

      <button class="burger" onclick="openDrawer()" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div style="min-width:0;flex:1"><h1 id="pageTitle">Visão geral</h1><div class="sub" id="pageSub"></div></div>
      <button class="btn filtbtn" id="hdrFilt" style="display:none;flex:0 0 auto" onclick="hdrFiltToggle()" title="Filtros e parâmetros"></button>

  </main>
</div>
<button class="totop" id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Topo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>
<script>
/* ================= ARMAZENAMENTO ================= */
const KEY='gi_v13', OLDS=['gi_v12','gi_v11','gi_v10','gi_v9','gi_v8','gi_v6','gi_v5','gi_v4','gi_v3','gi_v2','gi_v1'];
let mem={};
function rawGet(k){try{const v=localStorage.getItem(k);return v===null&&k in mem?mem[k]:v}catch(e){return k in mem?mem[k]:null}}
function rawSet(k,v){mem[k]=String(v);try{localStorage.setItem(k,v)}catch(e){}}

const STAMP=0.04;
/* taxa do imposto do selo sobre os juros: configurável em Definições, 4% por omissão */
const stampPct=()=>{const v=Number((db&&db.settings||{}).stampPct);return isFinite(v)&&v>=0?v/100:STAMP};
const r2=v=>Math.round(v*100)/100;
/* comissão de amortização antecipada, conforme a fase da taxa (mista: fixa até fixedYears, variável depois) */
function amortFeeRate(l,dateStr){
  const F=isFinite(Number(l.amortFeeFix))?Number(l.amortFeeFix)/100:0.02;
  const V=isFinite(Number(l.amortFeeVar))?Number(l.amortFeeVar)/100:0.005;
  if(l.type==='variavel')return V;
  if(l.type==='fixa')return F;
  const d=String(dateStr||today()),st=String(l.start||d);
  const m=(Number(d.slice(0,4))-Number(st.slice(0,4)))*12+(Number(d.slice(5,7))-Number(st.slice(5,7)));
  return m<(Number(l.fixedYears)||5)*12?F:V;
}
/* quanto ainda se pode amortizar nesta prestação: dívida atual + o capital do próprio registo (em edição) */
function loanAvail(t,l){
  let a=Number(l.outstanding)||0;
  if(t&&t._edit&&t.id){const old=db.transactions.find(x=>x.id===t.id);
    if(old&&old.kind==='loan'&&old.loanId===l.id&&old.principal)a=r2(a+old.principal)}
  return a;
}
const CATS0={
  'Impostos':['IMI','AIMI','IRS sobre rendas','Imposto do selo','Mais-valias','Outro imposto'],
  'Condomínio':['Quota mensal','Quota extraordinária','Fundo de reserva'],
  'Seguros':['Multirriscos','Vida (crédito)','Renda garantida','Responsabilidade civil'],
  'Obras e benfeitorias':['Remodelação','Pintura','Canalização','Eletricidade','Cozinha','Casa de banho','Janelas'],
  'Manutenção e reparações':['Eletrodomésticos','Caldeira / AVAC','Pequenas reparações','Chaves e fechaduras','Pragas'],
  'Água, luz e gás':['Água','Eletricidade','Gás','Internet e TV'],
  'Gestão e mediação':['Comissão de arrendamento','Gestão do imóvel','Anúncios','Vistorias'],
  'Serviços profissionais':['Contabilidade','Advogado','Notário e registos','Certificado energético','Avaliação'],
  'Mobiliário e equipamento':['Mobiliário','Eletrodomésticos','Decoração'],
  'Limpeza e jardim':['Limpeza','Jardinagem','Recolha de lixo'],
  'Custos bancários':['Comissões','Amortização antecipada','Avaliação do banco'],
  'Crédito à habitação':['Prestação mensal','Amortização antecipada'],
  'Dívidas a terceiros':['Reembolso de empréstimo','Juros'],
  'Outros':[]
};
/* receitas: rendas, reembolsos, empréstimos recebidos… */
const CATS_IN0={
  'Rendas':['Renda mensal','Renda em atraso','Caução'],
  'Reembolsos':['Seguro','Condomínio','Inquilino','Estado'],
  'Empréstimos recebidos':['Família','Amigos','Outro'],
  'Subsídios e apoios':[],
  'Outras receitas':[]
};
const TAGS0=['Urgente','A reembolsar','Recorrente','Dedutível','Em disputa'];
const blank={v:13,properties:[],owners:[],tenants:[],contracts:[],transactions:[],settlements:[],templates:[],recurring:[],groups:[],
  settings:{growth:2,inflation:2,years:10,theme:'auto',capTarget:5,quota:100,payTax:true,stampPct:4,
            cats:JSON.parse(JSON.stringify(CATS0)),catsIn:JSON.parse(JSON.stringify(CATS_IN0)),tags:TAGS0.slice()}};

function uid(){try{return crypto.randomUUID()}catch(e){return 'id'+Date.now()+Math.random().toString(16).slice(2,8)}}
/* versões anteriores guardavam a imagem em base64 dentro dos dados (rebentava a quota do localStorage);
   agora fica só em IndexedDB. O que vier em "data" é migrado para lá e retirado dos dados. */
const INLINE_DATA=[];
const normFile=f=>{const o=Object.assign({id:uid(),name:'',type:'',size:0,added:''},f||{});
  if(o.data){INLINE_DATA.push({id:o.id,data:o.data});delete o.data}return o};
function migrateInline(){
  if(!INLINE_DATA.length)return;
  const list=INLINE_DATA.splice(0);
  Promise.all(list.map(x=>idbGet(x.id).then(b=>{if(b)return;return fetch(x.data).then(r=>r.blob()).then(bl=>idbPut(x.id,bl))}).catch(()=>{})))
    .then(()=>{save()});
}
function normLoan(l){const o=Object.assign({id:uid(),name:'',bank:'',outstanding:0,years:30,type:'fixa',
  rate:0,fixedYears:5,euribor:0,spread:0,index:'6m',start:'',stampTax:true,amortFeeFix:2,amortFeeVar:0.5,files:[]},l||{});
  delete o.active;delete o.taeg;delete o.mtic;
  if(o.stampTax===undefined)o.stampTax=true;
  o.files=(o.files||[]).map(normFile);return o}
function normPerson(p){const o=Object.assign({id:uid(),name:'',phone:'',email:'',nif:'',gender:'',marital:'',
  nationality:'Portuguesa',birth:'',cc:'',ccValid:'',taxAddress:'',notes:'',files:[]},p||{});
  o.files=(o.files||[]).map(normFile);return o}
function normProp(p){
  const o=Object.assign({id:uid(),name:'',address:'',use:'investimento',rentalMode:'inteiro',rooms:[],
    value:0,purchase:0,ownerIds:[],ownerShares:{},notes:'',listing:'',photos:[],loans:[],
    parish:'',concelho:'',freguesia:'',fraction:'',floor:'',street:'',doorNumber:'',postalCode:'',locality:'',registry:'',matrix:'',licence:'',energyCert:'',energyClass:'',energyValid:''},p||{});
  if(!o.purchase&&p&&p.equity)o.purchase=p.equity;   /* v12 chamava-lhe capital próprio */
  delete o.equity;
  /* v8 tinha um crédito único; passa a ser a primeira hipoteca da lista */
  if(!o.loans.length&&o.loan&&o.loan.active)o.loans=[Object.assign({},o.loan,{name:'Aquisição'})];
  if(!o.loans.length&&Array.isArray(p&&p.loans))o.loans=p.loans.slice();
  o.loans=(o.loans||[]).map(normLoan).map(l=>Object.assign(l,{name:l.name||l.bank||'Hipoteca'}));
  ['vpt','imiRate','status','monthlyRent','rentIncrease','tenant','loan','loanId'].forEach(k=>{delete o[k]});
  o.rooms=(o.rooms||[]).map(r=>typeof r==='string'?{id:uid(),name:r}:Object.assign({id:uid(),name:''},r));
  o.photos=(o.photos||[]).map(normFile);
  const sh={};Object.keys(o.ownerShares||{}).forEach(k=>{const v=Number(o.ownerShares[k]);if((o.ownerIds||[]).indexOf(k)>-1&&isFinite(v)&&v>=0)sh[k]=v});
  o.ownerShares=sh;
  return o;
}
function normContract(c){
  const o=Object.assign({id:uid(),name:'',propertyId:null,roomId:null,tenantIds:[],rent:0,taxRate:0,iban:'',
    ownerEmail:'',ownerPhone:'',tenantEmail:'',tenantPhone:'',ownerContactId:'',tenantContactId:'',
    photoIds:[],keys:[],
    deposit:0,payDay:1,payDayTo:0,advance:0,autoRec:true,start:'',end:'',increase:null,active:true,notes:'',files:[],inventory:[]},c||{});
  o.files=(o.files||[]).map(normFile);
  o.inventory=(o.inventory||[]).map(i=>Object.assign({id:uid(),name:'',qty:1,state:'usado'},i));
  o.keys=(o.keys||[]).map(i=>Object.assign({id:uid(),name:'',qty:1},i));
  return o;
}
/* kind: income (renda), expense (despesa), loan (prestação), owed (dívida recebida de terceiro),
   repay (pagamento dessa dívida), settle (acerto entre proprietários: paidBy → toId).
   split: como o valor se divide entre os donos — {mode:'quota'|'pct'|'amount'|'adjust',parts:{ownerId:n}} */
const normTx=t=>{const o=Object.assign({id:uid(),kind:'expense',label:'',amount:0,date:'',propertyId:null,contractId:null,
  loanId:null,payType:'prestacao',paidBy:null,toId:null,creditor:'',category:'',sub:'',tags:[],notes:'',split:null,groupId:null,psplit:null},t||{});
  if(o.split&&(!o.split.mode||o.split.mode==='quota'))o.split=null;
  if(o.split){o.split={mode:o.split.mode,parts:Object.assign({},o.split.parts||{})}}
  if(o.propertyId)o.groupId=null;
  if(!o.groupId)o.psplit=null;
  if(o.psplit&&!o.psplit.mode)o.psplit=null;
  if(o.psplit){o.psplit={mode:o.psplit.mode,parts:Object.assign({},o.psplit.parts||{})}}
  return o};
/* as liquidações antigas (lista própria) passam a movimentos do tipo "acerto" */
function migrateSettlements(d){
  (d.settlements||[]).forEach(x=>{
    if(d.transactions.some(t=>t.id===x.id))return;
    d.transactions.push(normTx({id:x.id||uid(),kind:'settle',label:'Transferência entre proprietários',amount:Number(x.amount)||0,date:x.date||'',
      propertyId:x.propertyId||null,paidBy:x.fromId||null,toId:x.toId||null}));
  });
  d.settlements=[];
}
/* categorias novas que uma base antiga ainda não tem */
function fillCats(st){
  st.exclude=st.exclude||{};
  if(!st.cats||!Object.keys(st.cats).length)st.cats=JSON.parse(JSON.stringify(CATS0));
  else['Crédito à habitação','Dívidas a terceiros'].forEach(k=>{if(!(k in st.cats))st.cats[k]=CATS0[k].slice()});
  if(!st.catsIn||!Object.keys(st.catsIn).length)st.catsIn=JSON.parse(JSON.stringify(CATS_IN0));
}
const normSettle=x=>Object.assign({id:uid(),date:'',propertyId:null,fromId:null,toId:null,amount:0},x||{});
/* modelo: um movimento guardado para repetir à mão; recorrência: repete-se sozinho e pede confirmação */
const TX_TPL_KEYS=['kind','label','amount','propertyId','groupId','psplit','contractId','loanId','paidBy','toId','creditor','category','sub','tags','notes','split','interest','stamp','principal','fee','payType'];
function txSnapshot(t){const o={};TX_TPL_KEYS.forEach(k=>{if(t[k]!==undefined)o[k]=JSON.parse(JSON.stringify(t[k]))});return o}
const normTpl=x=>{const o=Object.assign({id:uid(),name:''},x||{});o.tx=txSnapshot(normTx(o.tx||{}));return o};
const normRec=x=>{const o=Object.assign({id:uid(),name:'',every:'month',next:'',until:'',end:'',muted:false,auto:false},x||{});o.tx=txSnapshot(normTx(o.tx||{}));if(o.until&&o.until<o.next)o.until=o.next;return o};
/* grupo: conjunto de imóveis, proprietários ou contratos com um nome */
const normGroup=g=>{const o=Object.assign({id:uid(),name:'',kind:'prop',ids:[]},g||{});o.ids=(o.ids||[]).slice();return o};

const CATMAP={'IMI':['Impostos','IMI'],'Seguro':['Seguros','Multirriscos'],'Água/Luz/Gás':['Água, luz e gás',''],
  'Obras':['Obras e benfeitorias',''],'Manutenção':['Manutenção e reparações',''],'Comissões':['Gestão e mediação','']};

let db=load();
function load(){
  let d=null;
  try{d=JSON.parse(rawGet(KEY)||'null')}catch(e){}
  if(!d)for(const k of OLDS){let o=null;try{o=JSON.parse(rawGet(k)||'null')}catch(e){}if(o){d=o;break}}
  d=d||{};
  const out=Object.assign({},blank,d,{settings:Object.assign({},blank.settings,d.settings||{})});
  fillCats(out.settings);
  if(!Array.isArray(out.settings.tags))out.settings.tags=TAGS0.slice();
  const newContracts=[];

  out.properties=(out.properties||[]).map(p=>{
    const np=normProp(p);
    if(p.use==null)np.use=(p.status==='proprio')?'proprio':'investimento';
    /* versões antigas guardavam a renda no imóvel ou nos inquilinos */
    const olds=(d.tenants||[]).filter(t=>t.propertyId===np.id);
    if(olds.length&&!(d.contracts||[]).length){
      if(olds.length>1){
        np.rentalMode='quartos';
        olds.forEach((t,i)=>{
          const room={id:uid(),name:(t.notes&&/quarto/i.test(t.notes))?t.notes:'Quarto '+(i+1)};
          np.rooms.push(room);
          newContracts.push(normContract({propertyId:np.id,roomId:room.id,tenantIds:[t.id],rent:t.rent||0,

const RICH_TAGS={B:'b',STRONG:'b',I:'i',EM:'i',S:'s',STRIKE:'s',DEL:'s',U:'u',CODE:'code',PRE:'pre',OL:'ol',UL:'ul',LI:'li',BR:'br',DIV:'div',P:'p'};

const ZW='\u200B';   /* marcador invisível que segura o cursor dentro de um <b>/<i>/<s> vazio */
const INLINE_TAGS={b:1,i:1,s:1,u:1,code:1};
function sanitizeRich(html){
  let doc;try{doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html')}catch(e){return esc(html)}
  const walk=node=>{let out='';[].slice.call(node.childNodes).forEach(ch=>{
    if(ch.nodeType===3){out+=esc(ch.nodeValue.replace(/\u200B/g,''));return}
    if(ch.nodeType!==1||ch.tagName==='SCRIPT'||ch.tagName==='STYLE')return;
    const t=RICH_TAGS[ch.tagName];

    if(t==='br'){out+='<br>';return}
    const inner=walk(ch);
    if(INLINE_TAGS[t]&&!inner)return;   /* marca vazia (só tinha o marcador) */
    out+=`<${t}>${inner}</${t}>`;

  return walk(doc.body.firstChild||doc.body);

  const r=s.getRangeAt(0),tags=RICH_INLINE[cmd];

   Cada movimento com "pago por" fica a crédito de quem pagou, e o custo divide-se
   em partes iguais pelos proprietários do imóvel. Receber uma renda é o inverso:

  if(!given.length){os.forEach(o=>{out[o]=1/os.length});return out}
  const sumG=sum(given.map(o=>Number(raw[o])));
  /* quem não tem percentagem fica com o que falta até 100%, em partes iguais */
  const rest=blank.length?Math.max(0,100-sumG):0,tot=sumG+rest;

function ownerBalances(pid){
  const props=pid?[prop(pid)].filter(Boolean):scope(),cents={};
  props.forEach(p=>{
    const os=ownersOfProp(p).slice().sort();if(os.length<2)return;
    os.forEach(o=>{if(cents[o]===undefined)cents[o]=0});
    db.transactions.filter(t=>countsBetweenOwners(t)&&t.propertyId===p.id&&os.indexOf(t.paidBy)>-1).forEach(t=>{
      const sign=isIn(t.kind)?-1:1,total=Math.abs(Math.round((Number(t.amount)||0)*100));
      cents[t.paidBy]+=total*sign;
      txSplitCents(t,p,os).forEach((part,i)=>{cents[os[i]]-=part*sign});
    });
    db.transactions.filter(t=>t.propertyId===p.id&&t.kind==='settle').forEach(t=>{
      const v=Math.round((Number(t.amount)||0)*100);
      if(cents[t.paidBy]!==undefined)cents[t.paidBy]+=v;
      if(cents[t.toId]!==undefined)cents[t.toId]-=v;
    });
  });
  /* sem imóvel: divide-se por todos os proprietários; com grupo: pelos donos de cada imóvel do grupo */
  db.transactions.filter(t=>countsBetweenOwners(t)&&!t.propertyId).forEach(t=>{
    const sign=isIn(t.kind)?-1:1,total=Math.abs(Math.round((Number(t.amount)||0)*100));
    const add=(o,v)=>{if(cents[o]===undefined)cents[o]=0;cents[o]+=v};
    if(t.groupId){
      txProps(t).filter(p2=>props.some(p3=>p3.id===p2.id)).forEach(p2=>{
        const cP=Math.round(total*txPropShare(t,p2.id)),os=ownersOfProp(p2).slice().sort();
        if(!os.length||!cP)return;
        add(t.paidBy,cP*sign);
        txSplitCents(Object.assign({},t,{amount:cP/100}),p2,os).forEach((part,i)=>add(os[i],-part*sign));
      });
    }else if(!pid&&!ownerFilter){
      const os=db.owners.map(o=>o.id).sort();if(!os.length)return;

function settlePlan(bal){

/* O wrapper Android injeta os valores exatos. Fora dele, medimos o env() e,
   se der zero num ecrã sem barra do browser, assumimos uma barra de estado. */
function fitInsets(){
  const el=document.documentElement;
  if(window.__nativeInsets)return;
  let envTop=0;
  try{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden';
    document.body.appendChild(d);envTop=d.offsetHeight;d.remove();
  }catch(e){}
  if(envTop>0)return;
  let full=false;
  try{full=window.screen&&Math.abs(screen.height-window.innerHeight)<52}catch(e){}
  if(full)el.style.setProperty('--inset-top','28px');
}
window.__setInsets=function(t,b,l,r){
  window.__nativeInsets=1;
  const s=document.documentElement.style;
  s.setProperty('--inset-top',t+'px');
  s.setProperty('--inset-bottom',b+'px');
  s.setProperty('--inset-left',l+'px');
  s.setProperty('--inset-right',r+'px');
};

const W=360;
/* dica interativa: funciona a toque e a rato */
function chartTip(e,txt){
  const t=document.getElementById('tip');if(!t)return;
  t.textContent=txt;t.classList.add('on');
  const x=(e&&(e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)))||window.innerWidth/2;
  const y=(e&&(e.clientY||(e.touches&&e.touches[0]&&e.touches[0].clientY)))||120;
  /* mede e encosta às margens em vez de sair do ecrã */
  t.style.left='0px';t.style.top='0px';
  const w=t.offsetWidth,h=t.offsetHeight;
  const left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2));
  let top=y-h-14;if(top<8)top=y+18;
  t.style.left=left+'px';t.style.top=top+'px';
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);
  if(e&&e.stopPropagation)e.stopPropagation();
}
const hit=txt=>{const j=jsq(txt);return `onclick="chartTip(event,'${j}')" onmouseenter="chartTip(event,'${j}')" style="cursor:pointer"`};
/* mostra no máximo ~13 etiquetas para não ficarem ilegíveis */
function thinLabels(labels){
  const n=labels.length,step=Math.ceil(n/13);
  if(step<=1)return labels.slice();
  return labels.map((l,i)=>((n-1-i)%step===0)?l:'');   /* alinhado ao último: o fim aparece sempre */
}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1).replace('.',',')+'k':String(Math.round(v));
function axisY(min,max,x0,x1,y0,y1,fmt){
  let g='';
  for(let k=0;k<=4;k++){const v=min+(max-min)*k/4,y=y1-(y1-y0)*k/4;
    g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${x0-6}" y="${(y+3.2).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${fmt?esc(fmt(v)):kfmt(v)}</text>`}
  return g;
}
function cLine(series,labels,o){
  o=o||{};const h=o.h||180,x0=44,x1=W-6,y0=10,y1=h-8,F=o.fmt||euro;
  series.forEach(s=>{s.values=s.values.map(v=>isFinite(v)?v:0)});
  const all=[].concat(...series.map(s=>s.values));
  let max=Math.max(0,...all),min=Math.min(0,...all);
  if(max===min){max=max||1;min=Math.min(0,min)}
  const pad=(max-min)*.08;max+=pad;if(min<0)min-=pad;
  const X=i=>x0+(x1-x0)*(labels.length<2?.5:i/(labels.length-1));
  const Y=v=>y1-(y1-y0)*((v-min)/(max-min));
  let g=axisY(min,max,x0,x1,y0,y1,o.fmt);
  /* barras verticais no início de cada década */
  (o.marks||[]).forEach(m=>{
    if(m.i<0||m.i>=labels.length)return;
    g+=`<line x1="${X(m.i).toFixed(1)}" y1="${y0}" x2="${X(m.i).toFixed(1)}" y2="${y1}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"/>`;
    g+=`<text x="${(X(m.i)+3).toFixed(1)}" y="${(y0+8).toFixed(1)}" font-size="8.5" fill="var(--muted)">${esc(m.label)}</text>`;
  });
  if(min<0)g+=`<line x1="${x0}" y1="${Y(0).toFixed(1)}" x2="${x1}" y2="${Y(0).toFixed(1)}" stroke="var(--line2)"/>`;
  series.forEach((s,si)=>{
    const c=s.color||PAL[si%PAL.length];
    const pts=s.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    if(o.area!==false)g+=`<polygon points="${X(0).toFixed(1)},${Y(Math.max(min,0)).toFixed(1)} ${pts} ${X(s.values.length-1).toFixed(1)},${Y(Math.max(min,0)).toFixed(1)}" fill="${c}" opacity=".12"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{
      const tip=`${labels[i]}${series.length>1?' · '+s.name:''}: ${F(v)}`;
      if(s.values.length<=26)g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="var(--card)" stroke="${c}" stroke-width="1.8"/>`;
      g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="10" fill="transparent" ${hit(tip)}><title>${esc(tip)}</title></circle>`;
    });
  });
  /* rótulos do eixo X no próprio SVG, alinhados com os pontos (a régua HTML ficava desalinhada) */
  thinLabels(labels).forEach((l,i)=>{
    if(l==='')return;
    g+=`<text x="${X(i).toFixed(1)}" y="${h+8}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${h+13}" role="img">${g}</svg></div>
    ${series.length>1?legend(series.map((s,i)=>({label:s.name,color:s.color||PAL[i%PAL.length]})),false):''}`;
}
function cBars(groups,labels,o){
  o=o||{};const h=o.h||190,x0=44,x1=W-6,y0=10,y1=h-8;
  const tops=groups.map(g=>sum(g.filter(v=>v.value>0).map(v=>v.value)));
  const bots=groups.map(g=>sum(g.filter(v=>v.value<0).map(v=>v.value)));
  const max=Math.max(1,...tops),min=Math.min(0,...bots);
  const Y=v=>y1-(y1-y0)*((v-min)/(max-min));
  const bw=(x1-x0)/groups.length,w=Math.max(3,bw*.6);
  let g=axisY(min,max,x0,x1,y0,y1);
  g+=`<line x1="${x0}" y1="${Y(0).toFixed(1)}" x2="${x1}" y2="${Y(0).toFixed(1)}" stroke="var(--line2)"/>`;
  groups.forEach((grp,i)=>{
    const cx=x0+bw*i+bw/2;let up=0,dn=0;
    grp.forEach(seg=>{
      if(!seg.value)return;
      const a=seg.value>0?up:dn,b=a+seg.value;
      if(seg.value>0)up=b;else dn=b;
      const ya=Y(Math.max(a,b)),yb=Y(Math.min(a,b));
      const tip=`${labels[i]} · ${seg.label}: ${euro(Math.abs(seg.value))}`;
      g+=`<rect x="${(cx-w/2).toFixed(1)}" y="${ya.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,yb-ya).toFixed(1)}" rx="2" fill="${seg.color}" ${hit(tip)}><title>${esc(tip)}</title></rect>`;
    });
  });
  const names=[];groups.forEach(g2=>g2.forEach(s=>{if(!names.some(n=>n.label===s.label))names.push({label:s.label,color:s.color})}));
  thinLabels(labels).forEach((l,i)=>{
    if(l==='')return;
    g+=`<text x="${(x0+bw*i+bw/2).toFixed(1)}" y="${h+8}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${h+13}" role="img">${g}</svg></div>${legend(names,false)}`;
}
function cDonut(items,o){
  o=o||{};const S=150,th=26,r=(S-th)/2,c=S/2;
  items=items.filter(i=>i.value>0);
  const tot=sum(items.map(i=>i.value));
  if(!tot)return `<div class="hint">Sem dados.</div>`;
  let a=-Math.PI/2,g='';
  items.forEach((it,idx)=>{
    const col=it.color||PAL[idx%PAL.length],ang=it.value/tot*Math.PI*2;
    if(ang>=Math.PI*2-1e-6){g+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${th}" ${o.onPick?`onclick="${o.onPick}('${jsq(it.label)}')" style="cursor:pointer"`:''}/>`;return}
    const b=a+ang,L=ang>Math.PI?1:0;
    const tip=`${it.label}: ${euro(it.value)} (${pct(it.value/tot,0)})`;
    const act=o.onPick?`onclick="${o.onPick}('${jsq(it.label)}')" onmouseenter="chartTip(event,'${jsq(tip)}')" style="cursor:pointer"`:hit(tip);
    g+=`<path d="M${(c+r*Math.cos(a)).toFixed(2)} ${(c+r*Math.sin(a)).toFixed(2)} A${r} ${r} 0 ${L} 1 ${(c+r*Math.cos(b)).toFixed(2)} ${(c+r*Math.sin(b)).toFixed(2)}" fill="none" stroke="${col}" stroke-width="${th}" ${act}><title>${esc(tip)}</title></path>`;
    a=b;
  });
  g+=`<text x="${c}" y="${c-1}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${o.center||euro(tot)}</text>`;
  if(o.sub)g+=`<text x="${c}" y="${c+13}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${esc(o.sub)}</text>`;
  return `<div class="donut">
    <div class="chartbox pie"><svg viewBox="0 0 ${S} ${S}" role="img">${g}</svg></div>
    <div class="leg">${legend(items.map((it,i)=>({label:it.label,color:it.color||PAL[i%PAL.length],value:euro(it.value),extra:pct(it.value/tot,0),
      act:o.onPick?`${o.onPick}('${jsq(it.label)}')`:''})),true)}</div></div>`;
}
function cHBars(items,o){
  o=o||{};if(!items.length)return `<div class="hint">Sem dados.</div>`;
  const max=Math.max(...items.map(i=>Math.abs(i.value)))||1;
  return `<div class="legend" style="gap:11px">${items.map((it,i)=>{
    const neg=it.value<0,col=it.color||(neg?'var(--danger)':PAL[i%PAL.length]);
    return `<div ${hit(it.label+': '+(o.fmt?o.fmt(it.value):euro(it.value)))}><div class="li" style="margin-bottom:4px"><span class="nm" style="color:var(--ink)">${esc(it.label)}</span>
      <span class="vl ${neg?'neg':''}">${o.fmt?o.fmt(it.value):euro(it.value)}</span></div>
      <div style="height:8px;border-radius:99px;background:var(--chip);overflow:hidden">
      <i style="display:block;height:100%;width:${(Math.abs(it.value)/max*100).toFixed(1)}%;background:${col};border-radius:99px"></i></div></div>`}).join('')}</div>`;

function legend(items,withVal){

/* ================= CRÉDITO ================= */
function rateAt(l,m){
  l=normLoan(l);
  const vr=(Number(l.euribor)||0)+(Number(l.spread)||0);
  if(l.type==='variavel')return vr;
  if(l.type==='mista')return m<Math.round((Number(l.fixedYears)||0)*12)?(Number(l.rate)||0):vr;
  return Number(l.rate)||0;
}
/* prestações já registadas deste crédito (amortizações antecipadas não contam):
   encurtam o prazo restante e avançam a fase da taxa nas mistas */
function loanPaidN(l){
  if(!l||!l.id||!db||!db.transactions)return 0;
  return db.transactions.filter(t=>t.kind==='loan'&&t.loanId===l.id&&t.payType!=='amortizacao').length;
}
function amort(l,maxMonths){
  const ofs=Number(l._paidOfs)||0;
  const paid=Math.max(0,loanPaidN(l)+ofs);
  l=normLoan(l);
  const n=Math.max(1,Math.round((Number(l.years)||0)*12)-paid);
  let bal=Number(l.outstanding)||0,pay=null,last=null,ti=0,ts=0;
  const rows=[];
  for(let k=0;k<n;k++){
    const r=rateAt(l,paid+k),i=r/100/12;
    if(pay===null||r!==last){const rem=n-k;pay=i>0?bal*i/(1-Math.pow(1+i,-rem)):bal/rem;last=r}
    const int=bal*i,st=(l.stampTax===false?0:int*stampPct()),cap=Math.min(bal,pay-int);
    bal=Math.max(0,bal-cap);ti+=int;ts+=st;
    rows.push({m:k+1,rate:r,pay,int,st,cap,bal});
    if(bal<=0||(maxMonths&&rows.length>=maxMonths))break;
  }
  return {rows,totInt:ti,totStamp:ts,n};
}
function loanCalc(l){
  const a=amort(l,1),r=a.rows[0]||{pay:0,int:0,st:0,cap:0};
  return {base:r.pay,interest:r.int,stamp:r.st,principal:r.cap,total:r.pay+r.st,rate:rateAt(l,0),n:a.n};
}
const loanCost=l=>{const a=amort(l);return a.totInt+a.totStamp};
function rateLabel(l){
  if(l.type==='fixa')return `fixa ${dec(l.rate)}%`;
  if(l.type==='variavel')return `Euribor ${l.index} ${dec(l.euribor)}% + ${dec(l.spread)}% = ${dec(rateAt(l,0))}%`;
  return `${dec(l.rate)}% durante ${dec(l.fixedYears)} anos, depois ${dec((Number(l.euribor)||0)+(Number(l.spread)||0))}%`;
}

/* miniatura pequena de uma foto: usa a guardada (tn_), ou cria-a uma vez a partir do original */
function thumbSrc(id){
  if(thumbCache[id])return Promise.resolve(thumbCache[id]);
  return idbGet('tn_'+id).then(tb=>{
    if(tb){thumbCache[id]=URL.createObjectURL(tb);return thumbCache[id]}
    return idbGet(id).then(b=>{
      if(!b)return null;
      return makeThumb(b).then(tb2=>{
        if(tb2)idbPut('tn_'+id,tb2).catch(()=>{});
        thumbCache[id]=URL.createObjectURL(tb2||b);return thumbCache[id];
      }).catch(()=>{thumbCache[id]=URL.createObjectURL(b);return thumbCache[id]});
    });
  });
}
function makeThumb(blob){
  return createImageBitmap(blob).then(bm=>{
    const k=Math.min(1,220/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    try{bm.close()}catch(e){}
    return new Promise(r=>c.toBlob(r,'image/jpeg',.78));
  });
}
function paintThumbs(list,root){
  root=root||(modalTop()?modalTop().el:document);
  (list||[]).forEach(f=>{
    const box=root.querySelector('[id="th_'+f.id+'"]');if(!box)return;
    thumbSrc(f.id)
      .then(src=>{if(src&&box){const o=box.querySelector('img');if(o)o.remove();box.insertAdjacentHTML('afterbegin',`<img src="${src}" alt="">`)}}).catch(()=>{});
  });
}

/* ================= MODAL =================
   Janelas empilhadas: abrir uma segunda janela não fecha a primeira — fica por baixo,
   escurecida e inerte, e volta quando a de cima fecha. Só a janela de cima mantém os
   ids (os da de baixo passam para data-mid), por isso getElementById continua a apontar
   para o formulário que está a ser editado. */
let modalStack=[];
const modalTop=()=>modalStack[modalStack.length-1]||null;
const modalBodyEl=()=>{const t=modalTop();return t?t.el.querySelector('.body'):null};
Object.defineProperty(window,'onSave',{configurable:true,
  get(){const t=modalTop();return t?t.onSave:null},
  set(v){const t=modalTop();if(t)t.onSave=v}});
function modalLayer(){
  const m=document.createElement('div');m.className='modal open';
  m.innerHTML=`<div class="bg" onclick="closeModal()"></div><div class="sheet">
    <div class="head"><h2 id="modalTitle"></h2><div class="spacer"></div><span id="modalMenu"></span>
      <button class="iconbtn" onclick="closeModal()" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="body" id="modalBody"></div><div class="foot" id="modalFoot"></div></div>`;
  return m;
}
function demote(el){
  [].slice.call(el.querySelectorAll('[id]')).forEach(x=>{x.setAttribute('data-mid',x.id);x.removeAttribute('id')});
  el.classList.add('under');el.setAttribute('aria-hidden','true');try{el.inert=true}catch(e){}
}
function promote(el){
  [].slice.call(el.querySelectorAll('[data-mid]')).forEach(x=>{x.id=x.getAttribute('data-mid');x.removeAttribute('data-mid')});
  el.classList.remove('under');el.removeAttribute('aria-hidden');try{el.inert=false}catch(e){}
}
function fillModal(el,title,body,foot,menuHtml){
  el.querySelector('.head h2').textContent=title;
  el.querySelector('.body').innerHTML=body;
  el.querySelector('.head span').innerHTML=menuHtml||'';
  el.querySelector('.foot').innerHTML=foot||`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="onSave&&onSave()">Guardar</button>`;
}
/* o botão “voltar” do Android fecha primeiro o que estiver aberto (janela ou menu).
   Uma única sentinela no histórico enquanto houver camadas: voltar fecha a de cima
   e volta a armar a sentinela se ainda restarem; sem nada aberto, sai da app. */
let _histOn=false;
function pushHist(){if(_histOn)return;try{history.pushState({gi:1},'');_histOn=true}catch(e){}}
window.addEventListener('popstate',()=>{
  _histOn=false;
  closePops();
  const drawer=document.body.classList.contains('open');
  if(drawer||modalStack.length){
    if(drawer)closeDrawer(true);else closeModal(true);
    if(document.body.classList.contains('open')||modalStack.length)pushHist();
  }else{
    try{history.back()}catch(e){}
  }
});
function openModal(title,body,foot,menuHtml){
  closePops();
  const top=modalTop();if(top)demote(top.el);
  const el=modalLayer();document.body.appendChild(el);
  const L={el,title,onSave:null};modalStack.push(L);lockPage();pushHist();
  fillModal(el,title,body,foot,menuHtml);
  el.querySelector('.body').scrollTop=0;
  return L;
}
/* substitui o conteúdo da janela de cima (sem empilhar) */
function setModal(title,body,foot,menuHtml){
  const t=modalTop();if(!t)return openModal(title,body,foot,menuHtml);
  closePops();t.title=title;t.onSave=null;fillModal(t.el,title,body,foot,menuHtml);return t;
}
function closeModal(fromPop){
  closePops();
  const L=modalStack.pop();lockPage();if(!L)return;
  L.el.remove();
  const top=modalTop();if(top)promote(top.el);
}

/* ================= MÉTRICAS ================= */
/* opts.share: com a vista filtrada por proprietário, cada imóvel entra pela quota-parte dele */
function metrics(y,pid,opts){
  const ps=pidProps(pid);
  const k=(opts&&opts.share)?sh:()=>1;
  const ids={};ps.forEach(p=>ids[p.id]=k(p));
  const inM=x=>x.propertyId?ids[x.propertyId]!==undefined:(x.groupId?txProps(x).some(p=>ids[p.id]!==undefined):!pid&&!ownerFilter);
  const wM=x=>x.groupId?sum(txProps(x).filter(p=>ids[p.id]!==undefined).map(p=>txPropShare(x,p.id))):1;
  const t=db.transactions.filter(x=>String(x.date||'').startsWith(String(y))&&inM(x));
  const f=x=>txShare(x,opts&&opts.share)*wM(x);
  const income=sum(t.filter(x=>x.kind==='income'&&countsInTotals(x)).map(x=>x.amount*f(x)));
  const op=sum(t.filter(x=>x.kind==='expense'&&countsInTotals(x)).map(x=>x.amount*f(x)));
  const loan=sum(t.filter(x=>x.kind==='loan').map(x=>x.amount*f(x)));
  const rented=ps.filter(isRented);
  const value=sum(ps.map(p=>p.value*k(p))),rentedValue=sum(rented.map(p=>p.value*k(p)));
  const annualRent=sum(ps.map(p=>rentOf(p)*12*k(p)));
  const purchase=sum(ps.map(p=>p.purchase*k(p)));
  const debt=sum(ps.map(p=>debtOf(p)*k(p)));
  const noi=income-op,cf=noi-loan;
  return{t,props:ps,rented,income,op,loan,noi,cf,value,rentedValue,annualRent,purchase,debt,
    grossYield:rentedValue?annualRent/rentedValue:NaN,cap:value?noi/value:NaN,
    coc:purchase?cf/purchase:NaN,ltv:value?debt/value:NaN};
}
const txShare=(t,share)=>share&&ownerFilter&&!ownerIsGrp()&&t.propertyId?txOwnerFrac(t,ownerFilter):1;
const monthly=(y,pid,kind,share)=>[...Array(12)].map((_,i)=>{
  const mo=`${y}-${String(i+1).padStart(2,'0')}`;
  return sum(db.transactions.filter(t=>String(t.date).startsWith(mo)&&t.kind===kind&&countsInTotals(t)).map(t=>t.amount*txShare(t,share)*txW(t,pid)));
});
/* cat: se indicado, devolve as subcategorias dessa categoria */
function byCategory(y,pid,share,cat){
  const map={};
  db.transactions.filter(t=>t.kind==='expense'&&countsInTotals(t)&&String(t.date).startsWith(String(y))&&(!cat||(t.category||'Outros')===cat))
    .forEach(t=>{const w=txW(t,pid);if(!w)return;const k=cat?(t.sub||'Sem subcategoria'):(t.category||'Outros');map[k]=(map[k]||0)+t.amount*txShare(t,share)*w});
  return Object.keys(map).map(k=>({label:k,value:map[k]})).sort((a,b)=>b.value-a.value);
}

let kpiN=0;const KPI_REG={};
/* evo: função que devolve a série do indicador ao longo do tempo; ao tocar abre-se uma janela com a evolução */
const kpi=(l,v,c,f,why,evo)=>{
  const id='k'+(++kpiN);
  if(evo){KPI_REG[id]={title:l,why:why||'',evo};
    return `<div class="card kpi evo" id="${id}" onclick="kpiModal('${id}')"><span class="kic">${ic('trend',11)}</span>
      <div class="label">${l}</div><div class="value ${c||''}">${v}</div>${f?`<div class="foot">${f}</div>`:''}</div>`}
  return `<div class="card kpi ${why?'why':''}" id="${id}" ${why?`onclick="document.getElementById('${id}').classList.toggle('open')"`:''}>
    <div class="label">${l}</div><div class="value ${c||''}">${v}</div>${f?`<div class="foot">${f}</div>`:''}
    ${why?`<div class="expl">${why}</div>`:''}</div>`;
};
function kpiModal(id){
  const k=KPI_REG[id];if(!k)return;
  let d;try{d=k.evo()}catch(e){d=null}
  if(!d)return;
  const fmt=d.fmt||euro;
  const vals=(d.yearly||[]).map(y=>y.value);
  const body=`<div class="form">

    ${d.monthly?`<div><div class="flabel">Mês a mês em ${YEAR}</div>${cLine([{name:k.title,values:d.monthly,color:PAL[0]}],MES,{h:170,fmt})}</div>`:''}

    ${(d.yearly||[]).length?`<div class="tablewrap"><table class="table"><thead><tr><th>${d.yearlyTitle?'Período':'Ano'}</th><th>${esc(k.title)}</th>${d.yearly[0].extra!==undefined?'<th>'+esc(d.extraTitle||'')+'</th>':''}</tr></thead><tbody>
      ${d.yearly.map(y=>`<tr><td><b>${esc(String(y.label))}</b></td><td>${fmt(y.value)}</td>${y.extra!==undefined?`<td>${y.extra}</td>`:''}</tr>`).join('')}</tbody></table></div>`:''}
    ${d.note?`<div class="hint">${d.note}</div>`:''}</div>`;

/* anos com movimentos (no âmbito), mais o corrente */
function yearsWithData(pid){
  const ys={};ys[YEAR]=1;
  db.transactions.forEach(t=>{const y=Number(String(t.date||'').slice(0,4));if(y&&(pid?t.propertyId===pid:inScope(t.propertyId)))ys[y]=1});
  return Object.keys(ys).map(Number).sort();
}
function evoMoney(field,pid,fmt){
  const kind={income:'income',op:'expense',loan:'loan'}[field];
  const monthly=kind?monthly_(YEAR,pid,kind):[...Array(12)].map((_,i)=>monthly_(YEAR,pid,'income')[i]-monthly_(YEAR,pid,'expense')[i]-monthly_(YEAR,pid,'loan')[i]);
  return {fmt:fmt||euro,monthly,yearly:yearsWithData(pid).map(y=>({label:y,value:metrics(y,pid,{share:true})[field]}))};
}
const monthly_=(y,pid,kind)=>monthly(y,pid,kind,true);
function evoRatio(field,pid){
  if(field==='cap'||field==='coc')return {fmt:v=>pct(v),yearly:yearsWithData(pid).map(y=>({label:y,value:metrics(y,pid,{share:true})[field]}))};
  /* yield bruto e LTV: projeção com os aumentos de renda e a amortização das hipotecas */
  const s=db.settings,n=Math.max(2,Math.round(s.years)),ps=pid?[prop(pid)].filter(Boolean):scope();
  const value=sum(ps.map(p=>p.value*sh(p)));
  const act=db.contracts.filter(c=>isActive(c)&&ps.some(p=>p.id===c.propertyId));
  const out=[];
  for(let i=0;i<n;i++){
    if(field==='grossYield'){
      const rent=sum(act.map(c=>c.rent*sh(prop(c.propertyId))*12*Math.pow(1+((c.increase==null?s.growth:c.increase)/100),i)));
      const rv=sum(ps.filter(isRented).map(p=>p.value*sh(p)));
      out.push({label:YEAR+i,value:rv?rent/rv:NaN,extra:euro(rent)});
    }else{
      const debt=sum(ps.map(p=>sh(p)*sum(liveLoans(p).map(l=>{const a=amort(l,(i+1)*12);return a.rows.length?a.rows[a.rows.length-1].bal:0}))));
      out.push({label:YEAR+i,value:value?debt/value:NaN,extra:euro(debt)});
    }
  }
  return {fmt:v=>pct(v),yearly:out,yearlyTitle:'Projeção ano a ano',extraTitle:field==='grossYield'?'Renda anual':'Em dívida',marks:decadeMarks(YEAR,n),
    note:field==='grossYield'?'Renda projetada com o aumento anual de cada contrato, sobre o valor de mercado atual.':'Dívida no fim de cada ano segundo o plano de cada hipoteca, sobre o valor de mercado atual.'};
}

function ctFMatch(c,s){
  if(s.p&&c.propertyId!==s.p)return false;

  if(s.g){const g=grp(s.g);if(!g||(g.ids||[]).indexOf(c.id)<0)return false}

  return lfHit('lcts',[ctName(c),c.name,p?p.name:'',c.roomId&&p?roomName(p,c.roomId):'',c.iban,c.notes,String(c.rent),
    ts.map(t=>[t.name,t.phone,t.email,t.nif].join(' ')).join(' '),c.tenantEmail,c.tenantPhone,c.ownerEmail,c.ownerPhone].join(' '));
}

function txFilterCount(){

}
/* pesquisa por palavras e por frases entre aspas, sem ligar a acentos */
const deacc=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function txTerms(){
  const out=[];
  const rest=String(txSearch||'').replace(/"([^"]*)"/g,(m,ph)=>{if(ph.trim())out.push(deacc(ph.trim()));return ' '});
  rest.split(/\s+/).forEach(w=>{if(w)out.push(deacc(w))});
  return out;
}
function txHay(t){
  const c=t.contractId?contract(t.contractId):null;
  return deacc([t.label,t.notes,t.category,t.sub,(t.tags||[]).join(' '),t.creditor,t.date,
    propName(t.propertyId),t.groupId?((grp(t.groupId)||{}).name||''):'',c?ctName(c):'',
    t.paidBy&&owner(t.paidBy)?owner(t.paidBy).name:'',t.toId&&owner(t.toId)?owner(t.toId).name:'',
    String(t.amount),euro2(t.amount)].join(' '));
}

  _qT=setTimeout(()=>{txSearch=v;render();
    const i=document.getElementById('tx_q');

function txMatch(t){
  if(txFilter==='debt'){if(t.kind!=='owed'&&t.kind!=='repay')return false}
  else if(txFilter&&t.kind!==txFilter)return false;
  if(txProp==='__none__'){if(t.propertyId||t.groupId)return false}
  else if(String(txProp||'').startsWith('g:')){const gid=txProp.slice(2),g=grp(gid),gids=(g||{}).ids||[];
    if(!(t.groupId===gid||(t.propertyId&&gids.indexOf(t.propertyId)>-1)))return false}
  else if(txProp){if(t.propertyId){if(t.propertyId!==txProp)return false}else if(t.groupId&&txPropShare(t,txProp)<=0)return false}   /* sem imóvel = de todos */
  if(t.propertyId){if(!inScope(t.propertyId))return false}
  else if(t.groupId){if(ownerFilter&&!txProps(t).some(p=>inScope(p.id)))return false}
  else if(ownerFilter)return false;
  if(txPaid&&!(t.paidBy===txPaid||t.toId===txPaid||(!t.paidBy&&txNoPayer)))return false;
  if(!txNoPayer&&!t.paidBy)return false;
  if(txSearch.trim()){const hay=txHay(t);for(const term of txTerms())if(hay.indexOf(term)<0)return false}
  if(txCat==='__none__'){if(t.category)return false}
  else if(txCat&&t.category!==txCat)return false;
  if(txSub==='__none__'){if(t.sub)return false}
  else if(txSub&&t.sub!==txSub)return false;
  return true;
}
function filterSummary(){
  const p=[];
  if(txFilter)p.push((KIND[txFilter]||{}).short||txFilter);
  if(txProp==='__none__')p.push('sem imóvel');
  else if(String(txProp||'').startsWith('g:'))p.push('grupo '+((grp(txProp.slice(2))||{}).name||''));
  else if(txProp)p.push(propName(txProp));
  if(ownerFilter)p.push('de '+ownerFilterName());
  if(txPaid)p.push('pago/recebido por '+((owner(txPaid)||{}).name||''));
  if(txCat==='__none__')p.push('sem categoria');else if(txCat)p.push(txCat+(txSub&&txSub!=='__none__'?' / '+txSub:''));
  if(txSub==='__none__')p.push('sem subcategoria');
  if(!txNoPayer)p.push('só com pessoa atribuída');
  return esc(p.join(' · '));
}

function lfSearch(k,v){lfState(k).q=v}
function lfClear(k){
  const s=lf(k);listF[k]={_open:s._open};
  if(lfDraft&&lfDraftK===k)lfDraft={};
  if(k==='lprops')ownerFilter='';
  closePops();render();
}
function lfCount(k){const s=lf(k);return Object.keys(s).reduce((n,f)=>{
  if(f==='_open'||f==='sb'||f==='sd')return n;
  return n+(f==='q'?(String(s.q||'').trim()?1:0):(s[f]?1:0))},0)}
function lfHit(k,hay){const q=String(lf(k).q||'');if(!q.trim())return true;
  const h=deacc(hay),terms=[];
  q.replace(/"([^"]*)"/g,(m,ph)=>{if(ph.trim())terms.push(deacc(ph.trim()));return ' '}).split(/\s+/).forEach(w=>{if(w)terms.push(deacc(w))});
  for(const t of terms)if(h.indexOf(t)<0)return false;return true}
/* seleções em rascunho: só entram em vigor ao tocar em Aplicar */
let lfDraft=null,lfDraftK='';
const lfState=k=>(lf(k)._open&&lfDraft&&lfDraftK===k)?lfDraft:lf(k);
function lfSel(k,key,opts){
  const id='lfsel_'+k+'_'+key,fn='onlf_'+k+'_'+key;
  window[fn]=()=>{lfState(k)[key]=val(id)||''};
  return `<div style="width:100%">${sel(id,lfState(k)[key]||'',opts,fn)}</div>`;
}
function lfToggle(k){
  const s=lf(k);
  if(s._open){s._open=false;lfDraft=null}
  else{s._open=true;lfDraftK=k;lfDraft=Object.assign({},s);delete lfDraft._open}
  render();
}
function lfApply(k){
  const d=Object.assign({},lfDraft||{},{_open:false});
  listF[k]=d;lfDraft=null;
  if(k==='lprops')ownerFilter=d.own||'';
  closePops();render();
}
/* o dropdown de filtros (aberto pelo botão do cabeçalho) inclui a pesquisa no topo */

      ${lfSel(k,'sb',[{v:'',label:sorts.defLabel||'Ordem original'}].concat(sorts.opts))}
      ${lfSel(k,'sd',[{v:'',label:'Ascendente'},{v:'desc',label:'Descendente'}])}</div>`:'';
  return `<div class="fwrap" style="height:0"><div class="fpanel ${s._open?'on':''}" style="top:0"><div class="card" style="padding:12px">

/* aplica a ordenação escolhida; sem escolha, mantém a ordem dada */
function lfSort(k,list,keys){
  const s=lf(k),f=keys[s.sb];if(!f)return list;
  const dir=s.sd==='desc'?-1:1;
  return list.slice().sort((a,b)=>{const x=f(a),y=f(b);
    if(typeof x==='string'||typeof y==='string')return dir*String(x??'').localeCompare(String(y??''),'pt');
    return dir*((Number(x)||0)-(Number(y)||0))});
}
/* botão flutuante de adicionar, no canto inferior direito (o espaço no fundo da página é acrescentado no render) */

  if(actions.length===1)return `<button class="fab" onclick="${actions[0].act}" title="${esc(actions[0].label||'')}">${ic('plus',26)}</button>`;
  return `<div class="fabmenu" id="fabMenu">${actions.map(a=>`<button class="btn primary" onclick="document.getElementById('fabMenu').classList.remove('on');${a.act}">${ic(a.icon||'plus',15)} ${esc(a.label)}</button>`).join('')}</div>
  <button class="fab" onclick="document.getElementById('fabMenu').classList.toggle('on')">${ic('plus',26)}</button>`;
}

function vProjections(){
  if(projProp&&!pidProps(projProp).length)projProp='';
  const s=db.settings,act=db.contracts.filter(c=>isActive(c)&&inScope(c.propertyId)&&(!projProp||pidProps(projProp).some(p=>p.id===c.propertyId)));
  const pps=pidProps(projProp);
  const head=anaPanel(`<div style="display:flex;flex-direction:column;gap:9px">
    ${db.owners.length?`<div style="width:100%">${sel('ownerSel',ownerFilter,[{v:'',label:'Todos os proprietários'}].concat(db.owners.map(o=>({v:o.id,label:o.name}))).concat(gdiv(gOpts('owner'))),'onOwnerFilter')}</div>`:''}
    <div style="width:100%">${sel('projSel',projProp,[{v:'',label:'Todos os imóveis'}].concat(scope().map(p=>({v:p.id,label:p.name}))).concat(gdiv(gOpts('prop'))),'onProjProp')}</div></div>
    <div class="row3" style="margin-top:10px">
    <label>Horizonte (anos)<input type="text" inputmode="numeric" value="${s.years}" onchange="setSet('years',Math.min(30,Math.max(1,num(this.value))))"></label>
    <label>Aumento anual (%)<input type="text" inputmode="decimal" value="${dec(s.growth)}" onchange="setSet('growth',num(this.value))"></label>
    <label>Inflação das despesas (%)<input type="text" inputmode="decimal" value="${dec(s.inflation)}" onchange="setSet('inflation',num(this.value))"></label></div>
    <div class="hint" style="margin-top:9px">Cada contrato tem o seu aumento. Em Portugal há um coeficiente máximo publicado todos os anos.</div>`);
  if(!act.length)return head+`<div class="empty" style="margin-top:14px"><b>Nenhum contrato ativo</b>As projeções partem das rendas contratadas.</div>`;
  const m=metrics(YEAR,projProp||null,{share:true}),n=Math.round(s.years),rows=[];
  /* prestações previstas: vêm do plano de cada hipoteca e param quando o crédito acaba */
  const sched=[...Array(n)].map((_,i)=>sum(pps.map(p=>sh(p)*sum(liveLoans(p).map(l=>{
    const a=amort(l),from=i*12,to=Math.min((i+1)*12,a.rows.length);
    let t=0;for(let k=from;k<to;k++)t+=a.rows[k].pay+(a.rows[k].st||0);
    return t;
  })))));
  for(let i=0;i<n;i++){
    const per=act.map(c=>c.rent*sh(prop(c.propertyId))*12*Math.pow(1+((c.increase==null?s.growth:c.increase)/100),i));
    const rent=sum(per),exp=m.op*Math.pow(1+s.inflation/100,i),ln=sched[i];
    rows.push({yr:YEAR+i,rent,exp,loan:ln,cf:rent-exp-ln,per});
  }
  const first=rows[0],last=rows[rows.length-1],labels=rows.map(r=>String(r.yr).slice(2));
  const debtY=[];for(let i=0;i<n;i++)debtY.push(sum(pps.map(p=>sh(p)*sum(liveLoans(p).map(l=>{
    const a=amort(l,(i+1)*12);return a.rows.length?a.rows[a.rows.length-1].bal:0})))));
  return head+(ownerFilter&&!ownerIsGrp()?`<div class="hint" style="margin-top:12px">Valores na quota-parte de <b>${esc(ownerFilterName())}</b>.</div>`:'')+`<div class="grid" style="margin-top:14px">
    ${kpi('Renda anual hoje',euro(first.rent),'','a preços de '+YEAR,WHY.rendaHoje,()=>({fmt:euro,yearlyTitle:'Projeção ano a ano',yearly:rows.map(r=>({label:r.yr,value:r.rent}))}))}
    ${kpi('Renda em '+last.yr,euro(last.rent),'pos','+'+pct(first.rent?last.rent/first.rent-1:0)+' acumulado',WHY.rendaFim,()=>({fmt:euro,yearlyTitle:'Projeção ano a ano',yearly:rows.map(r=>({label:r.yr,value:r.rent}))}))}
    ${kpi('Total do período',euro(sum(rows.map(r=>r.rent))),'',n+' anos de rendas',WHY.totalPeriodo,()=>{let a=0;return {fmt:euro,yearlyTitle:'Acumulado ano a ano',yearly:rows.map(r=>({label:r.yr,value:a+=r.rent}))}})}
    ${kpi('Cashflow em '+last.yr,euro(last.cf),last.cf>=0?'pos':'neg','com despesas e prestações',WHY.cashflowFim,()=>({fmt:euro,yearlyTitle:'Projeção ano a ano',extraTitle:'Prestações',yearly:rows.map(r=>({label:r.yr,value:r.cf,extra:euro(r.loan)}))}))}</div>
  <div class="cols">
    ${card('Rendas, prestações e cashflow','',cLine([{name:'Rendas',values:rows.map(r=>r.rent),color:PAL[0]},
      {name:'Prestações',values:rows.map(r=>r.loan),color:'#d6a34a'},
      {name:'Cashflow',values:rows.map(r=>r.cf),color:PAL[1]}],labels,{h:210,marks:decadeMarks(YEAR,n)}))}
    ${card('Dívida por amortizar','Somando os créditos em uso',cLine([{name:'Em dívida',values:debtY,color:'#d6a34a'}],labels,{h:200,marks:decadeMarks(YEAR,n)}))}</div>
  <div style="margin-top:14px">${card('Detalhe ano a ano','Uma coluna por contrato ativo',`<div class="tablewrap"><table class="table"><thead><tr>
    <th>Ano</th>${act.map(c=>`<th>${esc(ctName(c))}</th>`).join('')}<th>Rendas</th><th>Despesas</th><th>Prestações</th><th>Cashflow</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${r.yr}</b></td>${r.per.map(v=>`<td>${euro(v)}</td>`).join('')}
      <td><b>${euro(r.rent)}</b></td><td class="neg">${euro(r.exp)}</td><td class="amber">${euro(r.loan)}</td>
      <td class="${r.cf>=0?'pos':'neg'}"><b>${euro(r.cf)}</b></td></tr>`).join('')}</tbody></table></div>`)}</div>`;
}

let _pd=null;
function photoDrag(e,h,idx){
  e.preventDefault();e.stopPropagation();
  const row=h.closest('.prow');if(!row)return;
  const list=row.parentNode,rows=[...list.querySelectorAll('.prow')];
  idx=rows.indexOf(row);
  const step=(rows.length>1&&rows[1].offsetTop-rows[0].offsetTop)||row.offsetHeight+8||60;
  _pd={idx,to:idx,row,rows,step,y0:e.clientY};
  row.classList.add('drag');
  try{h.setPointerCapture(e.pointerId)}catch(x){}
  /* com o ponteiro capturado, tudo chega ao próprio puxador */
  h.onpointermove=photoDragMove;
  const done=()=>{h.onpointermove=h.onpointerup=h.onpointercancel=null;
    document.removeEventListener('pointermove',photoDragMove);document.removeEventListener('pointerup',done);document.removeEventListener('pointercancel',done);
    photoDragEnd()};
  h.onpointerup=h.onpointercancel=done;
  /* rede de segurança para ambientes onde a captura não redirige os eventos */
  document.addEventListener('pointermove',photoDragMove);
  document.addEventListener('pointerup',done);
  document.addEventListener('pointercancel',done);
}
function photoDragMove(e){
  if(!_pd)return;
  e.preventDefault();
  const dy=e.clientY-_pd.y0;
  _pd.row.style.transform=`translateY(${dy}px)`;
  const to=Math.max(0,Math.min(_pd.rows.length-1,_pd.idx+Math.round(dy/_pd.step)));
  if(to!==_pd.to){_pd.to=to;
    _pd.rows.forEach((r,i)=>{if(r===_pd.row)return;
      let sh=0;
      if(_pd.idx<to&&i>_pd.idx&&i<=to)sh=-_pd.step;
      else if(_pd.idx>to&&i>=to&&i<_pd.idx)sh=_pd.step;
      r.style.transform=sh?`translateY(${sh}px)`:'';});
  }
}
function photoDragEnd(){
  if(!_pd)return;
  const {idx,to,row,rows}=_pd;
  rows.forEach(r=>{r.style.transform='';r.classList.remove('drag')});
  _pd=null;
  if(to===idx)return;
  collectProp();
  const a=pForm.photos,x=a.splice(idx,1)[0];a.splice(to,0,x);
  /* move só a linha no DOM: repintar tudo recarregava as miniaturas e demorava */
  const list=row.parentNode,ref=rows[to];
  if(to>idx)list.insertBefore(row,ref.nextSibling);else list.insertBefore(row,ref);
  list.querySelectorAll('.capa').forEach(x2=>x2.remove());
  const first=list.querySelector('.prow .pth');
  if(first)first.insertAdjacentHTML('afterbegin','<span class="capa">capa</span>');
}

let cForm={};
function ctModal(id,pid){
  foldState={};

  if(!id&&!rentables.length)return toast('Nenhum imóvel de arrendamento. Muda o uso na ficha do imóvel para criar contratos.');
  cForm=normContract(id?JSON.parse(JSON.stringify(contract(id))):{propertyId:(pid&&(prop(pid)||{}).use==='investimento'?pid:rentables[0].id),start:today()});
  if(!id)fillOwnerContact();

    isActive(cForm)?{label:'Terminar contrato',icon:'x',act:`endContract('${id}')`}:{label:'Reativar contrato',icon:'check',act:`reactivateContract('${id}')`},
    {label:'Apagar contrato',icon:'trash',danger:true,act:`delContract('${id}')`}]):'';

function ctSaver(){
  return ()=>{

    if(!cForm.tenantIds.length)return toast('Escolhe pelo menos um inquilino.');

    save();closeModal();buildNav();render();toast('Contrato guardado.');
  };

function netBox(){

    <div class="stat"><span>Imposto (${dec(tx)}%)</span><b class="neg">−${euro2(imposto)}</b></div>
    <div class="stat" style="border:0"><span>Renda líquida</span><b class="pos" style="font-size:16px">${euro2(r-imposto)}</b></div>
    <div class="hint">${euro(( r-imposto)*12)} por ano, se a renda se mantiver.</div>`;

function collectCt(){
  const c=cForm;
  if(document.getElementById('c_prop'))c.propertyId=val('c_prop')||null;
  if(document.getElementById('c_autorec'))c.autoRec=chk('c_autorec');
  c.roomId=document.getElementById('c_room')?(val('c_room')||null):null;
  c.name=val('c_name');c.rent=num(val('c_rent'));c.taxRate=num(val('c_tax'));c.iban=val('c_iban');
  if(document.getElementById('c_omail'))c.ownerEmail=val('c_omail');
  if(document.getElementById('c_ophone'))c.ownerPhone=val('c_ophone');
  if(document.getElementById('c_tmail'))c.tenantEmail=val('c_tmail');
  if(document.getElementById('c_tphone'))c.tenantPhone=val('c_tphone');
  c.deposit=num(val('c_dep'));c.start=val('c_start');c.end=val('c_end');
  c.payDay=Math.max(0,Math.min(31,Math.round(num(val('c_day')))))||null;
  c.payDayTo=Math.max(0,Math.min(31,Math.round(num(val('c_dayTo')))))||null;
  c.advance=Math.max(0,Math.min(36,Math.round(num(val('c_adv')))))||0;
  if(c.payDay&&c.payDayTo&&c.payDayTo<c.payDay)c.payDayTo=c.payDay;
  const i=val('c_inc');c.increase=String(i).trim()===''?null:num(i);
  if(document.getElementById('c_notes'))c.notes=richVal('c_notes');c.active=chk('c_active');
  (c.inventory||[]).forEach(it=>{
    const n=document.getElementById('invn_'+it.id);if(n)it.name=n.value;
    const q=document.getElementById('invq_'+it.id);if(q)it.qty=Math.max(1,Math.round(num(q.value))||1);
    const s=document.getElementById('invs_'+it.id);if(s)it.state=s.value;
  });
  (c.files||[]).forEach(f=>{const e=document.getElementById('fn_'+f.id);if(e)f.name=e.value});
  (c.keys||[]).forEach(k=>{
    const nEl=document.getElementById('keyn_'+k.id);if(nEl)k.name=nEl.value;
    const q=document.getElementById('keyq_'+k.id);if(q)k.qty=Math.max(1,Math.round(num(q.value))||1);
  });
  if(document.getElementById('c_ocid'))c.ownerContactId=val('c_ocid')||'';
  if(document.getElementById('c_tcid'))c.tenantContactId=val('c_tcid')||'';
}
