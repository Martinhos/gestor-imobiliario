     "light" é dizer ao motor que não há tema escuro, e há motores (WebKit, e
     o WebView do Android) que respondem a isso com prefers-color-scheme:light
     mesmo com o aparelho em escuro — o modo automático ficava preso no claro.
     O applyTheme() estreita isto para um dos dois assim que decide. -->

<script>
/* Armadilha de erros, antes de tudo o resto.
   O relato normal vive em cloud/ajuda.js, que carrega depois de dezenas: se
   um módulo anterior rebentar, a app fica em branco e nunca ninguém sabe
   porquê. Isto apanha esses — guarda-os para o relato normal os levar, e se
   ele não chegar a existir em três segundos, envia-os por si. Se a rede de
   segurança do arranque (mais abaixo) curar a app antes disso, é ela que os
   leva, antes de recarregar (levarAntesDeRecarregar). */
(function () {
  var vistos = {}, fila = [];
  window.__erros = fila;
  function apanha(msg, detalhe) {
    var chave = String(msg).slice(0, 120);
    if (vistos[chave] || fila.length >= 8) return;
    vistos[chave] = 1;
    fila.push({
      message: String(msg).slice(0, 500),
      detail: String(detalhe || '').slice(0, 800),
      // o avisos.js pode nem ter chegado a carregar: daí o typeof
      versao: typeof VERSAO !== 'undefined' ? VERSAO : null,
      ecra: 'arranque',
      agente: String(navigator.userAgent || '').slice(0, 180),
    });
  }
  window.addEventListener('error', function (e) {
    apanha(e.message, (e.filename || '') + ':' + (e.lineno || '') + ' · arranque\n' +
      String((e.error && e.error.stack) || '').slice(0, 500));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    apanha('Promessa rejeitada: ' + ((r && r.message) || r),
      String((r && r.stack) || '').slice(0, 500) + ' · arranque');
  });
  setTimeout(function () {
    if (window.__errosLevados || !fila.length) return;
    window.__errosLevados = 1;
    fila.splice(0).forEach(function (r) {
      r.detail = (r.detail || '') + '\n\n(a app não chegou a arrancar)';
      try {
        fetch('/api/reports', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r),
        }).catch(function () {});
      } catch (e) {}
    });
  }, 3000);
})();
</script>

<!-- Rede de segurança do arranque.

     Em produção a v31 apareceu com ReferenceError em cadeia — LS_SESSAO, CW,
     ic, go, idbPut — e a app não arrancava. A causa era o service worker a
     misturar versões a meio do carregamento (web/sw.js, corrigido), mas a
     lição fica: um arranque que falha assim é UM ECRÃ EM BRANCO, e o código
     que sabe atualizar a app (cloud/novidades.js:verificarVersao) é
     precisamente o que não chegou a carregar. Ninguém se cura sozinho.

     Por isso isto vive aqui, inline e antes de tudo, sem depender de ficheiro
     nenhum: se um script do arranque falhar a carregar ou rebentar com um
     símbolo que devia existir, limpa-se o que está guardado, larga-se o
     service worker e recarrega-se. Uma vez de dez em dez minutos — uma recarga
     que não resolve não se repete a seguir, senão é um ciclo; mas também não
     pode desarmar-se para sempre, que é o que acontecia.

     E nunca sem rede: o que está guardado é a única cópia da app que existe, e
     apagá-la offline troca «meia app partida» por «nenhuma app». -->
<script>
(function () {
  var CHAVE = 'gi_arranque_curado';
  var aCurar = false;
  var PARTIU = /is not defined|Cannot (?:set|read) propert(?:y|ies) of undefined/;

  /* O que fez disparar a cura sai daqui, e ANTES da recarga. A armadilha do
     topo só manda o que apanhou ao fim de três segundos, e a cura recarrega
     muito antes: a recarga matava o temporizador, a fila nascia vazia na
     página seguinte, e a primeira avaria de cada aparelho — precisamente a
     que se quer ver no back office — nunca chegava. O motivo ficava guardado
     no sessionStorage, onde ninguém o lia. O keepalive é o que deixa o pedido
     acabar depois de a página se ir.
     Leva a fila da armadilha, se ainda for dela (o cloud/ajuda.js, se chegou a
     carregar, já a levou e marcou o __errosLevados), e o próprio motivo quando
     ele não vai na fila: o erro de um <script> que não carrega é do elemento,
     não sobe, e a armadilha nunca o vê. */
  function levarAntesDeRecarregar(porque) {
    var relatos = [];
    if (!window.__errosLevados && window.__erros) relatos = window.__erros.splice(0);
    window.__errosLevados = 1;
    var nota = '\n\n(arranque curado: a app limpou a cache, largou o service worker e recarregou)';
    relatos.forEach(function (r) { r.detail = (r.detail || '') + nota; });
    var vai = relatos.some(function (r) { return r.message === String(porque).slice(0, 500); });
    if (!vai) relatos.push({
      message: ('Arranque curado — ' + porque).slice(0, 500),
      detail: 'Apanhado pela rede de segurança do arranque (index.html).' + nota,
      versao: typeof VERSAO !== 'undefined' ? VERSAO : null,
      ecra: 'arranque',
      agente: String(navigator.userAgent || '').slice(0, 180),
    });
    relatos.forEach(function (r) {
      try {
        fetch('/api/reports', {
          method: 'POST', credentials: 'same-origin', keepalive: true,
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r),
        }).catch(function () {});
      } catch (e) {}
    });
  }

  function curar(porque) {
    if (aCurar || document.readyState === 'complete') return;
    /* Sem rede não se cura: o que está guardado é a ÚNICA cópia da app que
       existe, e apagá-la troca «meia app partida» por «nenhuma app», sem
       volta enquanto a rede não voltar. Sai-se sem marcar nada — a cura fica
       disponível para quando houver rede. Só o === false é de confiança: o
       navigator.onLine a true mente com frequência, e é por isso que ele
       trava mas não autoriza. */
    if (navigator.onLine === false) return;
    /* Quando se curou, e não só que se curou. Isto guardava um motivo e nunca
       mais o largava, e numa app instalada a «sessão» não é uma visita: o
       sessionStorage sobrevive a recargas e a janela pode ficar aberta
       semanas. Uma cura gasta numa segunda-feira desarmava a rede de
       segurança para o resto da vida daquele separador. */
    try {
      var antes = Number(sessionStorage.getItem(CHAVE));
      if (antes && Date.now() - antes < 6e5) return;   // dez minutos
    } catch (e) {}
    aCurar = true;
    try { sessionStorage.setItem(CHAVE, String(Date.now())); } catch (e) {}
    levarAntesDeRecarregar(porque);
    var passos = [];
    try { if (window.caches && caches.keys) passos.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    })); } catch (e) {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        passos.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
    } catch (e) {}
    var recarrega = function () { try { location.reload(); } catch (e) {} };
    Promise.all(passos.map(function (p) { return p.catch(function () {}); })).then(recarrega, recarrega);
    setTimeout(recarrega, 4000);   // se alguma das promessas ficar pendurada
  }

  // um <script> que não chega a carregar: o erro é do elemento e não sobe,
  // por isso ouve-se na descida
  window.addEventListener('error', function (e) {
    var alvo = e && e.target;
    if (alvo && alvo !== window && alvo.tagName === 'SCRIPT') curar('script: ' + (alvo.src || ''));
  }, true);

  // e um que carrega mas rebenta por lhe faltar o que outro ficheiro devia ter
  window.addEventListener('error', function (e) {
    if (e && e.message && PARTIU.test(String(e.message))) curar(String(e.message));
  });
})();
</script>
