/* ================= MODELOS E RECORRÊNCIAS ================= */
const EVERY={once:'uma só vez',week:'semanal',month:'mensal',quarter:'trimestral',year:'anual'};
function nextDate(iso,every){
  const d=new Date((iso||today())+'T00:00:00');if(isNaN(d))return today();
  if(every==='week'){d.setDate(d.getDate()+7)}
  else{const day=d.getDate(),m=every==='year'?12:every==='quarter'?3:1;d.setDate(1);d.setMonth(d.getMonth()+m);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
/* a renda de cada contrato ativo vive como movimento recorrente, criado e mantido pela app */
function ctRecOf(c){return (db.recurring||[]).find(r=>r.auto&&r.tx&&r.tx.contractId===c.id)}
function dayInMonth(y,m,d){const last=new Date(y,m+1,0).getDate();return `${y}-${String(m+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
function syncContractRec(c){
  const r=ctRecOf(c),want=isActive(c)&&c.rent>0&&c.autoRec!==false;
  if(!want){if(r)db.recurring=db.recurring.filter(x=>x.id!==r.id);return}
  const from=Math.max(1,Math.min(31,c.payDay||1)),to=Math.max(from,Math.min(31,c.payDayTo||from));
  const inc=catsIn(),cat='Rendas' in inc?'Rendas':'',sub=cat&&(inc[cat]||[]).indexOf('Renda mensal')>-1?'Renda mensal':'';
  const tx={kind:'income',label:'Renda '+ctName(c),amount:c.rent,propertyId:c.propertyId,contractId:c.id,category:cat,sub,split:null};
  /* rendas antecipadas: a primeira ocorrência só aparece depois desses meses */
  let minNext='';
  if(c.start&&c.advance>0){const d=new Date(c.start+'T00:00:00');let y2=d.getFullYear(),m2=d.getMonth()+c.advance;y2+=Math.floor(m2/12);m2%=12;minNext=dayInMonth(y2,m2,from)}
  if(r){Object.assign(r.tx,tx);r.name='Renda '+ctName(c);r.end=c.end||'';
    /* se os dias da janela mudarem no contrato, a janela acompanha (mantendo o mês em curso) */
    if(r.next){const d=new Date(r.next+'T00:00:00');r.next=dayInMonth(d.getFullYear(),d.getMonth(),from);r.until=to>from?dayInMonth(d.getFullYear(),d.getMonth(),to):''}
    if(minNext&&r.next<minNext){const d=new Date(minNext+'T00:00:00');r.next=minNext;r.until=to>from?dayInMonth(d.getFullYear(),d.getMonth(),to):''}
    return}
  /* primeira janela: este mês se ainda não passou; senão o mês que vem; nunca antes do início do contrato */
  const t=new Date(today()+'T00:00:00');let y=t.getFullYear(),m=t.getMonth();
  if(today()>dayInMonth(y,m,to)){m++;if(m>11){m=0;y++}}
  let next=dayInMonth(y,m,from),until=to>from?dayInMonth(y,m,to):'';
  if(c.start&&next<c.start){const d=new Date(c.start+'T00:00:00');let y2=d.getFullYear(),m2=d.getMonth();
    if(c.start>dayInMonth(y2,m2,to)){m2++;if(m2>11){m2=0;y2++}}
    next=dayInMonth(y2,m2,from);until=to>from?dayInMonth(y2,m2,to):'';}
  if(minNext&&next<minNext){const d=new Date(minNext+'T00:00:00');next=minNext;until=to>from?dayInMonth(d.getFullYear(),d.getMonth(),to):''}
  db.recurring=db.recurring||[];
  db.recurring.push(normRec({auto:true,name:'Renda '+ctName(c),every:'month',next,until,end:c.end||'',tx}));
}
function syncAllContractRecs(){
  (db.recurring||[]).slice().forEach(r=>{if(r.auto&&!(r.tx||{}).loanId&&(!r.tx.contractId||!db.contracts.some(c=>c.id===r.tx.contractId)))db.recurring=db.recurring.filter(x=>x.id!==r.id)});
  db.contracts.forEach(syncContractRec);
}
/* ---- prestações das hipotecas: recorrência automática, tal como as rendas dos contratos ---- */
function loanRecOf(l){return (db.recurring||[]).find(r=>r.auto&&r.tx&&r.tx.loanId===l.id)}
function syncLoanRec(p,l){
  const r=loanRecOf(l);
  /* se o utilizador já tem uma recorrência manual para esta hipoteca, não se duplica */
  const manual=(db.recurring||[]).some(x=>!x.auto&&x.tx&&x.tx.loanId===l.id);
  const want=l.outstanding>0&&l.autoRec!==false&&!manual;
  if(!want){if(r)db.recurring=db.recurring.filter(x=>x.id!==r.id);return}
  const day=(()=>{const d=l.start?Number(l.start.slice(8,10)):0;return Math.max(1,Math.min(28,d||1))})();
  const name='Prestação '+(l.name?l.name+' · ':'')+p.name;
  const out=cats(),cat='Crédito à habitação' in out?'Crédito à habitação':'',sub=cat&&(out[cat]||[]).indexOf('Prestação mensal')>-1?'Prestação mensal':'';
  const tx={kind:'loan',payType:'prestacao',label:name,amount:Math.round(loanCalc(l).total*100)/100,propertyId:p.id,loanId:l.id,category:cat,sub,split:null};
  if(r){Object.assign(r.tx,tx);r.name=name;
    if(r.next){const d=new Date(r.next+'T00:00:00');r.next=dayInMonth(d.getFullYear(),d.getMonth(),day)}
    return}
  const t=new Date(today()+'T00:00:00');let y=t.getFullYear(),m=t.getMonth();
  if(today()>dayInMonth(y,m,day)){m++;if(m>11){m=0;y++}}
  db.recurring=db.recurring||[];
  db.recurring.push(normRec({auto:true,name,every:'month',next:dayInMonth(y,m,day),tx}));
}
function syncAllLoanRecs(){
  const live=id=>db.properties.some(p=>(p.loans||[]).some(l=>l.id===id));
  (db.recurring||[]).slice().forEach(r=>{if(r.auto&&(r.tx||{}).loanId&&!live(r.tx.loanId))db.recurring=db.recurring.filter(x=>x.id!==r.id)});
  db.properties.forEach(p=>(p.loans||[]).forEach(l=>syncLoanRec(p,l)));
}
/* recorrências vencidas (a data prevista já passou ou é hoje) */
function recPending(){const t=today();return (db.recurring||[]).filter(r=>r.next&&r.next<=t)}
/* silenciada: continua por confirmar em Planeados, mas não avisa nem conta no menu */
function recActive(){return recPending().filter(r=>!r.muted)}
/* em atraso: passou o último dia da janela sem confirmação */
const recIsLate=r=>!!(r.next&&r.next<=today()&&(r.until||r.next)<today());
function recLate(){return recActive().filter(recIsLate)}
function recAdvance(r){
  r.muted=false;
  if(r.every==='once'){db.recurring=db.recurring.filter(x=>x.id!==r.id);return}
  const gap=r.until&&r.until>r.next?Math.round((new Date(r.until+'T00:00:00')-new Date(r.next+'T00:00:00'))/864e5):0;
  r.next=nextDate(r.next,r.every);r.until=gap?addDays(r.next,gap):'';
  if(r.end&&r.next>r.end){db.recurring=db.recurring.filter(x=>x.id!==r.id);toast('“'+r.name+'” chegou ao fim: deixa de se repetir.')}
}
function recTx(r,date){return normTx(Object.assign({},JSON.parse(JSON.stringify(r.tx)),{date:date||r.next,label:r.tx.label||r.name}))}
/* confirmar sem abrir: cria o movimento na data prevista e passa à seguinte */
function quickConfirmRec(id){
  const r=(db.recurring||[]).find(x=>x.id===id);if(!r)return;
  const t=recTx(r);if(t.kind==='loan')applyLoan(t);
  db.transactions.push(t);recAdvance(r);save();buildNav();render();toast('Movimento confirmado.');
}
function skipRec(id){const r=(db.recurring||[]).find(x=>x.id===id);if(!r)return;r.muted=!r.muted;save();buildNav();render();toast(r.muted?'Silenciada: fica em Planeados à espera de confirmação, sem avisos.':'Volta a avisar.')}

/* cartão dos movimentos em atraso / por confirmar */
function pendingCard(all){
  const pend=all?recPending():recActive();
  if(!pend.length)return '';
  const row=(r)=>{const late=recIsLate(r);return `<div class="card tap pend ${late?'late':''}" style="padding:11px 13px" onclick="confirmRec('${r.id}')">
    <div class="row-between" style="align-items:center">
      <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</b>
        <span class="small">${esc(r.next)}${r.until&&r.until!==r.next?' – '+esc(r.until):''}${r.muted?' · silenciada':late?' · <b class="neg">em atraso</b>':' · por confirmar'} · ${(KIND[r.tx.kind]||{}).short}${r.tx.propertyId?' · '+esc(propName(r.tx.propertyId)):''}</span></div>
      <b style="flex:0 0 auto">${r.tx.amount?euro2(r.tx.amount):''}</b></div>
    <div class="toolbar" style="margin:9px 0 0">
        <button class="btn sm primary" onclick="${stop}quickConfirmRec('${r.id}')">${ic('check',14)} Confirmar</button>
        <button class="btn sm" onclick="${stop}skipRec('${r.id}')">${r.muted?'Reativar':'Silenciar'}</button>
        <span class="small" style="margin-left:auto">${EVERY[r.every]||''}</span></div></div>`};
  const nl=pend.filter(recIsLate).length;
  return `<div class="card" style="margin-bottom:14px">
    <div class="row-between"><div><div class="title">Movimentos por confirmar</div>
      <div class="small">${pend.length} à espera${nl?' · <b class="neg">'+nl+' em atraso</b>':''}</div></div>${ic('swap',22)}</div>
    <div class="list" style="gap:8px;margin-top:12px">${pend.map(row).join('')}</div>
    <div class="hint" style="margin-top:9px">Confirmar regista o movimento e agenda o seguinte. Silenciar deixa-o à espera, sem avisos.</div></div>`;
}
/* página das recorrências e modelos */
function vRecurring(){
  const K='lrec',s=lf(K);
  const hit=(name,tx)=>lfHit(K,[name,tx.label,tx.category,tx.sub,tx.creditor,propName(tx.propertyId),String(tx.amount||''),(tx.tags||[]).join(' '),tx.notes].join(' '));
  const base=r=>((!s.k||r.tx.kind===s.k)&&(!s.p||r.tx.propertyId===s.p)&&hit(r.name,r.tx));
  const rc=(db.recurring||[]).filter(r=>{
    if(!base(r))return false;
    if(s.st==='pend'&&!(r.next&&r.next<=today()&&!r.muted))return false;
    if(s.st==='ok'&&!(r.next&&r.next>today()))return false;
    if(s.st==='muted'&&!r.muted)return false;
    if(s.st==='auto'&&!r.auto)return false;
    if(s.st==='manual'&&r.auto)return false;
    return true;
  }).sort((a,b)=>String(a.next).localeCompare(String(b.next)));
  const rcS=lfSort(K,rc,{nome:r=>r.name,valor:r=>r.tx.amount||0,data:r=>r.next||''});
  const tp=lfSort(K,(db.templates||[]).filter(x=>(!s.k||x.tx.kind===s.k)&&(!s.p||x.tx.propertyId===s.p)&&(!s.st||s.st==='manual')&&hit(x.name,x.tx)),
    {nome:x=>x.name,valor:x=>x.tx.amount||0,data:()=>0});
  const kinds=[{v:'',label:'Todos os tipos'},{v:'income',label:'Receitas'},{v:'expense',label:'Despesas'},{v:'loan',label:'Pagamentos de crédito'},{v:'owed',label:'Dívidas recebidas'},{v:'repay',label:'Pagamentos de dívida'}];
  const head=lfBar(K,[lfSel(K,'k',kinds),lfSel(K,'p',lfPropOpts()),
      lfSel(K,'st',[{v:'',label:'Todos os estados'},{v:'pend',label:'Por confirmar'},{v:'ok',label:'Em dia'},{v:'muted',label:'Silenciados'},{v:'auto',label:'Automáticos (contratos e hipotecas)'},{v:'manual',label:'Criados à mão'}])],
      rc.length+tp.length,
      {defLabel:'Ordenar pela próxima data',opts:[{v:'data',label:'Ordenar por data'},{v:'valor',label:'Ordenar por valor'},{v:'nome',label:'Ordenar por nome'}]})
    +fab([{label:'Novo mov. recorrente',icon:'clock',act:'newRec()'},{label:'Novo modelo',icon:'file',act:'newTpl()'}]);
  const recs=rcS.length?`<div class="list" style="gap:8px">${rcS.map(r=>{const late=recIsLate(r),pend=r.next<=today();return `<div class="card tap ${pend?'pend':''} ${late?'late':''}" data-lp="rec:${esc(r.id)}" onclick="editRec('${jsq(r.id)}')">
      <div class="row-between" style="align-items:center">
        <div style="min-width:0"><div class="title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</div>
          <div class="small">${r.auto?'<span class="badge grey" style="margin-right:4px">'+((r.tx||{}).loanId?'da hipoteca':'do contrato')+'</span>':''}${esc(EVERY[r.every]||r.every)} · ${esc(r.next)}${r.until&&r.until!==r.next?' – '+esc(r.until):''} · ${pend?(r.muted?'silenciada · por confirmar':late?'<b class="neg">em atraso</b>':'<b class="amber">por confirmar</b>'):'em dia'}${r.end?' · termina '+esc(r.end):''}</div>

let tForm={};

function txModal(id,kind,propId,_x,ctId,preset){
  foldState={};

  openModal((id?'Editar ':txNewWord(tForm.kind))+txTypeName(tForm.kind),txBody(),null,m);
  tForm._saver=()=>{
    collectTx();
    if(!tForm.label.trim())return toast('Escreve uma descrição.');
    if(!(tForm.amount>0))return toast('Indica um montante.');
    if(tForm.kind==='settle'){
      if(!tForm.propertyId)return toast('Um acerto é sempre de um imóvel.');
      if(!tForm.paidBy||!tForm.toId)return toast('Indica quem paga e quem recebe.');
      if(tForm.paidBy===tForm.toId)return toast('Quem paga e quem recebe têm de ser pessoas diferentes.');
    }

    const pe=psplitError();if(pe)return toast(pe);
    if(tForm.kind==='loan'&&tForm.loanId&&tForm.principal!=null){
      const lV=findLoan(prop(tForm.propertyId),tForm.loanId);
      if(tForm.payType!=='amortizacao'){
        if(Number(tForm.interest)<0||Number(tForm.stamp)<0||Number(tForm.principal)<0)return toast('Juros e selo ultrapassam o montante: baixa os juros na tabela da distribuição.');
        const s=r2(Number(tForm.interest||0)+Number(tForm.stamp||0)+Number(tForm.principal||0));
        if(Math.abs(s-tForm.amount)>0.011)return toast('Juros, selo e capital têm de somar o montante ('+euro2(tForm.amount)+').');
      }
      if(lV){const av=loanAvail(tForm,lV);
        if(Number(tForm.principal)>av+0.011)return toast('Só faltam '+euro2(av)+' pagar nesta hipoteca — não podes amortizar mais do que isso.');
        if(!tForm._edit&&!(Number(lV.outstanding)>0))return toast('Esta hipoteca já está paga: não é possível associar novos pagamentos.');}
    }

      const every=val('t_every')||'month',recEnd=val('t_recEnd')||'';let until=val('t_until')||'';if(until&&until<tForm.date)until='';
      if(tForm._recNew){db.recurring=db.recurring||[];db.recurring.push(normRec({name:tForm.label,every,next:tForm.date,until,end:recEnd,tx:txSnapshot(tForm)}))}
      else{const r=(db.recurring||[]).find(x=>x.id===tForm._recId);if(r){r.tx=txSnapshot(tForm);r.name=tForm.label;r.every=every;r.next=tForm.date;r.until=until;r.end=recEnd}}
      save();closeModal();buildNav();render();toast(tForm._recNew?'Movimento recorrente criado.':'Movimento recorrente atualizado.');return;
    }
    if(tForm._tplId||tForm._tplNew){

      else{const x=(db.templates||[]).find(y=>y.id===tForm._tplId);if(x){x.name=name;x.tx=txSnapshot(tForm)}}
      if(also){const tx=normTx(txSnapshot(tForm));tx.date=tForm.date||today();if(tx.kind==='loan')applyLoan(tx);db.transactions.push(tx)}
      save();closeModal();buildNav();render();toast(tForm._tplNew?(also?'Modelo criado e movimento registado.':'Modelo criado.'):'Modelo atualizado.');return;
    }

       depois aplica-se a distribuição atual (criação ou edição) */
    if(id){

      if(old&&old.kind==='loan'&&old.principal){
        const l0=findLoan(prop(old.propertyId),old.loanId);
        if(l0)l0.outstanding=Math.round((l0.outstanding+old.principal)*100)/100;
      }

  };

function splitHint(ows){
  const t=tForm,p=prop(t.propertyId);if(!p)return '';

  const intro=(t.paidBy?'':'Só entra nas contas entre proprietários se indicares quem pagou ou recebeu. ')+((SPLIT_MODES.find(m=>m[0]===mode)||[])[2]||'')+'.';

    if(Math.abs(d)>0.005)warn=`<b class="neg">${d>0?'Faltam '+euro2(d):'Passa '+euro2(-d)}</b> · `}
  if(mode==='percent'){const s2=sum(os.map(o=>Number(((t.split||{}).parts||{})[o])||0));

function splitError(){

  const os=ownersOfProp(p),parts=(t.split||{}).parts||{},total=Math.abs(Number(t.amount)||0);

function loanHint(){
  const t=tForm,p=prop(t.propertyId),l=t.loanId?findLoan(p,t.loanId):null;
  if(t.kind!=='loan')return'';
  if(!l)return `<div class="hint">Nenhuma hipoteca associada. Podes registar o pagamento na mesma, ou criar a hipoteca em Finanças → Créditos.</div>`;
  const avail=loanAvail(t,l);
  const c=loanCalc(Object.assign({},l,{outstanding:avail},t._edit?{_paidOfs:-1}:{})),rate=l.stampTax===false?0:stampPct();
  const fr=amortFeeRate(l,t.date),amort=t.payType==='amortizacao';
  const amt=num(t.amount)||(amort?0:c.total);
  const seg=`<div style="margin-bottom:10px"><div class="flabel">Tipo de pagamento</div>
    <div class="seg c2">
      <button type="button" class="opt ${!amort?'on':''}" onclick="setPayType('prestacao')"><span class="ic">${ic('bank',18)}</span><b>Prestação</b><small>juros, selo e capital</small></button>
      <button type="button" class="opt ${amort?'on':''}" onclick="setPayType('amortizacao')"><span class="ic">${ic('trend',18)}</span><b>Amortização</b><small>capital e comissão</small></button></div></div>`;
  if(amort){
    /* amortização antecipada: sem juros nem selo — só capital e a comissão definida na hipoteca */
    const cap=r2(amt/(1+fr)),fee=r2(amt-cap);
    t.interest=0;t.stamp=0;t.principal=cap;t.fee=fee;
    return seg+`<div class="card" style="background:var(--tint);padding:13px">
      <div class="stat" style="padding-top:0;align-items:center"><span>Abate ao capital</span><b class="pos" id="lh_cap">${euro2(cap)}</b></div>
      <div class="stat" style="border:0;align-items:center"><span>Comissão de amortização (${dec(r2(fr*100))}%)</span><b class="neg" id="lh_fee">${euro2(fee)}</b></div>
      <div class="hint" id="loanLeft">${cap>avail+0.011?`<b class="neg">Só faltam ${euro2(avail)} pagar — não podes amortizar mais do que isso.</b>`:`Ficam ${euro(Math.max(0,avail-Math.min(cap,avail)))} em dívida.`}</div></div>`;
  }
  /* prestação normal: juros editáveis, selo derivado, capital é o resto — sem comissão */

    <div class="stat" style="align-items:center"><span>Juros (€)</span>
      <input class="statin" id="t_int" type="text" inputmode="decimal" value="${dec(int.toFixed(2))}" oninput="onLoanSplit('int')"></div>
    <div class="stat" style="align-items:center"><span>Imposto do selo (${dec(db.settings.stampPct??4)}%)</span><b id="lh_stamp">${euro2(st)}</b></div>

      <input class="statin pos" id="t_cap" type="text" inputmode="decimal" value="${dec(Math.max(0,cap).toFixed(2))}" oninput="onLoanSplit('cap')"></div>
    <div class="hint" id="loanLeft">${loanLeftTxt(l,int,st,cap,0,amt,avail)}</div></div>`;

function loanLeftTxt(l,int,st,cap,fee,amt,avail){

function applyLoan(t){
  const p=prop(t.propertyId),l=t.loanId?findLoan(p,t.loanId):null;if(!l)return;
  /* amortização: capital + comissão da hipoteca; prestação: juros + selo + capital (sem comissão) */
  let int=Number(t.interest),st=Number(t.stamp),cap=Number(t.principal),fee=Number(t.fee||0);
  if(t.payType==='amortizacao'){
    const fr=amortFeeRate(l,t.date);
    if(!(isFinite(cap)&&isFinite(fee)&&cap>=0&&fee>=0&&Math.abs(cap+fee-t.amount)<=0.011)){cap=r2(t.amount/(1+fr));fee=r2(t.amount-cap)}
    int=0;st=0;
  }else if(!(isFinite(int)&&isFinite(st)&&isFinite(cap)&&int>=0&&st>=0&&cap>=0&&Math.abs(int+st+cap+(fee>0?fee:0)-t.amount)<=0.011)){
    const c=loanCalc(l);int=c.interest;st=c.stamp;fee=0;cap=Math.max(0,t.amount-int-st);
  }
  cap=Math.max(0,Math.min(l.outstanding,cap));
  t.interest=r2(int);t.stamp=r2(st);t.principal=r2(cap);t.fee=r2(fee);
  l.outstanding=Math.max(0,r2(l.outstanding-cap));
  /* recorrência automática desta hipoteca: acompanha a nova prestação e desaparece quando o crédito acaba */
  const ar=loanRecOf(l);
  if(ar){if(!(l.outstanding>0))db.recurring=db.recurring.filter(x=>x.id!==ar.id);
    else ar.tx.amount=Math.round(loanCalc(l).total*100)/100}
}

          <td class="neg"><b>${euro(sum(per.map(x=>x.r.totInt)))}</b></td><td class="amber"><b>${euro(sum(per.map(x=>x.r.totStamp)))}</b></td></tr>

    if(s.p&&p.id!==s.p)return false;
    if(s.st==='on'&&!(Number(l.outstanding)>0))return false;
    if(s.st==='off'&&Number(l.outstanding)>0)return false;
    return lfHit(K,[loanName(l),l.name,l.bank,p.name,RATE[l.type],String(l.outstanding)].join(' '));
  }),{divida:x=>x.l.outstanding,prestacao:x=>Number(x.l.outstanding)>0?loanCalc(x.l).total:0,nome:x=>loanName(x.l),imovel:x=>x.p.name});
  const tot=sum(live.map(x=>x.l.outstanding)),pay=sum(live.map(x=>loanCalc(x.l).total));
  const head=lfBar(K,[lfSel(K,'p',lfPropOpts()),

    ${kpi('Em dívida',euro(tot),'amber',live.length+(live.length===1?' hipoteca ativa':' hipotecas ativas'))}
    ${kpi('Prestações',euro2(pay),'neg','por mês, no total')}
    ${kpi('Juros até ao fim',euro(sum(live.map(x=>{const a=amort(x.l);return a.totInt+a.totStamp}))),'neg','com imposto do selo')}</div>`;
  if(!rows.length)return head+`<div class="empty"><b>Sem hipotecas</b>Uma hipoteca está sempre associada a um imóvel. Cria a primeira aqui ou na ficha do imóvel.</div>`;
  if(!shown.length)return head+kpis+`<div class="empty"><b>Nada neste filtro</b></div>`;
  const mortCard=({p,l})=>{const live2=Number(l.outstanding)>0,c=live2?loanCalc(l):null;
    return `<div class="card tap" data-lp="mort:${esc(p.id)}:${esc(l.id)}" onclick="mortModal('${jsq(p.id)}','${jsq(l.id)}')">
      <div class="row-between"><div style="min-width:0"><div class="title">${esc(loanName(l))} ${live2?'':'<span class="badge grey">liquidada</span>'}</div>
        <div class="small">${esc(p.name)} · ${RATE[l.type]} · ${rateLabel(l)}${(l.files||[]).length?' · '+l.files.length+' doc.':''}</div></div>
        <div style="display:flex;gap:8px;flex:0 0 auto;align-items:flex-start">
          <div style="text-align:right"><b>${euro(l.outstanding)}</b>${live2?`<div class="small">${euro2(c.total)}/mês</div>`:''}</div>
          ${kebab('mort:'+p.id+':'+l.id)}</div></div></div>`};
  const act=shown.filter(x=>Number(x.l.outstanding)>0),paid=shown.filter(x=>!(Number(x.l.outstanding)>0));
  const list=(act.length?`<div class="list">${act.map(mortCard).join('')}</div>`:'')
    +(paid.length?`<div class="section-title" style="margin-top:${act.length?18:0}px">Créditos antigos já pagos</div>
      <div class="list">${paid.map(mortCard).join('')}</div>
      <div class="hint" style="margin-top:10px">Se editares um pagamento e a dívida voltar a subir, o crédito volta para a lista de cima.</div>`:'');
  return head+kpis+list+`<div class="hint" style="margin-top:12px">Também podes geri-las na ficha de cada imóvel.</div>`;

/* ================= SPLITWISE ================= */
let swRows=null,swHead=null;
function swPick(input){const f=input.files&&input.files[0];if(!f)return;input.value='';const r=new FileReader();r.onload=()=>swParse(String(r.result));r.readAsText(f,'utf-8')}
function swPasteBox(){
  openModal('Colar CSV do Splitwise',`<div class="form"><div class="hint">Abre o CSV, copia tudo e cola aqui — incluindo a linha dos títulos.</div>
    <textarea id="swText" style="min-height:120px;font:13px/1.5 ui-monospace,Menlo,monospace" placeholder="Date,Description,Category,Cost,Currency,..."></textarea></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="swParse(val('swText'))">Continuar</button>`);
}
function splitDelim(line){let q=false,c=0,s=0;for(const ch of line){if(ch==='"')q=!q;else if(!q){if(ch===',')c++;if(ch===';')s++}}return s>c?';':','}
function parseCsv(text,d){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function swParse(text){
  text=String(text||'').trim();
  if(!text)return toast('Não recebi nenhum texto.');
  const rows=parseCsv(text,splitDelim(text.split('\n')[0]));
  if(rows.length<2)return toast('Não consegui ler linhas neste ficheiro.');
  swHead=rows[0].map(h=>String(h).trim());swRows=rows.slice(1);closeAllModals();swMapModal();
}
const findCol=(...names)=>{for(const n of names){const i=swHead.findIndex(h=>h.toLowerCase().replace(/[^a-zç]/g,'')===n);if(i>-1)return i}return -1};
function swMapModal(){
  const iDate=findCol('date','data'),iDesc=findCol('description','descrição','descricao'),
        iCost=findCol('cost','custo','amount','valor'),iCat=findCol('category','categoria');
  window._swCols=[iDate,iDesc,iCost,iCat];
  openModal('Importar do Splitwise',`<div class="form">
    <div class="hint">Encontrei <b>${swRows.length}</b> linhas. Colunas: data → <b>${esc(swHead[iDate]||'?')}</b>, descrição → <b>${esc(swHead[iDesc]||'?')}</b>, custo → <b>${esc(swHead[iCost]||'?')}</b>.</div>
    <label>Lançar em que imóvel?${sel('sw_prop',(db.properties[0]||{}).id||'',db.properties.map(p=>({v:p.id,label:p.name})))}</label>
    <label>A minha quota-parte (%)<input id="sw_quota" type="text" inputmode="decimal" value="${dec(db.settings.quota||100)}" oninput="swRefresh()"></label>
    <div class="hint">O Splitwise exporta o custo total. Se divides a casa a meias, põe 50 e a app lança só metade.</div>
    <div class="divider"></div><div id="swPrev">${swPrevHtml(swPrepare(iDate,iDesc,iCost,iCat,100,db.settings.quota||100))}</div></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="swDo(${iDate},${iDesc},${iCost},${iCat})">Importar</button>`);
}
function swRefresh(){const[a,b,c,d]=window._swCols;document.getElementById('swPrev').innerHTML=swPrevHtml(swPrepare(a,b,c,d,100,num(val('sw_quota'))))}
function swPrepare(iDate,iDesc,iCost,iCat,limit,quota){
  const q=(quota||100)/100,out=[];
  for(const r of swRows){
    const desc=String(r[iDesc]||'').trim(),date=String(r[iDate]||'').trim();
    if(!date||/^total balance$/i.test(desc))continue;
    if(/^payment$/i.test(String(r[iCat]||'').trim())||/^payment$/i.test(desc))continue;
    const amount=Math.abs(num(r[iCost]))*q;if(!(amount>0))continue;
    const iso=/^\d{4}-\d{2}-\d{2}$/.test(date)?date:isoDate(date);if(!iso)continue;
    const cat=mapCat(r[iCat]);
    out.push({date:iso,label:desc||'Despesa Splitwise',amount:Math.round(amount*100)/100,category:cat[0],sub:cat[1]});
    if(out.length>=limit)break;
  }
  return out;
}
function isoDate(s){
  const m=String(s).match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!m)return null;
  const a=m[1],b=m[2],c=m[3];
  if(a.length===4)return `${a}-${b.padStart(2,'0')}-${c.padStart(2,'0')}`;
  if(c.length===4)return `${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
  return null;
}
function mapCat(c){
  const s=String(c||'').toLowerCase();
  if(/water|água|agua/.test(s))return ['Água, luz e gás','Água'];
  if(/electric|luz/.test(s))return ['Água, luz e gás','Eletricidade'];
  if(/gas/.test(s))return ['Água, luz e gás','Gás'];
  if(/tv|internet|phone/.test(s))return ['Água, luz e gás','Internet e TV'];
  if(/utilit/.test(s))return ['Água, luz e gás',''];
  if(/repair|maint|obra/.test(s))return ['Manutenção e reparações',''];
  if(/insur|seguro/.test(s))return ['Seguros',''];
  if(/tax|imi|imposto/.test(s))return ['Impostos',''];
  if(/clean|limpe/.test(s))return ['Limpeza e jardim','Limpeza'];
  if(/furni|mobil/.test(s))return ['Mobiliário e equipamento',''];
  if(/condom/.test(s))return ['Condomínio',''];
  return ['Outros',''];
}
function swPrevHtml(rows){
  if(!rows.length)return `<div class="hint">Nenhuma linha aproveitável. Confirma que exportaste o CSV do grupo.</div>`;
  return `<div class="hint" style="margin-bottom:8px">${rows.length} despesas · total <b>${euro2(sum(rows.map(r=>r.amount)))}</b></div>
    <div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>
    ${rows.slice(0,6).map(r=>`<tr><td>${r.date}</td><td style="text-align:left;white-space:normal">${esc(r.label)}</td><td>${euro2(r.amount)}</td></tr>`).join('')}
    ${rows.length>6?`<tr><td colspan="3" style="text-align:left;color:var(--muted)">…e mais ${rows.length-6}</td></tr>`:''}</tbody></table></div>`;
}
function swDo(iDate,iDesc,iCost,iCat){
  const pid=val('sw_prop'),quota=num(val('sw_quota'))||100;
  if(!pid)return toast('Cria primeiro um imóvel.');
  db.settings.quota=quota;
  const rows=swPrepare(iDate,iDesc,iCost,iCat,1e5,quota);
  if(!rows.length)return toast('Nada para importar.');
  const batch='b'+Date.now();let added=0,dup=0;
  rows.forEach(r=>{
    if(db.transactions.some(t=>t.date===r.date&&t.propertyId===pid&&Math.abs(t.amount-r.amount)<0.005&&t.label===r.label)){dup++;return}
    db.transactions.push(normTx({kind:'expense',label:r.label,amount:r.amount,date:r.date,propertyId:pid,category:r.category,sub:r.sub,batch,src:'splitwise'}));added++;
  });
  save();closeModal();render();toast(`${added} despesas importadas${dup?` · ${dup} repetidas ignoradas`:''}.`);
}
function undoImport(){
  const b=[...new Set(db.transactions.filter(t=>t.batch).map(t=>t.batch))].sort(),last=b[b.length-1];
  if(!last)return toast('Não há importações para anular.');
  const n=db.transactions.filter(t=>t.batch===last).length;
  confirmModal('Anular importação',`Apagar os ${n} movimentos da última importação?`,()=>{
    db.transactions=db.transactions.filter(t=>t.batch!==last);save();render();toast('Importação anulada.');
  });
}

   codificação WinAnsi (cobre todos os acentos portugueses) e quebra de

const HW=(function(){
  const w={},a=(s,v)=>{for(const c of s)w[c.charCodeAt(0)]=v};
  a(' ',278);a('!',278);a('"',355);a('#',556);a('$',556);a('%',889);a('&',667);a("'",191);
  a('()',333);a('*',389);a('+',584);a(',',278);a('-',333);a('.',278);a('/',278);
  a('0123456789',556);a(':;',278);a('<=>',584);a('?',556);a('@',1015);
  a('A',667);a('B',667);a('C',722);a('D',722);a('E',667);a('F',611);a('G',778);a('H',722);
  a('I',278);a('J',500);a('K',667);a('L',556);a('M',833);a('N',722);a('O',778);a('P',667);
  a('Q',778);a('R',722);a('S',667);a('T',611);a('U',722);a('V',667);a('W',944);a('X',667);
  a('Y',667);a('Z',611);a('[]',278);a('\\',278);a('^',469);a('_',556);a('`',333);
  a('a',556);a('b',556);a('c',500);a('d',556);a('e',556);a('f',278);a('g',556);a('h',556);
  a('i',222);a('j',222);a('k',500);a('l',222);a('m',833);a('n',556);a('o',556);a('p',556);
  a('q',556);a('r',333);a('s',500);a('t',278);a('u',556);a('v',500);a('w',722);a('x',500);
  a('y',500);a('z',500);a('{',334);a('|',260);a('}',334);a('~',584);
  return w;
})();
const HWB=(function(){
  const w={},a=(s,v)=>{for(const c of s)w[c.charCodeAt(0)]=v};
  a(' ',278);a('!',333);a('"',474);a('#',556);a('$',556);a('%',889);a('&',722);a("'",238);
  a('()',333);a('*',389);a('+',584);a(',',278);a('-',333);a('.',278);a('/',278);
  a('0123456789',556);a(':;',333);a('<=>',584);a('?',611);a('@',975);

  a('a',556);a('b',611);a('c',556);a('d',611);a('e',556);a('f',333);a('g',611);a('h',611);

  a('y',556);a('z',500);a('{',389);a('|',280);a('}',389);a('~',584);
  return w;
})();
/* acentuados: a largura é a da letra base */
const BASE={192:'A',193:'A',194:'A',195:'A',196:'A',197:'A',199:'C',200:'E',201:'E',202:'E',
  203:'E',204:'I',205:'I',206:'I',207:'I',209:'N',210:'O',211:'O',212:'O',213:'O',214:'O',
  217:'U',218:'U',219:'U',220:'U',221:'Y',224:'a',225:'a',226:'a',227:'a',228:'a',229:'a',
  231:'c',232:'e',233:'e',234:'e',235:'e',236:'i',237:'i',238:'i',239:'i',241:'n',242:'o',
  243:'o',244:'o',245:'o',246:'o',249:'u',250:'u',251:'u',252:'u',253:'y',186:'o',170:'a',
  8364:'E',8220:'"',8221:'"',8216:"'",8217:"'",8212:'-',8211:'-',183:'.',176:'o',186:'o'};
function charW(code,bold){
  const w=bold?HWB:HW;
  if(w[code]!==undefined)return w[code];
  const b=BASE[code];
  if(b)return w[b.charCodeAt(0)]||500;
  return bold?611:556;
}
const textW=(s,size,bold)=>{let t=0;for(let i=0;i<s.length;i++)t+=charW(s.charCodeAt(i),bold);return t*size/1000};

/* WinAnsi: mapeia o que precisamos e substitui o resto */
const WIN={8364:128,8218:130,8222:132,8230:133,8224:134,8225:135,8216:145,8217:146,
  8220:147,8221:148,8226:149,8211:150,8212:151,732:152,8482:153,8250:155};
function pdfEsc(s){
  let out='';
  for(let i=0;i<s.length;i++){
    let c=s.charCodeAt(i);
    if(WIN[c]!==undefined)c=WIN[c];
    else if(c>255){const b=BASE[c];c=b?b.charCodeAt(0):63}
    const ch=String.fromCharCode(c);
    out+=(ch==='('||ch===')'||ch==='\\')?'\\'+ch:ch;
  }
  return out;
}

function PDF(){
  const P={pages:[],cur:null,y:0,W:595.28,H:841.89,ML:56,MR:56,MT:64,MB:64,images:[]};
  P.newPage=()=>{P.cur=[];P.pages.push(P.cur);P.y=P.H-P.MT};
  /* imagem JPEG (bytes numa string latin-1); devolve o número para desenhar */
  P.image=(bin,w,h)=>{P.images.push({bin,w,h});return P.images.length};
  P.draw=(n,x,y,w,h)=>{P.cur.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${n} Do Q`)};
  /* desenha uma fotografia com legenda, ajustada à largura e a uma altura máxima */
  P.photo=(n,iw,ih,caption,maxH)=>{
    const full=P.W-P.ML-P.MR,k=Math.min(full/iw,(maxH||300)/ih),w=iw*k,h=ih*k;
    P.need(h+24);
    P.draw(n,P.ML,P.y-h,w,h);P.y-=h+4;
    P.text(caption,{size:9.5,after:10});
  };
  P.space=()=>P.y-P.MB;
  P.need=h=>{if(P.y-h<P.MB)P.newPage()};
  P.text=(s,o)=>{
    o=o||{};
    const size=o.size||10,bold=!!o.bold,lead=o.lead||size*1.42;
    const x0=P.ML+(o.indent||0),maxW=P.W-P.ML-P.MR-(o.indent||0)-(o.right||0);
    const words=String(s).split(/\s+/).filter(Boolean);
    const lines=[];let line='';
    words.forEach(w=>{
      const cand=line?line+' '+w:w;
      if(textW(cand,size,bold)>maxW&&line){lines.push(line);line=w}else line=cand;
    });
    if(line)lines.push(line);
    lines.forEach((ln,i)=>{
      P.need(lead);
      let x=x0;
      if(o.center)x=(P.W-textW(ln,size,bold))/2;
      P.cur.push(`BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${(P.y-size).toFixed(2)} Td (${pdfEsc(ln)}) Tj ET`);
      P.y-=lead;
    });
    if(o.after)P.y-=o.after;
  };
  P.rule=(o)=>{o=o||{};P.need(6);
    P.cur.push(`0.75 w 0.7 0.7 0.7 RG ${(P.ML+(o.indent||0)).toFixed(2)} ${P.y.toFixed(2)} m ${(P.W-P.MR).toFixed(2)} ${P.y.toFixed(2)} l S`);
    P.y-=(o.after===undefined?8:o.after);};
  P.gap=h=>{P.y-=h};
  P.line=(cols,widths,o)=>{                        /* linha de tabela */
    o=o||{};const size=o.size||9.5,lead=size*1.5;
    P.need(lead+2);
    let x=P.ML;
    cols.forEach((c,i)=>{
      const w=widths[i];
      let s=String(c==null?'':c);
      while(textW(s,size,o.bold)>w-6&&s.length>1)s=s.slice(0,-1);
      const tx=o.right&&o.right.indexOf(i)>-1?x+w-6-textW(s,size,o.bold):x+3;
      P.cur.push(`BT /${o.bold?'F2':'F1'} ${size} Tf ${tx.toFixed(2)} ${(P.y-size).toFixed(2)} Td (${pdfEsc(s)}) Tj ET`);
      x+=w;
    });
    P.y-=lead;
    if(o.rule)P.rule({after:3});
  };
  P.build=()=>{
    const objs=[];
    const push=s=>{objs.push(s);return objs.length};
    const kids=[];
    const fontA=push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const fontB=push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const imIds=P.images.map(im=>push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n${im.bin}\nendstream`));
    const xobj=imIds.length?` /XObject << ${imIds.map((id,i)=>`/Im${i+1} ${id} 0 R`).join(' ')} >>`:'';
    const pagesId=push('');                        /* reservado */
    P.pages.forEach(ops=>{
      const stream=ops.join('\n');
      const cid=push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      const pid=push(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${P.W.toFixed(2)} ${P.H.toFixed(2)}] `+
        `/Resources << /Font << /F1 ${fontA} 0 R /F2 ${fontB} 0 R >>${xobj} >> /Contents ${cid} 0 R >>`);
      kids.push(pid);
    });
    objs[pagesId-1]=`<< /Type /Pages /Count ${kids.length} /Kids [${kids.map(k=>k+' 0 R').join(' ')}] >>`;
    const catId=push(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
    let out='%PDF-1.4\n';const offs=[];
    objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
    offs.forEach(o=>{out+=String(o).padStart(10,'0')+' 00000 n \n'});
    out+=`trailer\n<< /Size ${objs.length+1} /Root ${catId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return out;
  };
  P.newPage();
  return P;
}

/* fotografia guardada em IndexedDB -> JPEG redimensionado, em string de bytes (para o PDF) */
function photoJpeg(meta,maxPx){
  return idbGet(meta.id).then(blob=>{
    if(!blob)return null;
    return new Promise(res=>{
      const url=URL.createObjectURL(blob),img=new Image();
      const done=v=>{try{URL.revokeObjectURL(url)}catch(e){}res(v)};
      img.onload=()=>{
        try{
          const k=Math.min(1,(maxPx||1200)/Math.max(1,img.naturalWidth,img.naturalHeight));
          const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
          const b64=cv.toDataURL('image/jpeg',0.82).split(',')[1];
          done({bin:atob(b64),w,h});
        }catch(e){done(null)}
      };
      img.onerror=()=>done(null);
      img.src=url;
    });
  }).catch(()=>null);
}

/* ================= NÚMEROS POR EXTENSO ================= */
const EXT_U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'];
const EXT_D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const EXT_C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ext3(n){
  if(n===0)return '';
  if(n===100)return 'cem';
  const c=Math.floor(n/100),r=n%100;
  const parts=[];
  if(c)parts.push(EXT_C[c]);
  if(r){
    if(r<20)parts.push(EXT_U[r]);
    else{const d=Math.floor(r/10),u=r%10;parts.push(u?EXT_D[d]+' e '+EXT_U[u]:EXT_D[d])}
  }
  return parts.join(' e ');
}
function extenso(n){
  n=Math.floor(Math.abs(Number(n)||0));
  if(n===0)return 'zero';
  const mi=Math.floor(n/1000000),mil=Math.floor((n%1000000)/1000),un=n%1000;
  const p=[];
  if(mi)p.push(mi===1?'um milhão':ext3(mi)+' milhões');
  if(mil)p.push(mil===1?'mil':ext3(mil)+' mil');
  if(un)p.push(ext3(un));
  if(p.length===1)return p[0];
  const liga=un&&(un<100||un%100===0)?' e ':' ';
  if(p.length===2)return p[0]+liga+p[1];
  return p[0]+' '+p[1]+liga+p[2];
}
function euroExtenso(v){
  const n=Math.round((Number(v)||0)*100),int=Math.floor(n/100),cent=n%100;
  let s=extenso(int)+(int===1?' euro':' euros');
  if(cent)s+=' e '+extenso(cent)+(cent===1?' cêntimo':' cêntimos');
  return s;
}
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataLonga(iso){
  if(!iso)return '';
  const p=String(iso).split('-');if(p.length<3)return iso;
  return `${Number(p[2])} de ${MESES[Number(p[1])-1]||''} de ${p[0]}`;
}
function prazoTexto(a,b){
  if(!a||!b)return 'prazo certo';
  const d1=new Date(a),d2=new Date(b);
  const meses=Math.round((d2-d1)/(1000*60*60*24*30.44));
  if(meses>=12&&meses%12===0){const y=meses/12;return `${y} (${extenso(y)}) ano${y>1?'s':''}`}
  return `${meses} (${extenso(meses)}) meses`;
}

/* ================= IDENTIFICAÇÃO DAS PARTES ================= */
/* "Casado(a)" -> "casado" ou "casada", conforme o género da ficha */
function generoTexto(t,g){
  let s=String(t||'').toLowerCase();
  if(g==='f')s=s.replace(/o\(a\)/g,'a').replace(/\(a\)/g,'a');
  else if(g==='m')s=s.replace(/o\(a\)/g,'o').replace(/\(a\)/g,'');
  return s;
}
function pessoaTexto(p){
  const b=[];
  b.push((p.name||'').toUpperCase());
  if(p.marital)b.push(generoTexto(p.marital,p.gender));
  if(p.nationality)b.push('de nacionalidade '+p.nationality.toLowerCase());
  if(p.birth)b.push((p.gender==='f'?'nascida':'nascido')+' em '+dataLonga(p.birth));
  if(p.cc)b.push('titular do Cartão de Cidadão n.º '+fmtCC(p.cc)+(p.ccValid?', válido até '+dataLonga(p.ccValid):''));
  if(p.nif)b.push('NIF '+fmtNIF(p.nif));
  if(p.taxAddress)b.push((p.gender==='f'?'residente':'residente')+' em '+p.taxAddress.replace(/\s*\n\s*/g,', '));
  return b.join(', ');
}
const listaPessoas=arr=>arr.map(pessoaTexto).filter(Boolean).join('; e ');

/* ================= GERAR O CONTRATO ================= */
/* morada completa a partir dos campos registais; se não houver, a morada curta da ficha */
function fullAddress(p){
  const a=[];
  const rua=[p.street,p.doorNumber].filter(Boolean).join(', ');if(rua)a.push(rua);
  const piso=[p.floor,p.fraction?'fração '+p.fraction:''].filter(Boolean).join(', ');if(piso)a.push(piso);
  const cp=[p.postalCode,p.locality].filter(Boolean).join(' ');if(cp)a.push(cp);
  return a.length?a.join(', '):(p.address||'');
}
function contractData(c){
  const p=prop(c.propertyId)||{};
  const owners=ownersOfProp(p).map(owner).filter(Boolean);
  const tenants=ctTenants(c);
  const total=(Number(c.rent)||0)+(Number(c.deposit)||0);

  const fregTxt=freg&&conc?(freg===conc?`freguesia e concelho de ${freg}`:`freguesia de ${freg}, concelho de ${conc}`):(freg?(/freguesia|concelho/i.test(freg)?freg:'freguesia de '+freg):(conc?'concelho de '+conc:''));
  return {
    'imovel.nome':p.name||'',
    'imovel.morada':fullAddress(p),
    'imovel.freguesia':fregTxt,
    'imovel.registo':p.registry||'','imovel.matriz':p.matrix||'','imovel.licenca':p.licence||'',
    'imovel.certificado':p.energyCert||'','imovel.classe':p.energyClass||'','imovel.validadeCert':dataLonga(p.energyValid),
    'senhorios.identificacao':listaPessoas(owners),
    'inquilinos.identificacao':listaPessoas(tenants),
    'senhorios.representante':rep.name||'',
    'senhorios.morada':(rep.taxAddress||'').replace(/\s*\n\s*/g,', '),
    'contacto.email':c.ownerEmail||rep.email||'',
    'contacto.telefone':fmtPhone(c.ownerPhone||rep.phone||''),
    'contrato.renda':money(c.rent),'contrato.rendaLetras':euroExtenso(c.rent),
    'contrato.caucao':c.deposit?money(c.deposit):'','contrato.caucaoLetras':c.deposit?euroExtenso(c.deposit):'',
    'contrato.total':total?money(total):'','contrato.totalLetras':total?euroExtenso(total):'',
    'contrato.iban':fmtIBAN(c.iban),
    'contrato.diaPagamento':c.payDayTo||c.payDay||8,
    'contrato.inicio':dataLonga(c.start),'contrato.fim':dataLonga(c.end),
    'contrato.prazo':prazoTexto(c.start,c.end),
    'data.hoje':dataLonga(today()),
    'local':p.locality||p.concelho||(p.address||'').split(',').pop().replace(/\d{4}-\d{3}/,'').trim()||'Portugal',
    fotos:(c.photoIds||[]).length
  };
}
function fillTpl(str,d){
  /* blocos condicionais {{#chave}}…{{/}} */
  str=String(str).replace(/\{\{#([\w.]+)\}\}([\s\S]*?)\{\{\/\}\}/g,(m,k,inner)=>d[k]?inner:'');
  return str.replace(/\{\{([\w.]+)\}\}/g,(m,k)=>d[k]==null?'':String(d[k]));
}
const ROMANOS=['','PRIMEIRA','SEGUNDA','TERCEIRA','QUARTA','QUINTA','SEXTA','SÉTIMA','OITAVA','NONA','DÉCIMA',
  'DÉCIMA PRIMEIRA','DÉCIMA SEGUNDA','DÉCIMA TERCEIRA','DÉCIMA QUARTA','DÉCIMA QUINTA','DÉCIMA SEXTA',
  'DÉCIMA SÉTIMA','DÉCIMA OITAVA','DÉCIMA NONA','VIGÉSIMA'];

async function generateContractPdf(cid){
  const c=contract(cid);if(!c)return toast('Contrato não encontrado.');
  const p=prop(c.propertyId);
  if(!p)return toast('O contrato não tem imóvel.');
  if(!ctTenants(c).length)return toast('Adiciona pelo menos um inquilino antes de gerar o contrato.');
  let doc;
  try{doc=new DOMParser().parseFromString(CONTRACT_XML,'application/xml')}
  catch(e){return toast('Não foi possível ler o modelo do contrato.')}
  const d=contractData(c),pdf=PDF();
  /* fotografias do registo fotográfico: entram no PDF como imagens JPEG */
  const imgs={},metas=(p.photos||[]).filter(f=>(c.photoIds||[]).indexOf(f.id)>-1);
  if(metas.length){
    toast('A preparar '+metas.length+' fotografia'+(metas.length===1?'':'s')+'…');
    for(const f of metas){const j=await photoJpeg(f,1200);if(j)imgs[f.id]={n:pdf.image(j.bin,j.w,j.h),w:j.w,h:j.h}}
  }
  const ok=k=>{const v=d[k];return !(v===''||v==null||v===0)};
  const skip=el=>{const o=el.getAttribute('opcional');return o&&!ok(o)&&o!=='fotos'?true:(o==='fotos'&&!d.fotos)};
  const T=el=>fillTpl((el.textContent||'').replace(/\s+/g,' ').trim(),d);
  let nCl=0;

  const root=doc.documentElement;
  [].slice.call(root.childNodes).forEach(el=>{
    if(el.nodeType!==1)return;
    const tag=el.tagName;
    if(skip(el))return;
    if(tag==='titulo'){pdf.text(T(el),{size:14,bold:true,center:true,after:4});return}
    if(tag==='subtitulo'){pdf.text(T(el),{size:10,center:true,after:10});pdf.rule({after:12});return}
    if(tag==='secao'||tag==='anexo'){
      if(tag==='anexo')pdf.newPage();
      pdf.gap(4);pdf.text(el.getAttribute('titulo'),{size:11.5,bold:true,after:6});
      [].slice.call(el.childNodes).forEach(ch=>{
        if(ch.nodeType!==1||skip(ch))return;
        if(ch.tagName==='p')pdf.text(T(ch),{after:5});
        else if(ch.tagName==='lista')[].slice.call(ch.getElementsByTagName('item')).forEach(it=>pdf.text('• '+T(it),{indent:10,after:2}));
        else if(ch.tagName==='tabela')tabela(pdf,ch,c,p,d,imgs);
        else if(ch.tagName==='assinaturas')assinaturas(pdf,ch.getAttribute('parte'),c,p);
      });
      pdf.gap(6);return;
    }
    if(tag==='clausula'){
      nCl++;
      pdf.gap(5);
      pdf.text(`CLÁUSULA ${ROMANOS[nCl]||nCl+'.ª'} — ${el.getAttribute('titulo')}`,{size:10.5,bold:true,after:5});
      let i=0;
      [].slice.call(el.getElementsByTagName('n')).forEach(nEl=>{
        if(skip(nEl))return;
        i++;pdf.text(i+'. '+T(nEl),{indent:12,after:4});
      });
      return;
    }
    if(tag==='destaque'){pdf.gap(4);pdf.text(T(el),{bold:true,after:6});pdf.rule({after:10});return}
  });
  const name=('contrato-'+(p.name||'imovel')+'-'+today()).replace(/[^\w\-]+/g,'-').toLowerCase()+'.pdf';
  const bytes=pdf.build();
  if(window.Android&&window.Android.saveAs)window.Android.saveAs(name,'application/pdf',b64Latin1(bytes));
  else downloadBytes(name,'application/pdf',bytes);
  toast('Contrato gerado.');
}
function tabela(pdf,el,c,p,d,imgs){
  const cols=(el.getAttribute('colunas')||'').split('|');
  const fonte=el.getAttribute('fonte');
  const full=pdf.W-pdf.ML-pdf.MR;
  let rows=[],widths=[];
  if(fonte==='inventario'){
    widths=[34,full-34-46-80,46,80];
    rows=(c.inventory||[]).map((it,i)=>[i+1,it.name||'—',it.qty,it.state==='novo'?'Novo':'Usado']);
  }else if(fonte==='chaves'){
    widths=[full-90,90];
    rows=(c.keys||[]).map(k=>[k.name||'—',k.qty]);
  }else if(fonte==='fotos'){
    const metas=(p.photos||[]).filter(f=>(c.photoIds||[]).indexOf(f.id)>-1);
    if(!metas.length){pdf.text('(sem fotografias selecionadas)',{size:9.5,after:4});return}
    metas.forEach((f,i)=>{
      const im=(imgs||{})[f.id],cap=`${i+1}. ${f.name||'Fotografia '+(i+1)}`;
      if(im)pdf.photo(im.n,im.w,im.h,cap,300);
      else pdf.text(cap+' (imagem não disponível neste dispositivo)',{size:9.5,after:6});
    });
    pdf.gap(4);return;
  }
  if(!rows.length){pdf.text('(sem elementos registados)',{size:9.5,after:4});return}
  pdf.line(cols,widths,{bold:true,rule:true,size:9.5});
  rows.forEach(r=>pdf.line(r,widths,{size:9.5,right:fonte==='chaves'?[1]:(fonte==='inventario'?[2]:[])}));
  pdf.gap(6);
}
function assinaturas(pdf,parte,c,p){
  const gente=parte==='senhorios'?ownersOfProp(p).map(owner).filter(Boolean):ctTenants(c);
  if(!gente.length)return;
  pdf.gap(8);
  pdf.text(parte==='senhorios'?'OS SENHORIOS':'OS INQUILINOS',{size:10,bold:true,after:6});
  gente.forEach(g=>{
    pdf.need(46);
    pdf.gap(20);
    pdf.text('__________________________________',{after:1});
    pdf.text(g.name||'',{size:9.5,after:0});
    pdf.text(parte==='senhorios'?(g.gender==='f'?'Senhoria':'Senhorio'):(g.gender==='f'?'Inquilina':'Inquilino'),{size:8.5,after:6});
  });
}
/* o PDF é texto latin-1: converte byte a byte, sem passar por UTF-8 */
function b64Latin1(s){
  try{let out='';for(let i=0;i<s.length;i++)out+=String.fromCharCode(s.charCodeAt(i)&0xFF);return btoa(out)}
  catch(e){return ''}
}

/* avaliação por rendimento ano a ano (histórico) e equity projetado com a amortização */
function evoValuation(p,what){
  const target=(db.settings.capTarget||5)/100;
  if(what==='equity'){
    const n=Math.max(2,Math.round(db.settings.years));
    return {fmt:euro,yearlyTitle:'Projeção ano a ano',extraTitle:'Em dívida',note:'Valor de mercado atual menos a dívida no fim de cada ano.',
      yearly:[...Array(n)].map((_,i)=>{const debt=sum(liveLoans(p).map(l=>{const a=amort(l,(i+1)*12);return a.rows.length?a.rows[a.rows.length-1].bal:0}));
        return {label:YEAR+i,value:p.value-debt,extra:euro(debt)}})};
  }
  return {fmt:what==='diff'?(v=>pct(v)):euro,extraTitle:'NOI',
    yearly:yearsWithData(p.id).map(y=>{const m=metrics(y,p.id),noi=m.income-m.op,v=target?noi/target:0;
      return {label:y,value:what==='diff'?(p.value?v/p.value-1:NaN):v,extra:euro(noi)}})};
}

function renameCat(tk,oldName,newName){
  newName=String(newName||'').trim();
  if(!newName||newName===oldName)return render();
  const cs=db.settings[tk]||{},out={};
  Object.keys(cs).forEach(k=>{out[k===oldName?newName:k]=cs[k]});
  db.settings[tk]=out;
  treeTx(tk).forEach(t=>{if(t.category===oldName)t.category=newName});
  save();render();toast('Categoria renomeada.');
}
function delCat(tk,k){
  const used=treeTx(tk).filter(t=>t.category===k).length;
  confirmModal('Apagar categoria',`Apagar “${esc(k)}”?${used?` ${used} movimento(s) ficam sem categoria.`:''}`,()=>{
    delete db.settings[tk][k];
    treeTx(tk).forEach(t=>{if(t.category===k){t.category='';t.sub=''}});
    save();render();toast('Categoria apagada.');

function renameSub(tk,k,old){
  promptModal('Mudar o nome da subcategoria','Nome',old,nn=>{
    nn=String(nn||'').trim();if(!nn||nn===old)return;
    const cs2=db.settings[tk]||{},l=cs2[k]||[];
    const i=l.indexOf(old);if(i>-1)l[i]=nn;
    treeTx(tk).forEach(t=>{if(t.category===k&&t.sub===old)t.sub=nn});
    const e=db.settings.exclude||{};if(e[excKey(tk,k,old)]){e[excKey(tk,k,nn)]=true;delete e[excKey(tk,k,old)]}

const bkName=()=>'gestor-imobiliario-'+today()+'.json';
function b64(s){
  try{const by=new TextEncoder().encode(s);let bin='';for(const b of by)bin+=String.fromCharCode(b);return btoa(bin)}
  catch(e){try{return btoa(unescape(encodeURIComponent(s)))}catch(e2){return ''}}
}
function driveSave(){
  const json=JSON.stringify(db,null,2);
  if(window.Android&&window.Android.saveAs){window.Android.saveAs(bkName(),'application/json',b64(json));return toast('Escolhe onde guardar.')}
  download(bkName(),'application/json',json);
}
function driveOpen(){
  if(window.Android&&window.Android.openFile){window.Android.openFile('application/json');return toast('Escolhe a cópia.')}
  bkPasteBox();
}
window.__fileLoaded=function(name,text){
  if(String(name||'').toLowerCase().endsWith('.csv'))return swParse(text);

};
function bkPasteBox(){
  openModal('Colar cópia de segurança',`<div class="form">
    <textarea id="bkText" style="min-height:130px;font:13px/1.5 ui-monospace,Menlo,monospace" placeholder='{"properties":[…]}'></textarea></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="bkLoad(val('bkText'))">Repor</button>`);
}
function bkLoad(text){
  let d;try{d=JSON.parse(text)}catch(e){return toast('Isso não é um ficheiro válido.')}
  if(!d||!Array.isArray(d.properties)||!Array.isArray(d.transactions))return toast('Falta a lista de imóveis ou de movimentos.');
  confirmModal('Repor cópia',`Substituir os dados atuais por ${d.properties.length} imóveis, ${(d.contracts||[]).length} contratos e ${d.transactions.length} movimentos?`,()=>{
    db=Object.assign({},blank,d,{settings:Object.assign({},blank.settings,d.settings||{})});
    db.properties=db.properties.map(normProp);
    db.owners=(db.owners||[]).map(normPerson);
    db.tenants=(db.tenants||[]).map(normPerson);
    db.contracts=(db.contracts||[]).map(normContract);
    db.templates=(db.templates||[]).map(normTpl);db.recurring=(db.recurring||[]).map(normRec);
    db.groups=(db.groups||[]).map(normGroup);
    db.transactions=db.transactions.map(t=>normTx(Object.assign({},t,{kind:t.kind==='debt'?'loan':t.kind})));
    fillCats(db.settings);migrateSettlements(db);syncAllContractRecs();syncAllLoanRecs();
    save();migrateInline();closeAllModals();applyTheme();buildNav();render();toast('Cópia reposta.');
  });
}
function download(name,mime,content){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}
/* "bin" é uma string em que cada carácter é um byte (o PDF) — não pode passar por UTF-8 */
function downloadBytes(name,mime,bin){
  const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i)&255;
  download(name,mime,u);
}
function downloadCsv(){
  const rows=[['data','descricao','tipo','valor','imovel','pago_por','recebido_por','divisao','quarto','inquilinos','categoria','subcategoria','etiquetas','credor','comentarios','capital','juros','selo'],
    ...db.transactions.map(t=>{const c=t.contractId?contract(t.contractId):null,p=prop(t.propertyId);
      return [t.date,t.label,(KIND[t.kind]||{}).short||t.kind,t.amount,propName(t.propertyId),
        t.paidBy&&owner(t.paidBy)?owner(t.paidBy).name:'',t.toId&&owner(t.toId)?owner(t.toId).name:'',splitLabel(t),
        c&&c.roomId?roomName(p,c.roomId):'',c?ctNames(c):'',t.category||'',t.sub||'',(t.tags||[]).join(' / '),
        t.creditor||'',t.notes||'',t.principal||'',t.interest||'',t.stamp||'']})];
  download('movimentos-imobiliarios.csv','text/csv;charset=utf-8',rows.map(r=>r.map(x=>'"'+String(x).split('"').join('""')+'"').join(';')).join('\n'));
  toast('CSV exportado.');
}
function shareReport(){
  const txt=reportText();
  if(window.Android&&window.Android.shareText)return window.Android.shareText('Avaliação do portefólio',txt);
  if(navigator.share)return navigator.share({title:'Avaliação do portefólio',text:txt}).catch(()=>{});
  if(navigator.clipboard)return navigator.clipboard.writeText(txt).then(()=>toast('Relatório copiado.'));
  toast('Não foi possível partilhar.');
}
function wipe(){
  confirmModal('Apagar tudo','Isto apaga imóveis, contratos, pessoas, movimentos e definições deste dispositivo.',()=>{
    const th=db.settings.theme;db=JSON.parse(JSON.stringify(blank));db.settings.theme=th;

  });
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* o teclado tapava as caixas de texto no fundo do ecrã */
const typing=t=>!!t&&((/^(INPUT|TEXTAREA)$/.test(t.tagName||'')&&!/^(date|month|time|checkbox|file)$/.test(t.type||''))||t.isContentEditable);
/* o seletor de data é uma janela do sistema: ao escolher, larga o foco para o ecrã voltar ao sítio */
document.addEventListener('change',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&/^(date|month|time)$/.test(t.type||'')){try{t.blur()}catch(x){}
  [].slice.call(document.querySelectorAll('.sheet.kb')).forEach(x=>x.classList.remove('kb'))}});
const topSheet=()=>{const t=modalTop();return t?t.el.querySelector('.sheet'):null};
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(!typing(t))return;
  const s2=topSheet();if(s2)s2.classList.add('kb');
  setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(err){}},260);
});
document.addEventListener('focusout',()=>{
  setTimeout(()=>{
    if(typing(document.activeElement))return;
    [].slice.call(document.querySelectorAll('.sheet.kb')).forEach(x=>x.classList.remove('kb'));
  },120);
});
