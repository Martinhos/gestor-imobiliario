<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- "light dark" = a página sabe apresentar-se das duas maneiras. Declarar só
     "light" é dizer ao motor que não há tema escuro, e há motores (WebKit, e
     o WebView do Android) que respondem a isso com prefers-color-scheme:light
     mesmo com o aparelho em escuro — o modo automático ficava preso no claro.
     O applyTheme() estreita isto para um dos dois assim que decide. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1a3a2c" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imobiliário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Rendorium</title>
<script>
/* Armadilha de erros, antes de tudo o resto.
   O relato normal vive em cloud/ajuda.js, que é o 27.º script a carregar: se
   um módulo anterior rebentar, a app fica em branco e nunca ninguém sabe
   porquê. Isto apanha esses — guarda-os para o relato normal os levar, e se
   ele não chegar a existir em três segundos, envia-os por si. */
(function () {
  var vistos = {}, fila = [];
  window.__erros = fila;
  function apanha(msg, detalhe) {
    var chave = String(msg).slice(0, 120);
    if (vistos[chave] || fila.length >= 8) return;
    vistos[chave] = 1;
    fila.push({
      message: String(msg).slice(0, 500),
      detail: String(detalhe || '').slice(0, 800),
      // o avisos.js pode nem ter chegado a carregar: daí o typeof
      versao: typeof VERSAO !== 'undefined' ? VERSAO : null,
      ecra: 'arranque',
      agente: String(navigator.userAgent || '').slice(0, 180),
    });
  }
  window.addEventListener('error', function (e) {
    apanha(e.message, (e.filename || '') + ':' + (e.lineno || '') + ' · arranque\n' +
      String((e.error && e.error.stack) || '').slice(0, 500));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    apanha('Promessa rejeitada: ' + ((r && r.message) || r),
      String((r && r.stack) || '').slice(0, 500) + ' · arranque');
  });
  setTimeout(function () {
    if (window.__errosLevados || !fila.length) return;
    window.__errosLevados = 1;
    fila.splice(0).forEach(function (r) {
      r.detail = (r.detail || '') + '\n\n(a app não chegou a arrancar)';
      try {
        fetch('/api/reports', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r),
        }).catch(function () {});
      } catch (e) {}
    });
  }, 3000);
})();
</script>
<style>
:root{
  /* A propriedade sobrepõe-se ao <meta>, por isso tem de dizer o mesmo: a
     página sabe apresentar-se clara e escura. Quem escolhe é o applyTheme(),
     que estreita isto para um dos dois com um estilo em linha. */
  color-scheme:light dark;
  --bg:#f7f8fa; --card:#fff; --field:#fff; --chip:#f2f4f3; --tint:#f6faf8; --press:#e4e9e6;
  --ink:#17221d; --muted:#5a635e; --line:#e7ebe8; --line2:#cfd8d3;
  --accent:#244c3b; --accent-ink:#fff; --accent-soft:#dfece6; --accent-press:#1c3d2f; --accent-fundo:#132a20;
  --danger:#b94a48; --danger-soft:#f7e8e7; --warn:#9a6400; --warn-soft:#f6eeda;
  --side:#1a3a2c; --side-ink:#dfece6; --side-muted:#9dbdae; --side-hover:rgba(255,255,255,.07); --side-on:rgba(255,255,255,.13);
  --track:#dfe3e1; --blur:rgba(247,248,250,.94); --shadow:0 24px 60px rgba(0,0,0,.28);
  --rail:264px; --rail-min:76px;
  /* Movimento: uma só escala de durações e duas curvas, citadas por toda a
     folha, para nada aqui ser um número escolhido à sorte. --curva arranca
     depressa e chega devagar — é a de quem entra em cena; --curva-sai faz o
     inverso, e serve o que se fecha ou desaparece. */
  /* O --lento é o degrau de quem atravessa distância — a folha da janela. A
     .26s não chegava: com a curva certa, uma folha que sobe o ecrã inteiro
     precisa de tempo para se ver subir. */
  --rapido:.12s; --medio:.2s; --lento:.34s;
  /* fora da escala porque não são reações: --desenho é um gráfico a
     desenhar-se e --pulso é um crachá a saltar */
  --desenho:.5s; --pulso:.18s;
  /* DUAS curvas de entrada, e a diferença é a distância percorrida.
     A --curva é um estalido: medida, faz 83% do caminho em 30% do tempo. É o
     que se quer num botão que encolhe 3% — a reação tem de parecer imediata.
     Numa folha que atravessa o ecrã, quer dizer 83% da altura em 78 ms: a
     janela teleporta-se e passa o resto do tempo a assentar os últimos 4%.
     A --curva-entra faz 64% em 30% e é a de quem ATRAVESSA distância: a folha
     da janela, a gaveta, as barras de um gráfico a crescer, o conteúdo de uma
     dobra. Quem estiver na dúvida: se o que se move percorre mais do que uns
     poucos pixeis, é a --curva-entra. */
  --curva:cubic-bezier(.22,1,.36,1); --curva-entra:cubic-bezier(0,0,.2,1);
  --curva-sai:cubic-bezier(.4,0,1,1);
  --safe:env(safe-area-inset-top,0px);
  --inset-top:var(--safe); --inset-bottom:env(safe-area-inset-bottom,0px);
  --inset-left:env(safe-area-inset-left,0px); --inset-right:env(safe-area-inset-right,0px);
}
:root.dark{
  color-scheme:dark;
  --bg:#12141b; --card:#1b1e28; --field:#20242f; --chip:#272b38; --tint:#1f2330; --press:#333949;
  --ink:#eef0f6; --muted:#9aa3b8; --line:#2b3040; --line2:#3a4054;
  --accent:#5ee0a8; --accent-ink:#0b1410; --accent-soft:#1c3a33; --accent-press:#7ceabb; --accent-fundo:#9df0cd;
  --danger:#ff8a80; --danger-soft:#3a2326; --warn:#ffc35c; --warn-soft:#3a2f14;
  --side:#161a3a; --side-ink:#e3e6ff; --side-muted:#9aa0d6; --side-hover:rgba(255,255,255,.07); --side-on:rgba(94,224,168,.18);
  --track:#3a4054; --blur:rgba(18,20,27,.92); --shadow:0 24px 60px rgba(0,0,0,.6);
}
:root.dark .kpi .value.pos{color:#5ee0a8}:root.dark .kpi .value.neg{color:#ff8a80}:root.dark .kpi .value.amber{color:#ffc35c}
:root.dark .pos{color:#5ee0a8}:root.dark .neg{color:#ff8a80}:root.dark .amber{color:#ffc35c}
:root.dark nav a.on{color:#5ee0a8}
:root.dark .brand .mark{background:linear-gradient(135deg,#5ee0a8,#7aa9ff)}
:root.dark .fold-head .ic,:root.dark .sect-head .ic{background:#24314a;color:#8fb8ff}
:root.dark .kpi:nth-child(4n+1){background:linear-gradient(160deg,#1b1e28,#1d2a2a)}
:root.dark .kpi:nth-child(4n+2){background:linear-gradient(160deg,#1b1e28,#2a2226)}
:root.dark .kpi:nth-child(4n+3){background:linear-gradient(160deg,#1b1e28,#2a2720)}
:root.dark .kpi:nth-child(4n){background:linear-gradient(160deg,#1b1e28,#202538)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.value,.table td,.table th,.stat b{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100%}
aside{width:var(--rail);flex:0 0 var(--rail);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;transition:width var(--medio) var(--curva-entra),flex-basis var(--medio) var(--curva-entra),transform var(--medio) var(--curva-entra);z-index:62}
body.rail aside{width:var(--rail-min);flex-basis:var(--rail-min)}
.brand{display:flex;align-items:center;gap:11px;padding:calc(18px + var(--inset-top)) 18px 14px;min-height:60px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 34px}
.brand b{font-size:15px;letter-spacing:-.01em;display:block;white-space:nowrap}
.brand small{color:var(--side-muted);font-size:11px;white-space:nowrap}
body.rail .brand .txt{display:none}
nav{display:grid;gap:2px;padding:8px 10px;flex:1;align-content:start;overflow:auto}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--side-muted);cursor:pointer;white-space:nowrap;position:relative}
nav a svg{flex:0 0 20px}
nav a:hover{background:var(--side-hover);color:#fff}
nav a.on{background:var(--side-on);color:#fff;font-weight:600}
nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--side-ink)}
body.rail nav a .txt{display:none}
body.rail nav a{justify-content:center;padding:11px 0}
.railfoot{padding:10px 10px calc(10px + var(--inset-bottom));border-top:1px solid rgba(255,255,255,.09)}
.railbtn{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:var(--side-muted);padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left}
.railbtn:hover{background:var(--side-hover);color:#fff}
body.rail .railbtn{justify-content:center;padding:10px 0}
body.rail .railbtn .txt{display:none}
/* O véu acompanha a gaveta em vez de chegar inteiro no primeiro frame: a
   mesma duração e a mesma curva do aside, aqui em cima. O display fica de fora
   de propósito — com opacity:0 e display:block o véu continuava a apanhar os
   toques com a gaveta fechada; é o visibility que o tira da frente, e o atraso
   de --medio só o esconde depois de ele ter acabado de desvanecer. */
.scrim{position:fixed;inset:0;background:rgba(6,12,9,.55);z-index:61;opacity:0;visibility:hidden;
  transition:opacity var(--medio) var(--curva-sai),visibility 0s var(--medio)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--blur);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(13px + var(--inset-top)) calc(22px + var(--inset-right)) 13px calc(22px + var(--inset-left));
  display:flex;align-items:center;gap:12px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.02em}
header.top .sub{color:var(--muted);font-size:12px;margin-top:2px}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px;cursor:pointer}
.spacer{flex:1}
.wrap{padding:18px calc(22px + var(--inset-right)) calc(44px + var(--inset-bottom)) calc(22px + var(--inset-left));max-width:1180px;width:100%}
@media(max-width:900px){
  aside{position:fixed;left:0;top:0;transform:translateX(-100%);width:var(--rail);flex-basis:var(--rail)}
  body.open aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.rail aside{width:var(--rail);flex-basis:var(--rail)}
  body.rail .brand .txt,body.rail nav a .txt,body.rail .railbtn .txt{display:block}
  body.rail nav a,body.rail .railbtn{justify-content:flex-start;padding:11px 12px}
  body.open .scrim{opacity:1;visibility:visible;transition:opacity var(--medio) var(--curva),visibility 0s}
  .burger{display:block}
  .wrap{padding:14px calc(15px + var(--inset-right)) calc(44px + var(--inset-bottom)) calc(15px + var(--inset-left))}
  header.top{padding:calc(11px + var(--inset-top)) calc(15px + var(--inset-right)) 11px calc(15px + var(--inset-left))}
}
@media(max-width:520px){.hideS{display:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;max-width:100%}
.cols>*{min-width:0}
/* clicavel: risco de acento a esquerda + reacao ao toque; informativo fica liso */
.card.tap{cursor:pointer;position:relative;overflow:hidden;transition:border-color var(--rapido) var(--curva),transform var(--rapido) var(--curva),background var(--rapido) var(--curva)}
.card.tap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.5}
.card.tap:hover{border-color:var(--line2);background:var(--tint)}
/* 1% não se vê: era a queixa de «não reage ao toque, só muda de cor». As
   linhas de lista são a superfície que mais se toca na app. */
.card.tap:active{transform:scale(.98);background:var(--press)}
.card.tap.pend::before,.card.kpi::before{display:none}
[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{-webkit-tap-highlight-color:transparent}
button,.tap,.selbtn,.selopt,.fold-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:14px}
.kpi .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-size:22px;font-weight:750;margin-top:6px;letter-spacing:-.025em}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.why{cursor:pointer}
.kpi .expl{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.kpi.open .expl{display:block}
.kpi.why::after{content:"?";position:absolute;top:12px;right:13px;width:16px;height:16px;border-radius:50%;
  background:var(--chip);color:var(--muted);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.kpi.open::after{content:"×"}
.card.kpi{position:relative}

/* dica dos gráficos */
.tip{position:fixed;z-index:95;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:9px;
  font-size:12.5px;font-weight:600;pointer-events:none;opacity:0;transition:opacity var(--rapido) var(--curva);max-width:calc(100vw - 16px);text-align:center;line-height:1.35}
.tip.on{opacity:1}
.pos{color:var(--accent)}.neg{color:var(--danger)}.amber{color:var(--warn)}
.section-title{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:550}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.list{display:grid;gap:11px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
.badge.grey{background:var(--chip);color:var(--muted)}
/* no claro, o texto dos alertas desce um tom: 11px pedem 4,5:1 e o tom da
   marca ficava aquém; no escuro os pares originais já passam folgados */
.badge.amber{background:var(--warn-soft);color:#7d5200}
.badge.red{background:var(--danger-soft);color:#9c3a38}
html.dark .badge.amber{color:var(--warn)}
html.dark .badge.red{color:var(--danger)}
.title{font-weight:700;letter-spacing:-.01em}
.small{font-size:12px;color:var(--muted)}
.empty{padding:38px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:var(--card)}
/* o calendário: sete colunas, células quadradas-ish, pontos por tipo */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{margin-bottom:6px}
.calhead span{text-align:center;font-size:11px;color:var(--muted);font-weight:650}
.calday{min-height:52px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;
  display:flex;flex-direction:column;gap:3px;background:var(--card)}
.calday.fora{border:0;background:transparent}
.calday.hoje{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calday .n{font-size:12px;color:var(--muted)}
.calday.hoje .n{color:var(--accent);font-weight:750}
.calday.on{background:var(--accent-soft);border-color:var(--accent)}
.calday.on .n{color:var(--accent);font-weight:750}
.calday.tap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.calday .pts{display:flex;flex-wrap:wrap;gap:2px}
.pt{width:6px;height:6px;border-radius:50%;display:inline-block}
.pt.vis{background:var(--accent)}
.pt.pla{background:var(--warn)}
.pt.mais{background:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:5px}
.row-between{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;min-width:0}
.row-between>*{min-width:0}
.txrow .title,.txrow .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txrow{overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}

html.noscroll{overflow:hidden}
html.noscroll body{overflow:hidden;position:fixed;left:0;right:0;width:100%}
.navh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 4px;opacity:.85;white-space:nowrap}
nav a .cnt{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.kpi.evo{cursor:pointer}
.kpi .kic{position:absolute;top:11px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--muted);display:grid;place-items:center}
/* secções que abrem e fecham */
.sect.fold{padding:0;gap:0}
.fold-head{display:flex;align-items:center;gap:9px;width:100%;max-width:100%;min-width:0;overflow:hidden;padding:12px 14px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);border-radius:14px}
.fold-head:hover{background:var(--tint)}
.fold-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 30px}
.fold-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.form>*{min-width:0}.sect{min-width:0}
.fold-head .fsum{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.fold-head .chev{flex:0 0 auto;color:var(--muted);transition:transform var(--medio) var(--curva)}
.fold.open>.fold-head .chev{transform:rotate(180deg)}
/* A dobra abre e fecha com o display, como sempre; o que é novo é o conteúdo
   entrar. Tem de ser @keyframes e não transition: um elemento que acaba de sair
   do display:none não tem valor antigo de onde partir.
   Animar a ALTURA (grid-template-rows 0fr→1fr) foi tentado e desfeito: medida
   no browser, a linha dimensionada por max-content não interpolava — a dobra
   ficava presa na altura do conteúdo e não chegava a fechar — e o
   overflow:hidden que a técnica obriga recortava os menus dos sel() lá dentro.
   Uma dobra que abre de golpe custa menos do que uma dobra que não fecha.
   A entrada é de quem ABRE: a classe .entra só o toggleFold a põe. Sem ela,
   re-renderizar a janela com a dobra já aberta (escolher uma categoria
   reconstrói tudo) fazia o conteúdo piscar a cada escolha. */
.fold-body{display:none;padding:2px 14px 14px;gap:13px}
.fold.open>.fold-body{display:grid}
.fold.entra.open>.fold-body{animation:foldEntra var(--medio) var(--curva-entra)}
@keyframes foldEntra{from{opacity:0;transform:translateY(-6px)}}
.pend{border-left:3px solid var(--warn)}
.pend.late{border-left-color:var(--danger)}
.legend{display:grid;gap:7px;margin-top:12px;grid-template-columns:minmax(0,1fr)}
.legend>*{min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.legend .li.tap{cursor:pointer;border-radius:8px;margin:0 -4px;padding:2px 4px}
.legend .li.tap:hover{background:var(--chip)}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
/* Em ecrã de dedo, nada abaixo do mínimo de toque. Só em pointer:coarse:
   no rato os tamanhos compactos continuam certos. */
@media(pointer:coarse){
  .btn{min-height:44px}
  .btn.sm{min-height:40px}
  .iconbtn,.burger{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  #nav a{min-height:44px}
  .legend .li.tap{min-height:40px;padding:8px 6px;margin:0 -6px}
  .tag button{min-width:28px;min-height:28px;display:inline-flex;align-items:center;justify-content:center}
  .qclear{min-width:36px;min-height:36px}
  .rich-tools button{min-width:38px;min-height:36px}
  .fold-head{min-height:44px}
}
/* um campo com erro aponta para si próprio, em vez de só um toast longe dele */
.err{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger-soft)}
.req{color:var(--danger);font-weight:700}
/* quem pediu menos movimento ao sistema recebe menos movimento */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* O FAB respeita o recorte lateral em landscape */
body .fab,body .fabmenu{right:calc(18px + var(--inset-right,0px))}
/* A barra de baixo: os quatro destinos quentes a um toque, no telemóvel.
   A gaveta fica para o resto — deixou de ser a única porta. */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  grid-template-columns:repeat(4,1fr);gap:2px;padding:5px calc(6px + var(--inset-right)) calc(5px + var(--inset-bottom)) calc(6px + var(--inset-left))}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;min-height:48px;
  font-size:11px;font-weight:600;color:var(--muted);border-radius:10px;position:relative;cursor:pointer}
.tabbar a.on{color:var(--accent);background:var(--accent-soft)}
/* a barra lateral marca o ativo com um traço à esquerda (nav a.on::before);
   na barra de baixo esse traço aparecia como um risco sem sentido */
.tabbar a.on::before{display:none}
.tabbar a:hover{background:var(--accent-soft);color:var(--accent)}
.tabbar a .cnt{position:absolute;top:1px;left:calc(50% + 7px);background:var(--danger);color:#fff;font-size:10px;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
#hdrBell .cnt{position:absolute;top:1px;right:1px;background:var(--danger);color:#fff;font-size:10px;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
/* body à frente: estas regras vivem ANTES das de base do .fab/.totop na
   folha, e sem mais especificidade perdiam — o FAB ficava em cima da barra */
@media(max-width:900px){
  .tabbar{display:grid}
  .wrap{padding-bottom:calc(96px + var(--inset-bottom))}
  body .fab{bottom:calc(76px + var(--inset-bottom))}
  body .fabmenu{bottom:calc(134px + var(--inset-bottom))}
  body .totop{bottom:calc(76px + var(--inset-bottom))}
  body.open .tabbar{display:none}
}

.donut .pie{flex:0 0 132px;max-width:132px}
.donut .leg{flex:1 1 160px;min-width:0}

.seg{display:grid;gap:8px}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c2{grid-template-columns:repeat(2,1fr)}.seg.c4{grid-template-columns:repeat(4,1fr)}

  .invrow .i-n{grid-area:n}.invrow .i-q{grid-area:q}.invrow .i-s{grid-area:s}}

/* height em dvh: com as barras do browser à mostra, o inset:0 dava a altura
   do ecrã SEM elas, e o modal ficava centrado num espaço maior do que o
   visível — o topo saía por cima e não havia como lá chegar. */
.modal{position:fixed;inset:0;height:100dvh;z-index:60;display:none}
.modal.open{display:block}
.modal.under .sheet{pointer-events:none}
.modal.under .bg{background:rgba(6,12,9,.35)}
.modal .bg{position:absolute;inset:0;touch-action:none;background:rgba(6,12,9,.6)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 28px));max-height:min(88vh,880px);max-height:min(88dvh,880px);background:var(--card);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.sheet .head{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .head h2{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet .body{overscroll-behavior:contain;padding:16px 18px;overflow:auto;scroll-padding-bottom:180px}
.sheet.kb .body{padding-bottom:300px}
.sheet .foot{padding:13px 18px calc(13px + var(--inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px}
.sheet .foot .btn{flex:1;justify-content:center}
.iconbtn{border:0;background:transparent;padding:7px;border-radius:9px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
/* A folha de baixo, no telemovel. O max-height tem de vir em dvh como o de
   cima: esta regra vem depois e, so com vh, desfazia-o. E vh e a altura com
   as barras do browser recolhidas — com a barra de endereco e a de comandos
   a mostra, a folha crescia para alem do que se ve e o topo ficava cortado,
   fora de alcance, porque esta encostada em baixo. */
@media(max-width:520px){.sheet{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:93vh;max-height:93dvh;border-radius:20px 20px 0 0}}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--inset-bottom));transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:90;font-size:13.5px;font-weight:550;opacity:0;transition:opacity var(--medio) var(--curva),transform var(--medio) var(--curva);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast .toastbtn{margin-left:12px;background:none;border:0;color:var(--accent);font:inherit;font-weight:750;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ======================= MOVIMENTO =======================
   Fundações. Tudo o que se mexe cita os tokens do :root (--rapido, --medio,
   --lento, --curva, --curva-sai). O bloco fica no fim da folha de propósito:
   assim os :active e os :focus-visible ganham os empates com os :hover
   declarados acima, sem precisarem de especificidade a mais.

   --- O que se toca reage ao dedo ---
   A app desliga o realce nativo do toque em tudo (o -webkit-tap-highlight-color
   transparente, lá em cima) e até aqui só o .card.tap e o .fab o devolviam. No
   telemóvel não há :hover: sem isto, tocar em «Guardar», numa opção de menu ou
   num separador da barra de baixo não dá sinal nenhum entre o dedo e o
   resultado — lê-se como app parada, e é o que provoca o segundo toque.
   Sempre :active e nunca :hover, que no iOS fica preso depois do toque. */
.btn,.iconbtn,.selbtn,.selopt,.menupop button,.tabbar a,.addbox,.fold-head,
.tagadd,.tag button,.railbtn,nav a,.legend .li.tap,.card.kpi.why,.card.kpi.evo,
.rich-tools button,.qclear,.burger,.totop,.thumb{
  transition:background-color var(--rapido) var(--curva),border-color var(--rapido) var(--curva),
    color var(--rapido) var(--curva),transform var(--rapido) var(--curva)}
.btn:active,.iconbtn:active,.selbtn:active,.selopt:active,.menupop button:active,
.tabbar a:active,.tagadd:active,.tag button:active,.railbtn:active,nav a:active,
.rich-tools button:active,.burger:active,.opt:active{transform:scale(.97)}
/* as superfícies grandes afundam menos — a .99 do .card.tap é a régua */
.addbox:active,.fold-head:active,.legend .li.tap:active,.calday.tap:active,
.card.kpi.why:active,.card.kpi.evo:active{transform:scale(.98)}
/* estes dois já usam o transform para se posicionarem: o scale entra a seguir
   ao que lá está, senão saltavam do sítio ao serem premidos */
.totop:active{transform:translateX(-50%) scale(.94)}
.qclear:active{transform:translateY(-50%) scale(.9)}
/* O fundo premido é o --press, e nunca o --chip: medido, cinco pares
   :hover/:active pintavam-se da mesma cor (.iconbtn, .selopt, .menupop
   button, .legend .li.tap e .btn.primary). Com rato, o ponteiro fica em cima
   depois do clique, o :hover mantém a cor, e o toque seguinte não muda nada —
   a app parecia deixar de responder ao segundo toque. Com uma cor própria,
   premido nunca pode ser igual a passar por cima.
   Só onde há fundo neutro para escurecer: quem já está ativo (.on) fica com o
   seu, e a gaveta tem paleta própria. */
.btn:active,.iconbtn:active,.selbtn:active,.selopt:active,.menupop button:active,
.addbox:active,.fold-head:active,.tagadd:active,.legend .li.tap:active,
.rich-tools button:active,.burger:active,.totop:active,.qclear:active,
.tabbar a:not(.on):active,.calday.tap:not(.on):active,.opt:not(.on):active{background:var(--press)}
/* o :hover já usava o --accent-press: sem uma cor mais funda, premir um
   botão primário com o rato em cima não mudava nada */
.btn.primary:active{background:var(--accent-fundo);border-color:var(--accent-fundo)}
.btn.danger:active{background:var(--danger-soft)}
nav a:active,.railbtn:active{background:var(--side-on);color:#fff}
/* o FAB tinha o scale(.96) declarado e nenhuma transição para o executar:
   descia e subia em zero frames, na peça mais tocada da app */
.fab{transition:transform var(--rapido) var(--curva)}

/* Rede do premido, a par da do foco: o tornarFocavel dá role=button a tudo o
   que tem onclick, e medi cinco sítios só na visão geral que reagiam ao toque
   com nada. Fica por baixo das regras de cima na especificidade, por isso
   quem já tem o seu (o .card.tap, por exemplo) mantém-no. */
[role="button"]:active,.tap:active{transform:scale(.98)}
[role="button"]:not(.on):active,.tap:not(.card):not(.on):active{background:var(--press)}

/* --- O foco desenha-se ---
   O tornarFocavel() dá tabindex e role=button a todos os cartões com onclick, e
   até aqui só os campos e os dias do calendário tinham anel. :focus-visible e
   nunca :focus: quem chega de rato não pode deixar anéis por onde passa. */
.btn:focus-visible,.iconbtn:focus-visible,.selbtn:focus-visible,.selopt:focus-visible,
.menupop button:focus-visible,.tabbar a:focus-visible,nav a:focus-visible,
.railbtn:focus-visible,.opt:focus-visible,.fold-head:focus-visible,
.addbox:focus-visible,.tagadd:focus-visible,.tag button:focus-visible,
.card.tap:focus-visible,.card.kpi.why:focus-visible,.card.kpi.evo:focus-visible,
.legend .li.tap:focus-visible,.thumb:focus-visible,.fab:focus-visible,
.burger:focus-visible,.totop:focus-visible,.qclear:focus-visible,
.rich-tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Rede de segurança, e não repetição: o tornarFocavel (vistas.js:tornarFocavel)
   põe tabindex e role=button em TUDO o que tem onclick — cartões, linhas de
   lista, e até as formas dos gráficos. Medido na visão geral: dezanove dos
   trinta e nove sítios que o Tab alcança não tinham anel nenhum, por não
   caberem em nenhuma das classes acima. */
[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* A gaveta tem fundo próprio e escuro: medido, o --accent (#244c3b) sobre o
   --side (#1a3a2c) dá 1.29:1 — o anel existia e não se via. Aqui o contraste
   vem da paleta da própria gaveta. */
nav a:focus-visible,.railbtn:focus-visible{outline-color:var(--side-ink)}

/* --- Janelas, folhas e menus entram ---
   O modal é criado e recebe .open no mesmo instante (componentes.js:modalLayer
   escreve className='modal open' e só depois é que o openModal faz o
   appendChild): uma transition não tem valor antigo de onde partir num nó
   acabado de inserir, e por isso a entrada escreve-se em @keyframes. Só a
   entrada — animar a saída obriga a adiar o M.el.remove() do closeModal e a
   mexer na pilha de janelas, e isso é outra conversa. */
@keyframes veuEntra{from{opacity:0}}
@keyframes folhaEntra{from{opacity:0;transform:translate(-50%,-50%) translateY(14px) scale(.98)}}
@keyframes folhaSobe{from{transform:translateY(100%)}}
@keyframes popEntra{from{opacity:0;transform:scale(.96)}}
.modal.open .bg{animation:veuEntra var(--lento) var(--curva-entra)}
.modal.open .sheet{animation:folhaEntra var(--lento) var(--curva-entra)}
/* abaixo dos 520px a janela é uma folha encostada em baixo: o gesto que o
   sistema ensina é subir, e até aqui ela materializava-se feita */
@media(max-width:520px){.modal.open .sheet{animation:folhaSobe var(--lento) var(--curva-entra)}}
/* a origem é o lado por onde o menu nasce: o do sel() cai do botão, o das
   ações abre do canto direito e o do FAB sobe do canto de baixo */
.selpop.on{transform-origin:top center;animation:popEntra var(--rapido) var(--curva)}
.menupop.on{transform-origin:top right;animation:popEntra var(--rapido) var(--curva)}
.fabmenu.on{transform-origin:bottom right;animation:popEntra var(--rapido) var(--curva)}

/* --- O que muda num nó vivo ---
   Os casos raros em que a classe troca sem o nó ser recriado, e portanto os
   únicos em que uma transition dispara mesmo: o dia escolhido do calendário
   (calendario.js:calSel troca o .on sem redesenhar a grelha) e o separador
   ativo da barra de baixo. */
.calday{transition:background-color var(--rapido) var(--curva),border-color var(--rapido) var(--curva),
  color var(--rapido) var(--curva),transform var(--rapido) var(--curva)}
.calday .n{transition:color var(--rapido) var(--curva)}
/* o âmbar→vermelho do planeado em atraso e o selo: hoje o nó é sempre outro
   (o render recria a lista), mas a regra fica escrita para quando não for */
.pend{transition:border-left-color var(--medio) var(--curva)}
.badge{transition:background-color var(--medio) var(--curva),color var(--medio) var(--curva)}
/* o «porquê» do KPI é display:none→block e o texto vem solto dentro do .expl,
   sem elemento onde pendurar o 0fr→1fr da grelha (o vistas.js:kpi escreve-o
   assim); a alternativa era um max-height adivinhado, e o WHY mais longo já
   passa das doze linhas num cartão de 158px. Daí uma entrada em @keyframes,
   que num display a acender dispara à mesma. */
@keyframes explEntra{from{opacity:0;transform:translateY(-4px)}}
.kpi.open .expl{animation:explEntra var(--medio) var(--curva)}

/* --- Crachás que aparecem com um pulso ---
   O .cnt é recriado a cada buildNav/buildTabbar/notifSino, portanto uma
   transition nunca chegaria a disparar — um @keyframes de entrada dispara
   sempre, que é precisamente quando a contagem muda. */
@keyframes selo{from{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}}
/* só quando o número MUDA. O buildNav corre a cada render, e o render corre
   também na sincronização de fundo (cloud/nucleo.js:applyState, de 3 em 3
   minutos): sem o .novo, a app dava um pulso sozinha sem nada ter acontecido.
   Quem decide é o navegacao.js:cntNovo, que guarda a contagem anterior. */
.cnt.novo{animation:selo var(--pulso) var(--curva) both}

/* --- Os gráficos desenham-se ---
   As classes são postas pelo graficos.js; aqui ficam só as regras. O
   transform-box:fill-box é o que faz o transform-origin de um <rect> em SVG
   valer sobre a própria forma, e não sobre o sistema de coordenadas todo; sem
   ele a barra crescia a partir do canto do viewBox. O .gdonut conta com
   pathLength="1" nos paths, que é o que torna o dashoffset independente do
   comprimento real do arco. */
@keyframes gbar{from{transform:scaleY(0)}}
@keyframes ghbar{from{transform:scaleX(0)}}
@keyframes gdonut{from{stroke-dashoffset:1}}
/* Só quem CHEGA ao ecrã vê os gráficos desenharem-se: a marca .entra é posta
   pelo vistas.js:render e só quando foi uma navegação a pedir a repintura.
   Sem este portão, a sincronização de fundo (cloud/nucleo.js:applyState) e
   qualquer gesto que repinte a vista — fechar o cartão dos prazos, mudar um
   filtro — mandavam os gráficos redesenharem-se a meio de uma leitura.
   O escalonamento é escrito pelo graficos.js em cada barra: em SVG as barras
   são irmãs dos onze elementos do eixo, e um nth-child contava-os a todos (a
   primeira barra ficava com o último degrau); nas horizontais o .ghbar é
   sempre filho único, e nenhuma regra chegava a casar. */
#view.entra .gbar{transform-box:fill-box;transform-origin:bottom;animation:gbar var(--desenho) var(--curva-entra) both}
#view.entra .ghbar{transform-origin:left;animation:ghbar var(--desenho) var(--curva-entra) both}
#view.entra .gdonut{stroke-dasharray:1;animation:gdonut var(--desenho) var(--curva-entra) both}
</style>
</head>
